id: T-HALLUCINATION
title: Misleading or erroneous output → wrong decision
harm: wrong-decision
surface:
- user-agent
source:
- hallucination
- error
weaknesses:
- component: model
  text: The agent produces a confidently phrased, human-read answer with factually wrong statements (fabricated facts, non-existent references/APIs/documents); credibility is judged by form, not content.
  nature: targeted
- component: model
  text: A flaw in the reasoning chain (an unfounded logical leap, mistaking correlation for causation, wrong classification) leads to a wrong conclusion or choice of tool/action.
  nature: targeted
- component: model
  text: The agent builds a confident but wrong output from free-form text that arrived in a tool's output.
  nature: targeted
- component: model
  text: 'Context confusion between projects/environments: a configuration or action from one environment is applied to another (production vs development).'
  nature: targeted
- component: downstream
  text: The user over-trusts the agent's authoritative style and accepts the output without verification; even a correct answer is extrapolated beyond its bounds of applicability.
  nature: targeted
reachability: NOT applicable if the agent's output feeds no consequential decisions or actions — not consumed by a downstream system and not a basis for human decisions.
mitigations:
- id: CTRL-AGENT-REPORT
  strength: gating
  rationale: Agent reporting of confidence and limitations helps the user correctly assess the risks
- id: CTRL-FACT-CHECKING
  strength: gating
  rationale: 'Fact-checking against external sources catches hallucinations caused by incorrect tool output


    Fact-checking against external sources catches model hallucinations'
- id: CTRL-HUMAN-IN-LOOP
  strength: gating
  rationale: 'A human reviews critical agent actions before execution


    Human oversight of critical decisions reduces the risk of blind trust in the AI'
- id: CTRL-OUTPUT-VALIDATION
  strength: gating
  rationale: Validation of the result before it is applied
- id: CTRL-PLAN-CONFIRMATION
  strength: gating
  rationale: Presenting the plan to the user before execution provides a chance to catch reasoning errors at an early stage
- id: CTRL-PLAN-VALIDATION
  strength: gating
  rationale: Validation of the action plan before execution reveals logical errors
- id: CTRL-SOURCE-REFERENCES
  strength: gating
  rationale: 'Requiring source references allows verification of the information''s accuracy


    Requiring source references allows verification of the accuracy of data from tool output'
- id: CTRL-TOOL-CALL-VALIDATION
  strength: gating
  rationale: Validation of tool selection before execution catches selection errors (actions instead of reads, destructive operations instead of viewing)
references: []
tags: []
