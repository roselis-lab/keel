id: T-SHADOW-AI
title: Unsanctioned or excessive use of external AI tools (Shadow AI)
harm: data-exposed
surface:
- user-agent
source:
- internal
- accident
weaknesses:
- component: downstream
  text: 'In an uncontrolled environment (client machine, employee workstation) the user offloads corporate data — code, documents, client information — to external AI services beyond the perimeter: public chatbots, third-party plugins, unsanctioned IDE extensions; the data enters an external contour with no DLP or processing agreements.'
  nature: targeted
reachability: NOT applicable if external AI services are technically unreachable from the user's environment, or there is no corporate data in it worth offloading.
mitigations:
- id: CTRL-EXTERNAL-AI-WARNING
  strength: gating
  rationale: Warnings about the risks of using external AI raise employee awareness
- id: CTRL-SHADOW-AI-POLICY
  strength: gating
  rationale: Corporate policy governs permitted AI tools and sanctions for violations
references: []
tags: []
