id: T-SUPPLY-DEPS
title: Installation of hallucinated packages
harm: code-execution
surface:
- agent-environment
source:
- hallucination
weaknesses:
- component: downstream
  text: The agent generates a dependency-install command (npm/pip/go) based on a hallucinated name or a typo; the package does not exist or exists from a different publisher (typosquat/dependency-confusion), and code from an unverified source executes with full access to the environment.
  nature: targeted
reachability: NOT applicable if the agent's output cannot lead to dependency installation — it generates no install commands, or there is no path from recommendation to execution.
mitigations:
- id: CTRL-INSTALL-COMMAND-BLOCK
  strength: gating
  rationale: Blocking automatic install commands prevents the agent from executing generated installation commands without review
- id: CTRL-INTERNAL-REGISTRY
  strength: gating
  rationale: An internal registry with an allowlist ensures that only vetted packages are used
- id: CTRL-PACKAGE-VALIDATION
  strength: gating
  rationale: Checking for a package's existence in the registry before installation reveals typo-squatting attacks
- id: CTRL-SUPPLY-CHAIN-SCANNING
  strength: gating
  rationale: SCA scanning of dependencies reveals known vulnerabilities and malicious packages
references: []
tags: []
