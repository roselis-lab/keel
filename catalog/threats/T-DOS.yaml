id: T-DOS
title: Resource / cost exhaustion (token-DoS)
harm: downtime
surface:
- user-agent
- agent-agent
source:
- external-attacker
- accident
weaknesses:
- component: model
  text: 'User input exhausts resources: long prompts, recursive requests, triggering heavy processing.'
  nature: targeted
- component: tool
  text: Recursive delegation between agents or an infinite tool-call loop with no depth/iteration limit exhausts compute and message queues.
  nature: targeted
- component: model
  text: Free-form text from a tool's output crafted for recursive or resource-heavy processing by the agent.
  nature: targeted
- component: tool
  text: A tool with network access is used for mass/resource-heavy outbound requests.
  nature: targeted
reachability: NOT applicable if the reachable endpoint accepts no untrusted/unbounded input and initiates no inter-agent or tool loops (no delegation, fixed depth), or the resource is not shared with other consumers.
mitigations:
- id: CTRL-ITERATION-LIMITS
  strength: gating
  rationale: Limiting recursion depth and iteration count prevents infinite loops
- id: CTRL-RATE-LIMITING
  strength: gating
  rationale: 'Rate limiting prevents abuse of tools with network access


    Rate limiting on tool requests prevents DoS via bulk crafted output


    Rate limiting on user requests prevents DoS via user input'
- id: CTRL-RESOURCE-QUOTAS
  strength: gating
  rationale: 'Resource quotas limit CPU/memory/network consumption by tools


    Resource quotas (CPU, memory, time) protect against DoS via recursion'
- id: CTRL-TOKEN-LIMITS
  strength: gating
  rationale: 'Token limits prevent resource exhaustion via long prompts


    Token limits prevent resource exhaustion via long tool output'
references: []
tags: []
