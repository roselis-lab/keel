id: T-DOS
title: Unbounded input or an unbounded loop consumes what others need
harm: downtime
source:
- external-attacker
- model-mistake
- accident
- internal
- error
weaknesses:
- component: model
  surface:
  - user-input
  text: Input reaches the model with no bound on its size or on the work it triggers - a very long prompt, a request that unfolds into heavy processing - and the cost is paid from a pool others draw on.
  nature: targeted
- component: model
  surface:
  - user-input
  text: A short input triggers unbounded work on the output side - long or repeated generation, hidden reasoning, retries and fallback calls - and none of it is counted against a limit the caller can hit, so a sponge-style prompt costs far more than its size suggests.
  nature: targeted
- component: tool
  surface:
  - agent-message
  text: Agents delegate to one another, or a tool loop runs, with no limit on depth or iteration count, so a cycle or a runaway plan consumes compute and queue capacity until something outside it stops.
  nature: targeted
- component: tool
  surface:
  - agent-message
  text: Delegated branches each get their own step or token budget instead of drawing on one allocation for the operation, so every call stays within its bound while the operation as a whole exhausts the pool.
  nature: targeted
- component: model
  surface:
  - tool-output
  text: Free-form text returned by a tool is processed with no bound on the work it may trigger, so a payload shaped for recursion or heavy processing arrives through an unsanitized channel nobody rate-limits.
  nature: targeted
- component: tool
  surface:
  - model-output
  text: A tool with network access sends requests outward with no cap on volume or rate, so the model can be steered or can err into a flood that exhausts the organization's egress, quota or bill.
  nature: targeted
- component: downstream
  surface:
  - model-output
  text: A model-controlled query or job is admitted by a downstream service based on syntax and operation permission alone, while its expansion, execution time and resource demand are not bounded at that service; one accepted request can monopolize the service.
  nature: targeted
- component: downstream
  surface:
  - model-output
  text: The downstream service accepts concurrent or repeated work from an agent without an aggregate allocation for that caller, and continues jobs after the agent times out or retries, so remote work accumulates independently of the agent's local limits.
  nature: targeted
- component: tool
  surface:
  - tool-output
  text: A tool result is decompressed or parsed before byte, expansion, nesting and time limits apply, so an oversized result consumes the parser allocation before any model token limit.
  nature: targeted
reachability: The endpoint accepts no untrusted or unbounded input, initiates no inter-agent or tool loops, and its tools have no unmetered outbound path or unbounded result decoding. The condition must also cover hidden inference work, retries, delegated branches and resource-consuming downstream jobs, including work retained after a client timeout. A dedicated allocation is still material if depleting it exhausts service capacity or the payer's budget.
mitigations:
- id: CTRL-ITERATION-LIMITS
  strength: gating
  rationale: 'Closes the loop weakness: depth, iteration count and total steps per task are bounded, so a cycle terminates at the bound rather than at exhaustion.'
- id: CTRL-TASK-RESOURCE-BUDGET
  strength: gating
  rationale: 'Closes aggregate amplification across retries, delegated branches and resumed tasks by reserving each call against one root-task budget. Per-call limits alone do not bound their sum.'
- id: CTRL-TOKEN-LIMITS
  strength: gating
  rationale: 'Closes the size half of the input weakness and the tool-output weakness: the tokens a request or a tool result may carry are capped, so the largest unit of work has a known ceiling.'
- id: CTRL-RATE-LIMITING
  strength: gating
  rationale: 'Closes the rate half of the input weakness and the outbound weakness: requests per user and calls per tool are capped, so neither a caller nor a steered tool can turn volume into exhaustion.'
- id: CTRL-RESOURCE-QUOTAS
  strength: gating
  rationale: 'Closes all four weaknesses at the floor: hard limits on CPU, memory and bandwidth per agent and tool mean that whatever the path, consumption stops at the quota rather than at the shared pool''s end. These are the four agent/tool-runtime paths above; a remote service outside that enforced allocation needs its own work limits. Local quotas do not bound its query cost or retained jobs.'
- id: CTRL-DOWNSTREAM-WORK-LIMITS
  strength: gating
  rationale: 'Bounds admission, concurrency and active work in the downstream executing service, including a single expensive request and work retained after timeout. It closes that service-side resource path; it does not cap independent inference work.'
- id: CTRL-INPUT-FILTERING
  strength: soft
  rationale: 'Filters the input and tool-output paths: schema validation, normalization, encoding checks and rejection of known abusive patterns keep malformed or obviously hostile payloads from reaching the model or tool. It does not close the weakness, because valid-looking text can still trigger heavy work and novel or encoded recursion cannot be reliably detected by filtering.'
- id: CTRL-TOOL-RESULT-VALIDATION
  strength: gating
  rationale: 'Bounds tool-result decoding and checks its locally accepted contract before context assembly, closing the oversized-result parser path. Valid text can still trigger expensive reasoning or actions.'
- id: CTRL-GENERATION-LOOP-DETECTION
  strength: soft
  rationale: 'Cancels a detected literal generation loop before the hard per-call limit. It does not close the threat: hidden reasoning, paraphrased or nonrepetitive work and missed loops still consume their allowed budget.'
references:
- title: OpenAI ChatGPT Crawler Reflective DDoS Vulnerability
  url: https://github.com/bf/security-advisories/blob/main/2025-01-ChatGPT-Crawler-Reflective-DDOS-Vulnerability.md
  note: 'The outbound weakness: the attributions endpoint fetched every URL in a list with no cap on its length, so one request turned OpenAI''s crawler into a flood against a site of the caller''s choosing. OpenAI disabled the endpoint after public disclosure.'
- title: vLLM 0.5.2.2 vulnerable to Denial of Service (CVE-2024-11040)
  url: https://github.com/advisories/GHSA-hhr6-7642-8pmh
  note: 'The user-input weakness, the work-it-triggers half: one completions request with beam search and a high best_of hangs the engine and blocks new requests for everyone - the cost is paid from the shared pool.'
- title: An Engorgio Prompt Makes Large Language Model Babble on
  url: https://arxiv.org/abs/2412.19394
  note: 'Measures the user-input weakness: crafted prompts suppress the end-of-sequence token and drive thirteen open models to two to thirteen times longer outputs, reaching over 90% of the length limit, with a run against a resource-limited service showing the availability hit (ICLR 2025).'
- title: 'RecurGuard: Runtime Monitoring for Reasoning-Token Consumption Attacks'
  url: https://arxiv.org/abs/2606.07968
  note: 'Shows reasoning-token consumption through injected decoy tasks and a semantic trace monitor with adaptive misses. This is a path that literal repetition detection does not close.'
- title: vLLM SamplingParams repetition detection
  url: https://docs.vllm.ai/en/stable/api/vllm/sampling_params/
  note: 'The inference engine exposes repetition_detection for ending repetitive N-gram generation early. It supports the literal-loop control, not a guarantee against semantic or hidden reasoning loops.'
- title: 'GitLab: nested GraphQL query denial of service, CVE-2019-18455'
  url: https://gitlab.com/gitlab-org/gitlab/-/issues/30096
  note: A disclosed endpoint accepted nested queries whose expansion caused denial of service; GitLab fixed it in 12.4.1. This is evidence for the downstream query boundary, not an observed AI-agent incident.
positioning: LLM10 (Unbounded Consumption) lines up with this record and also names model extraction through high-volume querying, which is a disclosure of the model rather than an exhaustion of shared resources and is not modelled here.
