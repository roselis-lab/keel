id: T-CRED-THEFT
title: Privilege abuse / credential theft via MCP
harm: code-execution
surface:
- agent-environment
- agent-agent
source:
- external-attacker
- internal
weaknesses:
- component: identity-store
  text: The agent or tool holds a privileged token with broad scope (a service account with excessive rights, OAuth on-behalf-of the user); token compromise grants access to resources within those rights without additional authentication.
  nature: targeted
- component: tool
  text: 'An MCP connection to a tool without authentication: any agent or service on the network invokes tools through it.'
  nature: targeted
- component: identity-store
  text: A token with excessive rights is passed to the agent-tool boundary (including into a browser or insecure environment) and can be intercepted.
  nature: targeted
reachability: NOT applicable if tokens are narrowly scoped (least scope, separate accounts per operation) and unreachable from a compromisable point, or the tools carry no privileges beyond what the caller already has.
mitigations:
- id: CTRL-AUDIT-LOGGING
  strength: gating
  rationale: 'Logging of all operations performed on behalf of the user


    Auditing all credential operations enables detection of anomalous activity'
- id: CTRL-MCP-REGISTRY
  strength: gating
  rationale: Registry of MCP servers with a mandatory authentication policy
- id: CTRL-PRIVILEGE-CONTROL
  strength: gating
  rationale: 'Restricting service account permissions reduces risk in case of compromise


    Restricting token scopes to the minimum


    Least privilege limits the consequences of unauthorized access


    The principle of least privilege limits the consequences of token compromise'
- id: CTRL-TOKEN-PROTECTION
  strength: gating
  rationale: 'Secure storage of credentials prevents their theft from tools


    Protecting delegated tokens from theft


    Protecting tokens from leakage through encryption and secure storage'
- id: CTRL-TRANSPORT-AUTH
  strength: gating
  rationale: 'mTLS or API-key authentication of MCP connections prevents unauthorized calls


    mTLS or API-key authentication protects the channel'
references: []
tags: []
