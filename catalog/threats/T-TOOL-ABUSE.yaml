id: T-TOOL-ABUSE
title: Unauthorized or destructive tool action
description: The agent forms a tool call with parameters the user did not request,
  or initiates a destructive/irreversible operation — under injection, a reasoning
  error, or goal hijacking. The tool performs an action with real side effects, and
  the system records it as legitimate because the call went through the regular channel.
  Distinguishing the substitution from a deliberate user action is impossible — the
  arguments were generated by the model. Confirmation checkpoints (HITL) lose their
  protective function if they are not risk-differentiated or are devalued by approval
  fatigue.
impact_class: infrastructure-execution
vulnerability:
- A reachable tool performs destructive/irreversible or privileged operations (delete,
  admin, exec, persistent side effects), and the call is initiated by the model with
  no out-of-model authorization on the action itself.
- Arguments or the choice of action are formed by the model and hijacked via injection
  (direct into the input, indirect in a tool's free-form output, in a file with hidden
  instructions) or agent goal substitution; the tool performs an action the user did
  not request.
- A tool with terminal/shell access is invoked on the model's initiative — a direct
  path to RCE.
- 'The confirmation mechanism (HITL) is not risk-differentiated and is devalued by
  a stream of identical requests: a critical action is approved mechanically.'
reachability: NOT applicable if the reachable tools have no operations with real consequences
  (read-only, no side effects), or the model influences neither the choice of tool
  nor its arguments (a rigidly predefined pipeline).
tags: []
mitigations:
- mitigation_id: CTRL-AGENT-ISOLATION
  rationale: Sandbox isolation reduces the number of approval prompts by moving non-critical
    operations into an isolated environment
- mitigation_id: CTRL-APPROVAL-THROTTLING
  rationale: Throttling and batching of confirmation requests reduce cognitive load
    and prevent mechanical approval
- mitigation_id: CTRL-ARG-VALIDATION
  rationale: 'Strict validation of tool call arguments blocks injection vectors


    Input validation protects tools with unstructured input from manipulation


    Strict validation of tool call arguments blocks injection vectors


    Validation of tool call arguments blocks injection'
- mitigation_id: CTRL-AUDIT-LOGGING
  rationale: Auditing all tool operations enables detection of abuse
- mitigation_id: CTRL-COMMAND-SANDBOX
  rationale: A command allowlist restricts the tool's executable actions
- mitigation_id: CTRL-CONTENT-STRIPPING
  rationale: Removing hidden instructions from files (HTML comments, metadata) prevents
    injection
- mitigation_id: CTRL-EXTERNAL-CONTENT-SANDBOX
  rationale: 'Processing files in an isolated environment limits the consequences
    of injection


    Isolating external content in a sandbox prevents indirect injection via malicious
    data'
- mitigation_id: CTRL-FATIGUE-DETECTION
  rationale: Detection of approval-fatigue patterns identifies mechanical approval
    and escalates critical actions
- mitigation_id: CTRL-GOAL-VALIDATION
  rationale: Validation of the agent's goals at each step detects tampering with the
    objective function
- mitigation_id: CTRL-HACT-CRITICAL
  rationale: Mandatory human confirmation for critical tools ensures that fatigue
    does not lead to critical actions being missed
- mitigation_id: CTRL-HUMAN-IN-LOOP
  rationale: 'Human confirmation before executing shell commands via a tool


    Human confirmation of destructive operations prevents irreversible consequences


    Human oversight of critical actions prevents execution of tampered goals'
- mitigation_id: CTRL-INPUT-FILTERING
  rationale: 'Filtering input for prompt injection


    Input filtering sanitizes user input, preventing direct injection and encoded
    jailbreak patterns


    Filtering tool output before adding it to context detects embedded instructions
    and jailbreak patterns'
- mitigation_id: CTRL-INPUT-PARAMETERIZATION
  rationale: 'Parameterizing input instead of free text reduces the attack surface


    Parameterized calls instead of string concatenation prevent injection'
- mitigation_id: CTRL-IRREVERSIBLE-ACTION-GUARD
  rationale: A guard against irreversible actions requires additional confirmation
    and logging
- mitigation_id: CTRL-OUTPUT-VALIDATION
  rationale: 'Checking generated arguments before passing them to the tool


    Checking output for policy compliance blocks the results of a successful guardrail
    bypass


    Checking output for policy compliance blocks the results of an indirect guardrail
    bypass via tool output'
- mitigation_id: CTRL-PROMPT-HARDENING
  rationale: 'Prompt hardening protects against injection via file contents


    Hardening the system prompt against prompt injection


    Hardening the system prompt makes it resistant to override attempts and alignment
    bypass


    Hardening the system prompt separates instructions from external content and withstands
    alignment bypass from tool output'
- mitigation_id: CTRL-RISK-BASED-APPROVAL
  rationale: 'Differentiated approval by risk level focuses the user''s attention
    on critical operations, reducing fatigue from routine ones


    Differentiated approval by action risk groups requests by criticality, reducing
    the stream of repetitive confirmations'
- mitigation_id: CTRL-SESSION-SCOPED-PERMS
  rationale: Session-scoped permissions reduce the number of prompts by pre-approving
    safe operations within the session
- mitigation_id: CTRL-TOOL-ALLOWLIST
  rationale: An allowlist of permitted tools limits exposure of destructive operations
    to only those tools the agent actually needs
