id: T-TOOL-ABUSE
title: Unauthorized or destructive tool action
harm: code-execution
surface:
- agent-environment
- user-agent
source:
- external-attacker
- hallucination
weaknesses:
- component: tool
  text: A reachable tool performs destructive/irreversible or privileged operations (delete, admin, exec, persistent side effects), and the call is initiated by the model with no out-of-model authorization on the action itself.
  nature: targeted
- component: tool
  text: Arguments or the choice of action are formed by the model and hijacked via injection (direct into the input, indirect in a tool's free-form output, in a file with hidden instructions) or agent goal substitution; the tool performs an action the user did not request.
  nature: secondary
- component: tool
  text: A tool with terminal/shell access is invoked on the model's initiative — a direct path to RCE.
  nature: secondary
- component: tool
  text: 'The confirmation mechanism (HITL) is not risk-differentiated and is devalued by a stream of identical requests: a critical action is approved mechanically.'
  nature: secondary
reachability: NOT applicable if the reachable tools have no operations with real consequences (read-only, no side effects), or the model influences neither the choice of tool nor its arguments (a rigidly predefined pipeline).
mitigations:
- id: CTRL-AGENT-ISOLATION
  strength: gating
  rationale: Sandbox isolation reduces the number of approval prompts by moving non-critical operations into an isolated environment
- id: CTRL-APPROVAL-THROTTLING
  strength: gating
  rationale: Throttling and batching of confirmation requests reduce cognitive load and prevent mechanical approval
- id: CTRL-ARG-VALIDATION
  strength: gating
  rationale: 'Strict validation of tool call arguments blocks injection vectors


    Input validation protects tools with unstructured input from manipulation


    Strict validation of tool call arguments blocks injection vectors


    Validation of tool call arguments blocks injection'
- id: CTRL-AUDIT-LOGGING
  strength: gating
  rationale: Auditing all tool operations enables detection of abuse
- id: CTRL-COMMAND-SANDBOX
  strength: gating
  rationale: A command allowlist restricts the tool's executable actions
- id: CTRL-CONTENT-STRIPPING
  strength: soft
  rationale: Removing hidden instructions from files (HTML comments, metadata) prevents injection
- id: CTRL-EXTERNAL-CONTENT-SANDBOX
  strength: gating
  rationale: 'Processing files in an isolated environment limits the consequences of injection


    Isolating external content in a sandbox prevents indirect injection via malicious data'
- id: CTRL-FATIGUE-DETECTION
  strength: gating
  rationale: Detection of approval-fatigue patterns identifies mechanical approval and escalates critical actions
- id: CTRL-GOAL-VALIDATION
  strength: gating
  rationale: Validation of the agent's goals at each step detects tampering with the objective function
- id: CTRL-HACT-CRITICAL
  strength: gating
  rationale: Mandatory human confirmation for critical tools ensures that fatigue does not lead to critical actions being missed
- id: CTRL-HUMAN-IN-LOOP
  strength: gating
  rationale: 'Human confirmation before executing shell commands via a tool


    Human confirmation of destructive operations prevents irreversible consequences


    Human oversight of critical actions prevents execution of tampered goals'
- id: CTRL-INPUT-FILTERING
  strength: soft
  rationale: 'Filtering input for prompt injection


    Input filtering sanitizes user input, preventing direct injection and encoded jailbreak patterns


    Filtering tool output before adding it to context detects embedded instructions and jailbreak patterns'
- id: CTRL-INPUT-PARAMETERIZATION
  strength: gating
  rationale: 'Parameterizing input instead of free text reduces the attack surface


    Parameterized calls instead of string concatenation prevent injection'
- id: CTRL-IRREVERSIBLE-ACTION-GUARD
  strength: gating
  rationale: A guard against irreversible actions requires additional confirmation and logging
- id: CTRL-OUTPUT-VALIDATION
  strength: gating
  rationale: 'Checking generated arguments before passing them to the tool


    Checking output for policy compliance blocks the results of a successful guardrail bypass


    Checking output for policy compliance blocks the results of an indirect guardrail bypass via tool output'
- id: CTRL-PROMPT-HARDENING
  strength: soft
  rationale: 'Prompt hardening protects against injection via file contents


    Hardening the system prompt against prompt injection


    Hardening the system prompt makes it resistant to override attempts and alignment bypass


    Hardening the system prompt separates instructions from external content and withstands alignment bypass from tool output'
- id: CTRL-RISK-BASED-APPROVAL
  strength: gating
  rationale: 'Differentiated approval by risk level focuses the user''s attention on critical operations, reducing fatigue from routine ones


    Differentiated approval by action risk groups requests by criticality, reducing the stream of repetitive confirmations'
- id: CTRL-SESSION-SCOPED-PERMS
  strength: gating
  rationale: Session-scoped permissions reduce the number of prompts by pre-approving safe operations within the session
- id: CTRL-TOOL-ALLOWLIST
  strength: gating
  rationale: An allowlist of permitted tools limits exposure of destructive operations to only those tools the agent actually needs
references: []
tags: []
