id: T-CODEGEN
title: Malicious code and command generation
harm: code-execution
surface:
- agent-environment
- user-agent
source:
- external-attacker
- hallucination
weaknesses:
- component: downstream
  text: The agent's output reaches an executing sink (CI/CD, eval/exec, database) and runs without sanitization/review; vulnerable code arises via injection into the input or the model reproducing insecure patterns.
  nature: targeted
- component: downstream
  text: The agent's output is rendered as HTML/Markdown in the user UI without escaping — the generated markup executes in the browser (XSS).
  nature: targeted
- component: tool
  text: Code is assembled from free-form text that arrived in a tool's output (indirect injection) and goes on to execution/render.
  nature: targeted
- component: tool
  text: Output is passed to a tool that accepts and executes arbitrary input (shell/eval), with no "text" vs "command" separation.
  nature: targeted
reachability: NOT applicable if the agent's output is text for a human only — not executed and not rendered as active content — and there is no tool that executes arbitrary input.
mitigations:
- id: CTRL-AI-CODE-REVIEW
  strength: gating
  rationale: 'Security review of AI-generated code produced under the influence of external content


    Elevated security review for AI-generated code


    Code review focused on secrets


    Security engineer review of configurations'
- id: CTRL-CODE-SANDBOX
  strength: gating
  rationale: 'Code execution in an isolated environment


    Isolated execution of generated code prevents damage to the host system'
- id: CTRL-CONTENT-STRIPPING
  strength: soft
  rationale: Indirect injection via external/free-form content is the vector for this threat; stripping hidden instructions reduces the likelihood (soft).
- id: CTRL-EXTERNAL-CONTENT-SANDBOX
  strength: gating
  rationale: Indirect injection via external content is the vector for this threat; isolating external content limits its impact.
- id: CTRL-INPUT-FILTERING
  strength: soft
  rationale: Filtering tool output before adding it to context prevents malicious instructions from influencing code generation
- id: CTRL-OUTPUT-ENCODING
  strength: gating
  rationale: 'Output encoding prevents XSS when rendering HTML/Markdown


    Output encoding prevents XSS when rendering HTML/Markdown containing malicious data from tools'
- id: CTRL-OUTPUT-VALIDATION
  strength: gating
  rationale: 'Output validation before rendering blocks malicious content from tool output


    Scanning output for secrets


    Validation of configurations against security best practices


    Output validation before rendering blocks malicious content


    Checking generated code for safety before execution'
- id: CTRL-PROMPT-HARDENING
  strength: soft
  rationale: Injection is the vector for this threat; structural prompt isolation makes overriding instructions harder (soft).
- id: CTRL-SECURITY-GATES
  strength: gating
  rationale: 'SAST/DAST checks in CI detect injection vulnerabilities in generated code


    SAST/DAST checks in CI


    Secret scanning in CI


    IaC scanning in CI'
references: []
tags: []
