id: T-METADATA-LEAK
title: Agent metadata leak
harm: data-exposed
surface:
- user-agent
source:
- external-attacker
weaknesses:
- component: model
  text: The agent discloses technical implementation metadata — model version, dependency names/versions, system-prompt fragments, paths, stack traces, configuration IDs — through detailed errors, debug output, or direct answers about its internals; the disclosure serves as reconnaissance for a targeted attack.
  nature: targeted
reachability: NOT applicable if the agent's output and error messages are unreachable to a potential adversary (a fully internal trusted contour with no external surface).
mitigations:
- id: CTRL-METADATA-FILTERING
  strength: gating
  rationale: 'Filtering technical metadata from agent responses conceals implementation details


    Hiding system metadata from responses prevents fingerprinting


    Hiding the internal system architecture from external interfaces'
references: []
tags: []
