id: T-SSRF
title: SSRF via MCP/tools
harm: code-execution
surface:
- agent-environment
source:
- external-attacker
- hallucination
weaknesses:
- component: tool
  text: A tool with network egress accepts an address/URL from the model's arguments and initiates an outbound connection (HTTP, file://) from its own network position (internal vantage) rather than the user's; the address is supplied via injection or an erroneous model output.
  nature: targeted
reachability: NOT applicable if the tool makes no outbound requests, addresses are hard-coded and model-independent, or internal segments, metadata (169.254.169.254), and localhost are unreachable from the tool's network position (strict egress isolation).
mitigations:
- id: CTRL-SSRF-PREVENTION
  strength: gating
  rationale: Validation and blocking of internal IP addresses and metadata endpoints
- id: CTRL-URL-ALLOWLIST
  strength: gating
  rationale: An allowlist of permitted domains prevents SSRF attacks against internal resources
references: []
tags: []
