version: '1.0'
entities:
  mitigation:
    fields:
      description:
        purpose: Explains what it controls, how exactly it protects, and at which
          point it intercepts
        content_requirements:
        - Point of application - where in the flow it intercepts (at input, at output,
          at runtime)
        - Mechanism - how exactly the protection works (filtering, isolation, validation)
        - What it blocks/detects - a specific class of attacks or violations
        avoid:
        - 'Too brief: Input validation'
        - Marketing phrasing without mechanics
        - Repeating the title
        - Explicit division into blocks (point, mechanism, limitations) - the text
          must be coherent
        examples:
        - Intercepts user input before it reaches the model context, using an ML detector
          and pattern matching to identify prompt-injection attempts of the form "ignore
          the rules", "now you are..." and encoded payloads.
        - Runs tools in an isolated environment with network isolation and restricted
          access rights, blocking unauthorized access to internal services.
      implementations:
        purpose: Specific technical approaches to implementing the control
        content_requirements:
        - Each item is one specific technical mechanism, not a general intent
        - At least 2-3 implementation options
        avoid:
        - Names that are too general without mechanics
        - Describing intent instead of implementation
        - Only one implementation option
        subfields:
          name:
            purpose: A technically specific name for the pattern
            content_requirements:
            - 2-5 words
            - Describes the mechanism, not the intent
            examples:
            - Prompt-injection detector
            - Input sanitization
            - Human-control gateway
          description:
            purpose: How exactly the mechanism works, where it is implemented, and
              what practical protective effect it provides
            content_requirements:
            - A coherent, expanded description of the mechanism, not a telegraphic
              set of phrases
            - It must explain how the mechanism works, where exactly it is implemented
              in the architecture, and what role it plays in the defense
            - Where necessary, indicate in which circuit or scenario the mechanism
              is especially appropriate, and where its capabilities are insufficient
            - If it aids understanding, you may cite specific technologies, libraries,
              standards, or classes of solutions
            - If the mechanism includes several substantially different steps or implementation
              points, two paragraphs are allowed
            - After reading, it should be clear where to deploy the mechanism and
              what exactly to check during review
            avoid:
            - 'Labels without a mechanism: validation, signature, internal registry'
            - 'Describing intent instead of implementation: protects against attacks,
              reduces risk'
            - 'Marketing phrasing: reliably protects, effectively prevents'
            - Technologies without explaining what role they play in this mechanism
            - Mixing preventive, detective, and recovery measures in one description
              without a clear distinction
            - 'Telegraphic style: short phrases separated by periods without coherence'
            examples:
            - 'Before a call is executed, the tool''s arguments are validated against
              a predefined schema: expected fields, types, allowed value ranges, required
              parameters, and basic constraints on string format. Such a mechanism
              is placed at the boundary between the agent and tool execution, so that
              the model cannot pass an arbitrary data structure into runtime or covertly
              substitute the meaning of the call through invalid parameters. In practice
              this reduces the risk of injections, logic bypasses, and accidental
              errors when the LLM produces a formally similar but essentially incorrect
              request. This approach is especially useful for tools that work with
              external APIs, databases, or sensitive business operations, where it
              is important not only to permit the required call but also to strictly
              constrain the way it is formed.'
            - High-risk operations, such as deleting data, mass-modifying records,
              or executing irreversible commands, are not mixed with ordinary actions
              and are routed into a separate execution circuit with mandatory confirmation
              from the user or from an external policy. Thanks to this, the agent
              cannot quietly turn an ordinary scenario into a critical operation merely
              because the model erred in its reasoning or yielded to a malicious instruction.
              Such a mechanism is usually built in at the level of the tool registry,
              the policy engine, and the client interface, where the criticality of
              an action is fixed in advance and affects the very order of execution.
              This does not remove the need for correct authorization and argument
              validation, but it substantially reduces the likelihood that a destructive
              action will be performed automatically and without additional oversight.
            - 'Tools are executed not in the shared application environment but in
              an isolated runtime with pre-restricted rights: without arbitrary access
              to the file system, without unnecessary system calls, and only with
              permitted network destinations. Such a mechanism is needed so that even
              a vulnerable, compromised, or simply erroneously implemented tool cannot
              become a point of escape beyond its function and start reading extraneous
              data, executing arbitrary commands, or establishing external connections.
              In practice this reduces the blast radius of an incident and makes the
              tool''s behavior more predictable from an exploitation standpoint. The
              approach is especially important where agentic tools work with external
              resources, user input, or code, and where an error in one component
              must not automatically mean the compromise of the entire circuit.'
      requirement_level:
        purpose: Whether application is mandatory
        content_requirements:
        - 'MANDATORY: always required'
        - 'RECOMMENDED: recommended'
        examples:
        - MANDATORY
        - RECOMMENDED
      title:
        purpose: Short name for the UI
        content_requirements:
        - 3-7 words
        - Describes what the control does
        avoid:
        - Too general
        examples:
        - Human in the loop for critical actions
        - User input filtering
      type:
        purpose: Classification by the nature of the effect
        content_requirements:
        - 'PREVENTIVE_HARD: technically blocks the attack (MFA, encryption, sandbox)'
        - 'PREVENTIVE_SOFT: policies, procedures (access review, security training)'
        - 'DETECTIVE: monitoring, audit (logging, SIEM, anomaly detection)'
        - 'CORRECTIVE: recovery (backup, incident response)'
  threat:
    fields:
      description:
        purpose: Defines the attack scenario and the applicability conditions
        content_requirements:
        - Context - where and when the threat arises
        - Mechanics - how exactly the vulnerability is exploited
        - Required conditions - which system properties make the attack possible
        avoid:
        - 'Too brief: An attacker can steal data'
        - Abstract descriptions without specifics
        - Repeating the title
        examples:
        - 'Direct prompt injection: an attacker embeds malicious instructions through
          user input, which the model executes as its own'
      impact_class:
        purpose: An anchor asset that keeps the catalog impact-centric. It names WHICH
          asset is compromised, not how. A strict, closed, minimal vocabulary.
        content_requirements:
        - Exactly one value from the closed vocabulary.
        - Chosen by asset/damage, NOT by cause (injection/poisoning is a vector, not
          an impact_class).
        avoid:
        - cataloging the cause (injection/poisoning) as an impact_class
        - introducing a new value without a deliberate revision of the taxonomy
        allowed_values:
          decision-integrity: output/decision is distorted → wrong action
          data-confidentiality: unauthorized disclosure of data
          infrastructure-execution: unauthorized action/execution in systems
          resource-availability: exhaustion of resource/cost (LLM as an asset)
          reputation-compliance: harmful content → reputation/legal
          recon-exposure: leak of technical information that enables an attack
      reachability:
        purpose: 'Carve-outs: when the pattern is NOT a live path, even if it matched.
          Pure reachability + asset materiality, on the UN-MITIGATED architecture.
          NOT "whether a mitigation is implemented".'
        content_requirements:
        - 'Formulate as exceptions: "NOT applicable if ...".'
        - Only reachability (the attacker cannot influence the input / the surface
          is not exposed) and materiality (there is no valuable asset/privileges behind
          the pattern).
        - Assessed on the architecture BEFORE mitigations.
        avoid:
        - re-negating the weakness ("if parameterized") - that is a self-check against
          vulnerability, not a carve-out
        - the positive "applicable if..." - it is tautological with the presence of
          a vulnerability
        - treating the presence of a control as a reason for non-applicability (that
          is risk reduction, a separate step)
        - vague conditions of the form "if the system uses AI"
      title:
        purpose: Short name for the UI
        content_requirements:
        - 3-7 words
        - In English
        - Describes what happens
        avoid:
        - Too general
        - Technical jargon when unnecessary
        examples:
        - Prompt injection
        - Data theft via a tool
        - Knowledge base poisoning
      vulnerability:
        purpose: 'A list of vulnerabilities - HOW the system is exploitable (an umbrella
          over steps 2/5/6 of the skill: cause + interaction point + predisposing
          weakness). System-agnostic. This is the ONLY basis for recognition - each
          item must read as a pattern that an assessor will recognize on a system
          they are seeing for the first time.'
        content_requirements:
        - 'A list: each item is ONE recognizable exploitable pattern (one point of
          manifestation/configuration).'
        - 'In each item, bring together: the cause (how the harmful output arises;
          injection/hallucination is a given), WHERE it manifests (the interaction
          point in recognition terms), and the weakness that makes it exploitable.'
        - List ALL points of manifestation - completeness = coverage; cross-check
          against the cases. A missing item = a missed scenario.
        - List the points themselves, NOT their combinations (the Cartesian product)
          - linking them into a scenario is done by the assessor (step 7).
        instructions:
        - 'Length as required for sufficiency: an expert reading only the vulnerability
          should be able to recognize the pattern on an unfamiliar system.'
        avoid:
        - relying on "the model should not behave that way" as a guarantee
        - a reachability/materiality condition (unreachable, no asset) - that is reachability,
          not here
        - restating the impact (that is description)
        - listing mitigations
  threat_mitigation:
    fields:
      rationale:
        purpose: Recommended controls for mitigating the threat case
        content_requirements:
        - Each item is rationale + control_id + applies_to
        - rationale explains how exactly the control interrupts or weakens the attack
          chain for this case
        - applies_to indicates which component the control applies to - self (node
          case), from/to/edge (edge case), from_downstream/to_downstream (when has_edge_to
          is in the applicability)
        - A specific control mechanism in the context of this threat case
        avoid:
        - 'General phrases not tied to the threat case: reduces risk, improves security'
        - Copying the control description without adapting it to the threat case
        - Repeating the threat case description without explaining the mitigation
          mechanism
        examples:
        - 'T-INJECT-direct → CTRL-INPUT-FILTERING: Direct user input is intercepted
          before it reaches the model context - patterns of the form "ignore the instructions"
          and "now you are..." are detected before the model processes them'
        - 'T-INJECT-via-toolcall → CTRL-ARG-VALIDATION: Tool-call arguments are validated
          against a schema before execution - values generated by the model from poisoned
          content are discarded if they do not match the expected type/format'
