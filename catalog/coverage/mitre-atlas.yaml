source:
  id: mitre-atlas
  title: MITRE ATLAS
  kind: best_practice
  version: '2026.10'
  released: '2026-10-28'
  url: https://atlas.mitre.org/
  checked: '2026-11-12'
  entry_count: 129
  note: 'The long tail, and the only source here that is exhaustive by design. 16 tactics over these techniques, imported from the project''s own published dataset rather than retyped. Sub-techniques are deliberately not rows: they refine a parent rather than name a different thing, and a matrix nobody can read is not evidence of anything. From 2026.05 ATLAS numbers releases by month and publishes the data as dist/v6/ATLAS-<release>.yaml; the old dist/ATLAS.yaml stays frozen at 5.6.0. maturity on each row is ATLAS''s own evidence level for the technique, copied from that file.'
