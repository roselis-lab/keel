source:
  id: owasp-mcp
  title: OWASP MCP Top 10
  kind: best_practice
  version: v0.1
  url: https://owasp.org/www-project-mcp-top-10/
  checked: '2026-11-12'
  entry_count: 10
  note: 'The list for the protocol most agents now reach their tools through. OWASP publishes it as a beta (v0.1, the project''s "Phase 3 - Beta Release and Pilot Testing") with entries numbered MCP01:2025 to MCP10:2025; the version is read from the list page in the project''s repository, github.com/OWASP/www-project-mcp-top-10, file tab_top10.md. Titles are that page''s. The detail page for MCP06 is titled "Intent Flow Subversion"; the list and the overview both call it "Prompt Injection via Contextual Payloads", which is used here.'
entries:
- ref: MCP01
  title: Token Mismanagement & Secret Exposure
  state: covered
  threats:
  - T-CRED-THEFT
  mitigations:
  - CTRL-TOKEN-PROTECTION
  - CTRL-CONTEXT-FILTERING
- ref: MCP02
  title: Privilege Escalation via Scope Creep
