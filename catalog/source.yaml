# Who or what drives the threat. Not only attackers — a threat can be real without one.
source:
  external-attacker: {name: External attacker, desc: "An outside adversary (via injection, source substitution, etc.)."}
  internal:          {name: Internal actor,    desc: "An insider with legitimate access, per this system's rules."}
  hallucination:     {name: Hallucination,     desc: "The model itself errs / fabricates — no attacker."}
  error:             {name: Implementation error, desc: "An implementation or configuration defect."}
  accident:          {name: Accidental,        desc: "An accidental user action."}
# `training-data` used to be listed here and was the odd one out: it answers "through
# what", not "who". It is a surface now. Patterns carried from training data are a
# hallucination, an error or an external-attacker arriving through that surface.
