# Consequence classes (was impact_class). What actually breaks. One primary per threat.
harm:
  wrong-decision:    {name: Wrong decision,      desc: "A wrong decision or action is taken (integrity of the output/decision)."}
  data-integrity:    {name: Data integrity,      desc: "State is destroyed or altered that should not have been - by a tool the agent legitimately holds, by a poisoned write, by a wrong migration. Distinct from downtime: the service may be up and the data still gone or wrong."}
  data-exposed:      {name: Data exposed,        desc: "Data is disclosed that should not have been (incl. system metadata / recon)."}
  code-execution:    {name: Code execution,      desc: "Code or a command runs that should not have: a shell, an interpreter, a package, a script in a browser. Not a data-changing action taken through a legitimate tool - that lands as data-integrity."}
  downtime:          {name: Downtime,            desc: "Resource exhaustion / denial of service."}
  reputation-legal:  {name: Reputation & legal,  desc: "Reputational or regulatory/legal damage."}
