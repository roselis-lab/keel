id: CTRL-MCP-REGISTRY
title: MCP Server Registry with Verification
description: Centrally manages a registry of MCP servers with mandatory verification
  of signatures, capabilities, and security posture before registration, preventing
  connections to malicious or untrusted MCP servers. The mechanism operates at the
  MCP client configuration level and checks every server registration request against
  policy. This blocks connections to rogue MCP servers, provides visibility into the
  MCP ecosystem, and ensures that agents connect only to vetted infrastructure.
type: PREVENTIVE_HARD
requirement_level: MANDATORY
implementations:
- name: Internal MCP server catalog
  complexity: high
  description: 'All MCP servers must be registered in an internal catalog with verified
    metadata: publisher, capabilities, security assessment, audit history. Agents
    may connect only to servers in the catalog. This provides complete control over
    the MCP surface area but requires a curation process.'
- name: MCP server signatures
  complexity: high
  description: Each MCP server signs its responses with a cryptographic signature.
    The client verifies the signature against a trusted public key. This ensures authenticity
    and integrity of communication but requires key distribution infrastructure.
- name: MCP server allowlist
  complexity: low
  description: Agents may connect only to MCP servers on an allowlist defined in policy.
    The allowlist includes server IDs, endpoints, and allowed capabilities. A connection
    attempt to a non-allowlisted server is blocked. This is a simple but effective
    control.
