id: CTRL-DATA-VALIDATION
name: Validation of external data
mitigation_class: gating_control
purpose: Checks external data against declared formats before processing or indexing. It rejects malformed payloads; accepted text may still contain false facts or hostile instructions.
formal_implementation_risk: null
review: null
maintainer: null
locus: null
scope: null
control_mechanism: 'Input sanitization pipeline: All incoming data passes through a sanitization pipeline that removes or escapes potentially dangerous content: HTML/JS tags, SQL metacharacters, shell special characters, control characters. Sanitization is adaptive to context - data for SQL uses parameter escaping, for HTML entity encoding, for shell argument quoting. This can reduce format-specific injection risks but may alter legitimate data in edge cases.


  Strict schema enforcement: For structured data (JSON, XML, API payloads), strict schema validation is applied before processing. The schema defines expected fields, types, value ranges, required properties. Data that does not conform to the schema is rejected with an informative error. This detects malformed data early and reduces schema confusion attacks.


  Document validation for RAG: For RAG systems, documents are checked for injection patterns, malicious content, and data integrity before indexing. Checks include: virus scanning for binary files, instruction pattern detection for text documents, metadata validation, source verification. This may reject known malicious content but does not establish the truth of accepted documents.'
failure_behavior: null
telemetry: null
