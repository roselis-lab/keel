id: CTRL-EXTENSION-SANDBOX
title: Sandboxing IDE Extensions
description: Isolates IDE extensions in a restricted execution environment with controlled
  access to resources — filesystem, network, terminal — preventing unauthorized access
  to sensitive data and system commands even when an extension is compromised. The
  mechanism is deployed at the level of the extension host process or browser sandbox,
  intercepting all resource requests and checking them against policy. This limits
  the blast radius of malicious or compromised extensions, prevents data exfiltration
  through extensions, and blocks attempts at arbitrary code execution through extension
  vulnerabilities.
type: PREVENTIVE_HARD
requirement_level: MANDATORY
implementations:
- name: Isolated extension host process
  description: Extensions run in a separate process (extension host) with restricted
    privileges and communicate with the main IDE process through an IPC channel. The
    extension host has no direct access to the filesystem, network, or OS APIs — all
    requests pass through the main process, which applies policy checks. This gives
    strong isolation but adds IPC overhead on each cross-process call.
  complexity: high
- name: WebWorker isolation without DOM
  description: For browser-based IDEs, extensions run in a WebWorker without DOM access
    and with a restricted JavaScript API. Network requests are constrained by CORS,
    and filesystem access uses the File System Access API with user prompts for each
    sensitive operation. This gives browser-native sandboxing but limits extension
    capabilities.
  complexity: medium
- name: CSP sandbox for extension context
  description: Extensions run in a sandboxed iframe or dedicated origin with a Content
    Security Policy that forbids inline scripts, eval, and external connections except
    explicitly whitelisted ones. This prevents script injection into extension code
    and limits data exfiltration channels.
  complexity: medium
