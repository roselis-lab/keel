control_mechanism: 'Row-level security in the database (medium): At the database level, row-level security (RLS) is configured, where each query is automatically filtered by the tenant or user identifier from the session context. An agent or tool cannot reach another tenant''s data even with a direct SQL injection - the database engine enforces the filter. This gives the strongest isolation, but it requires thorough testing of RLS policies for coverage.


  Data masking and tokenization (medium): Sensitive fields (salary, SSN/SNILS, medical records) are masked or tokenized at the data access layer. The agent receives only masked values (***123) or tokens without access to the plaintext. When access to the plaintext is required for specific business operations, an additional confirmation process is applied. This protects against accidental exposure, but it limits the agent''s functionality.


  Fine-grained permissions for each agent or tool (medium): For each tool or agent, a minimal set of permitted operations on the data is defined: read-only for certain tables, no access to sensitive columns, write-only to audit tables. The policy engine checks each data access request against the permissions and blocks violations. This enforces the principle of least privilege at the data level.'
