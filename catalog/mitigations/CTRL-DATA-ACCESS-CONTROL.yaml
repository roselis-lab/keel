id: CTRL-DATA-ACCESS-CONTROL
name: Data-level access control
status: draft
mitigation_class: gating_control
purpose: Manages the access rights of agents and tools to data sources at the level of individual fields, records, and operations, enforcing the principle of least privilege and preventing unauthorized access to sensitive information. The mechanism is deployed as an authorization layer between the agent or tool and the data sources - databases, APIs, file storage - checking each request against access policies. This prevents mass data exfiltration, limits exposure in the event of compromise, and ensures tenant isolation in multi-tenant systems through row- and column-level security.
