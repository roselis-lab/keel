id: CTRL-INPUT-PARAMETERIZATION
name: Parameterized APIs Instead of String Concatenation
status: draft
mitigation_class: gating_control
purpose: Ensures that all commands, queries, and API calls are formed through parameterized
  interfaces instead of string concatenation, eliminating injection vulnerabilities
  through separation of code and data. The mechanism is applied at the level of code
  generation and tool invocation where the model or agent forms commands — SQL queries,
  shell commands, URL parameters, API requests — and guarantees that external data
  is always passed as parameters, not as part of the command syntax. This prevents
  SQL injection, command injection, path traversal, and related injection attacks
  through structural separation of concerns.
formal_implementation_risk: null
review: null
maintainer: null
owner: null
locus: null
scope: null
control_mechanism: 'Prepared statements and ORM (low): All database queries use prepared
  statements or ORM query builders that automatically parameterize inputs. External
  data is passed as query parameters, not interpolated into the SQL string. This eliminates
  the SQL injection attack vector entirely when the ORM/query builder APIs are used
  correctly.


  Subprocess APIs with list arguments (low): Shell commands are executed through subprocess
  APIs that accept arguments as a list/array instead of a single string. execve-style
  calls that parse arguments from a string are prohibited. This prevents shell metacharacter
  interpretation and command injection through argument values.


  URL builder with automatic encoding (low): URLs and API paths are formed through
  builders that automatically encode parameters: URLSearchParams for query strings,
  path.join for paths, encodeURIComponent for segments. Manual string concatenation
  for URL construction is prohibited. This prevents injection through URL manipulation.'
