id: CTRL-RATE-LIMITING
name: Request Rate Limiting and Quotas
mitigation_class: gating_control
purpose: Limits the rate of requests to models and tools through per-user limits, global quotas, and adaptive throttling, preventing abuse, resource exhaustion, and cost overruns from runaway agents or malicious use. The mechanism operates at the API gateway level and tracks request counts per identity and globally. This protects against DoS via excessive API calls, prevents accidental cost blowups, and ensures fair resource allocation among users.
formal_implementation_risk: null
review: null
maintainer: null
locus: null
scope: null
control_mechanism: 'Per-user rate limiting (low): Per-user or per-session limits on API calls: X requests per minute/hour/day. Limits are configured based on subscription tier, usage patterns, security level. Exceeded limits return a 429 status with a retry-after header.


  Global resource quotas (low): Global quotas on total API usage: maximum concurrent requests, daily token consumption limits, monthly cost caps. Global limits protect infrastructure from aggregate load even when individual users are within their limits.


  Adaptive throttling (medium): Rate limits adapt dynamically based on system load, time of day, user behavior patterns. Under high load, limits are tightened. An anomalous spike in requests triggers temporary stricter limits pending investigation.'
