id: CTRL-SECURITY-GATES
title: Mandatory Security Gates in CI
description: Enforces mandatory automated security checks on every PR and commit —
  SAST, DAST, SCA, secret scanning, IaC scanning — with merge blocking on failed checks
  and mandatory review for diffs with a high proportion of AI-generated code, preventing
  vulnerabilities from entering the codebase. The mechanism operates at the CI/CD
  pipeline level and is a mandatory gate before merge. This ensures a consistent security
  baseline for all code, detects vulnerabilities at the earliest stage, and imposes
  elevated requirements on AI-generated code.
type: PREVENTIVE_HARD
requirement_level: MANDATORY
implementations:
- name: SAST pipeline
  complexity: medium
  description: 'Static code analysis on every commit surfaces security vulnerabilities,
    code quality issues, and compliance violations. Tools: Semgrep, CodeQL, SonarQube.
    Failed checks block merge. Trade-off: false positives require triage.'
- name: Secret scanning
  complexity: low
  description: 'Secret-scanning detectors check code and configurations for credentials,
    API keys, passwords. Detected secrets block merge and require rotation. Tools:
    Gitleaks, TruffleHog, GitGuardian. Trade-off: does not catch obfuscated secrets.'
- name: Flagging AI diffs for enhanced review
  complexity: medium
  description: PRs with a high percentage of AI-generated code are automatically flagged
    for increased scrutiny. Reviewers see an indicator of the AI-content proportion.
    Sensitive areas (authentication, cryptography) require an explicit security review.
