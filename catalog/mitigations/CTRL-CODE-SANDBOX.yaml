id: CTRL-CODE-SANDBOX
name: Isolated execution of generated code
mitigation_class: gating_control
purpose: >-
  Prevents code the model wrote, or was steered into writing, from reaching anything beyond what its task
  was given when it runs: the host, other workloads, the network, credentials. Without it, generated code
  runs with the authority of whatever executes it.
formal_implementation_risk: 'The code runs in a container that shares the host kernel on a host that itself holds tokens, cloud credentials or other workloads'' data, so a single container-runtime or kernel escape turns the sandbox into a doorway rather than a boundary. Signal: the node that runs generated code can read a credential or a neighbouring build''s files from outside the container.'
review: >-
  Review when a new path starts executing generated code (a new tool, a test runner, a CI job on agent
  changes), when the isolation layer or its profile changes, when the executing host starts holding
  credentials or another workload, or when code in the sandbox gains network access. Keep a periodic
  safety-net review alongside those triggers.
maintainer: null
locus:
  value: split
  note: >-
    The sandbox itself is infrastructure: a platform or provider builds the isolation once and every tool
    uses it. Routing each execution path through it is product work for whoever owns the tool or runtime,
    because only they know where their code ends up being run. A team with one interpreter tool can use a
    hosted sandbox and holds only the routing half.
scope: |-
  Every path where code produced or modified by a model is executed: a code-interpreter tool, an eval or exec inside a tool, an agent running scripts or tests it wrote, a CI job running an agent's changes.

  The isolation layer is set by who can influence the code and what the executing host holds:
  - the code can be influenced by untrusted input (anything the model read from outside), or the host holds credentials or other workloads' data: a boundary stronger than a shared kernel - a micro-VM or a user-space kernel - created per run and destroyed after;
  - the code comes only from the operator's own inputs on a single-purpose host with no secrets: an unprivileged container with no network is enough;
  - the code needs no operating-system facilities at all: a WebAssembly runtime with no host functions imported is enough; a restricted interpreter of a general-purpose language is not a boundary against hostile code;
  - the code needs the network (installing packages): egress only through the destination allowlist.
out_of_scope: >-
  Code that leaves the sandbox as an artifact and is run elsewhere - merged into the repository, deployed,
  picked up by a later pipeline - is build-state isolation and code review. Markup rendered in a browser is
  output encoding. Shell commands an agent issues on a person's own machine are the command allowlist, or
  this card applied to that machine's agent. Whether the code is correct is not a sandbox question.
control_mechanism: >-
  Enforced at the platform layer - the execution environment the runtime launches for the code - not in
  the prompt that generates it and not by scanning the code first. The runtime hands the code to an
  environment created for this run, with the isolation layer scope sets; no host mounts beyond a scratch
  directory and the inputs passed explicitly; no credentials in the environment or the file system; no
  network, or egress only through the destination allowlist; no reachable container-runtime socket, SSH
  agent or cloud metadata endpoint; CPU, memory and time limits. The environment is destroyed after the run.
  Results come back as data the caller reads; nothing written inside is executed later by a more privileged
  process unless it passes the same gate.
failure_behavior:
  value: fail_closed
  note: 'When the sandbox cannot start, its profile fails to load or its isolation layer is unavailable, the code does not run. The value flips to fail_open where the runtime falls back to executing on the host when the sandbox is missing; a refusal recorded for every such start, rather than a silent fallback, is how the difference is noticed.'
telemetry:
  events:
  - name: sandbox.run
    records: Which code ran where, under which isolation.
    attributes:
    - calling tool and session
    - isolation layer and profile version
    - image or runtime digest
    - network policy applied
  - name: sandbox.violation
    records: A blocked system call, connection or mount access from inside.
    attributes:
    - run id
    - what was attempted
  - name: sandbox.refused
    records: The sandbox could not start, so the code did not run.
    attributes:
    - calling tool
    - reason
  evidence: Held by the platform outside the sandbox and the calling runtime, kept for the investigation window of the host it protects.
anti_patterns:
- 'A shared-kernel container on a host that holds secrets. Signal: from the node, outside the container, a credential or another workload''s data is readable.'
- 'Isolation covers execution during the session, while what the code writes is run later outside it. Signal: files or cache entries written inside the sandbox are executed by a test run or pipeline that holds credentials.'
- 'The profile denies the network but leaves a local socket or forwarded agent reachable. Signal: from inside, a Docker socket, SSH agent or cloud metadata endpoint answers.'
validation:
- criterion: An escape from the sandbox reaches nothing of value.
  test_scenario: Place canary credentials and a neighbouring workload's marker file on the executing host, then run code with host-level access as if the isolation had been broken.
  expected_result: The host holds no live credential and no other workload's data, so the canaries are the only things found and their use is detected.
  base: true
- criterion: Code that must be treated as hostile runs behind a boundary stronger than a shared kernel.
  test_scenario: Check the isolation layer used for code from untrusted input.
  expected_result: A user-space kernel or a micro-VM, not a plain container on the host kernel.
  base: false
- criterion: Nothing written inside the sandbox runs later with more privilege.
  test_scenario: Write a file and a cache entry from inside the sandbox under names a later test run or pipeline uses, then trigger that run.
  expected_result: The later run does not execute them.
  base: true
- criterion: Local channels out of the sandbox are closed.
  test_scenario: From inside, try the container runtime socket, an SSH agent and the cloud metadata endpoint.
  expected_result: None of them answers.
  base: true
faq: []
requires: []
implementations: []
