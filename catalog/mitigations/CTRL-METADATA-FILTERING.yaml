id: CTRL-METADATA-FILTERING
name: Stripping Technical Metadata from Responses
status: draft
mitigation_class: gating_control
purpose: Removes technical metadata — system paths, internal URLs, server versions, stack traces — from output and responses before they are sent to the user or external systems, preventing disclosure of information about the internal architecture. The mechanism operates at the response processing level and sanitizes output content. This reduces the attack surface by lowering reconnaissance capability, protects internal infrastructure details, and supports defense through limited visibility of implementation details.
formal_implementation_risk: null
review: null
maintainer: null
owner: null
locus: null
scope: null
control_mechanism: 'Automatic metadata scrubbing (medium): Output passes through a metadata scrubber that removes known patterns: file paths, internal hostnames, version strings, error traces. The scrubber applies regular expressions and context-aware rules. This removes obvious metadata but may miss novel patterns.


  Structured output sanitization (low): Structured output formats (JSON, XML) are sanitized — sensitive fields are automatically masked or removed. A schema defines the fields that must be filtered. This provides deterministic handling of structured data.


  Error message sanitization (low): Error messages are sanitized — raw exceptions and stack traces are replaced with generic user-facing messages. Technical details are logged server-side but not disclosed externally. This prevents information leakage through error handling.'
