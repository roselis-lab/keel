id: CTRL-INTEGRITY-VERIFICATION
name: Verifying Component Signatures/Hashes
mitigation_class: gating_control
purpose: Verifies the integrity of components by checking cryptographic signatures and hash sums before loading or execution, ensuring detection of tampering and unauthorized modifications. The mechanism operates at the component acquisition and loading stage, verifying that the acquired artifact matches the expected hash or signature from a trusted source. This detects supply chain compromises, identifies man-in-the-middle tampering, and guarantees that the executed code matches the reviewed and approved version.
formal_implementation_risk: null
review: null
maintainer: null
locus: null
scope: null
control_mechanism: 'SHA256 checksum verification (medium): For each downloaded component, the system verifies the SHA256 hash against the known-good value from a trusted source (package registry, internal artifact store, vendor signature). A hash mismatch blocks the download and generates an alert. This provides cryptographic verification of integrity but requires infrastructure for managing a hash database.


  Code signing verification (high): Components are signed with the developer or vendor private key at release. Consumers verify the signature against the public key from a trusted keystore. Code signing provides authenticity in addition to integrity — it verifies who produced the component. This gives strong guarantees but requires PKI infrastructure and secure key management.


  SBOM verification (medium): An SBOM (Software Bill of Materials) lists all dependencies with their expected versions and hashes. The system verifies the actual dependencies against the SBOM and alerts on any discrepancies. This ensures transparency in the supply chain but requires accurate SBOM generation and maintenance.'
