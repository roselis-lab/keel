id: CTRL-AUDIT-LOGGING
name: Immutable ToolCall logging
status: draft
mitigation_class: detector
purpose: Records all tool calls, agent decisions, data accesses, and operation results in an immutable log with cryptographic integrity protection, ensuring the ability to perform forensic analysis and incident investigation. The mechanism works through instrumentation of all critical points in the system - tool calls, API endpoints, data access layers - and writes events to append-only storage tied to timestamps, session identifiers, and action subjects. This makes it possible to reconstruct the chronology of an incident, establish cause-and-effect relationships, detect anomalous patterns post-factum, and ensure accountability for compliance requirements.
formal_implementation_risk: null
