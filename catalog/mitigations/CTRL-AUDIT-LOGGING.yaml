maintainer: null
locus: null
scope: null
control_mechanism: 'Append-only audit storage (medium): All events are written to a dedicated append-only store (a dedicated database table with RESTRICT deletes, object storage with a WORM policy, or a dedicated audit log service). Each record contains timestamp, event type, actor ID, session ID, resource, action, outcome, and relevant context. Deleting and modifying records is technically impossible or requires a privileged break-glass procedure. This provides baseline protection of audit trail integrity at moderate cost.


  Hash-chained event log (high): Records in the audit log are cryptographically linked through a hash chain or Merkle tree - each new event contains the hash of the previous one. This makes it impossible to silently modify or delete history without compromising the entire chain. For additional assurance, root hashes are periodically published to a public blockchain or signed by an external party. The approach provides judicial-grade integrity, but it adds complexity in implementation and storage.


  SIEM integration with correlation (high): The audit log is integrated with a SIEM system (Splunk, ELK, Datadog) for real-time event correlation, anomaly detection, and automated alerting. Correlation rules are tuned to typical attack patterns: unusual tool call frequency, access to sensitive data, privilege escalation attempts. This combines forensic capability with operational response, but it requires expertise to configure the rules and keep them current.'
