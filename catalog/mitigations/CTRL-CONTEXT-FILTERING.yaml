id: CTRL-CONTEXT-FILTERING
title: Context sanitization
description: Cleanses the model's context of confidential data, personal data, secrets,
  and sensitive information before it is sent to the model or the user, preventing
  unintentional disclosure of secrets through output, logging, or context contamination
  between sessions. The mechanism works as a sanitization layer between the data sources
  and context assembly, applying pattern matching, ML classification, and policy rules
  to identify and mask sensitive content. This prevents leakage of credentials through
  model output, protects personal data from exposure in multi-tenant environments,
  and ensures context isolation between users and projects.
type: PREVENTIVE_SOFT
requirement_level: MANDATORY
implementations:
- name: Automatic removal of personal data
  description: Automatic detection and masking of personal data (names, email addresses,
    phone numbers, addresses, card numbers, SSN/SNILS) through regular-expression
    patterns or NER models before the data is included in the context. Detected entities
    are replaced with tokens of the form [EMAIL_REDACTED] or anonymized values. This
    prevents leakage of personal data, but it may lose context important for the task.
  complexity: medium
- name: Smart context window limiting
  description: Limiting the size of the context window through smart truncation or
    summarization of older parts of the conversation history. Priority for retention
    is given to system instructions and recent context, while older content is summarized
    or removed. This prevents contamination of the context with irrelevant data and
    reduces the risk of exposing sensitive information from older messages.
  complexity: medium
- name: Context isolation between sessions
  description: Context is isolated between projects, tenants, or users through explicit
    context boundaries. Each request is processed in an isolated context scope without
    access to data from other sessions. Context is reset between independent tasks.
    This prevents cross-contamination of sensitive data in multi-tenant systems.
  complexity: low
