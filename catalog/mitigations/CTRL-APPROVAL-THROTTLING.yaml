id: CTRL-APPROVAL-THROTTLING
name: Throttling and batching of approval requests
status: draft
mitigation_class: gating_control
purpose: Limits the rate of approval requests from the agent to the user and groups similar actions into batched requests, in order to reduce cognitive load and prevent automatic approval without consideration. The mechanism operates between the agent and the user interface, aggregating requests over a time interval and checking patterns against the rate-limiting policy. This prevents exploitation of approval fatigue, where an attacker or a compromised agent deliberately floods the user with requests to obtain automatic approval, and protects against impulsive decisions under the pressure of a stream of notifications.
