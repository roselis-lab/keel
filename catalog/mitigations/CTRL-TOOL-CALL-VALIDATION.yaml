id: CTRL-TOOL-CALL-VALIDATION
name: Schema validation of tool call arguments
mitigation_class: gating_control
purpose: Stops a call that is malformed against the tool's own contract from reaching the tool. It catches the class of failure where the model produces arguments of the wrong shape, type or range - not a well-formed call that should not have been made.
formal_implementation_risk: null
review: null
maintainer: null
locus: null
scope: null
control_mechanism: 'The enforcement point sits at the tool invocation layer, between the runtime and the tool. Every call is validated against the schema declared in the tool definition - types, required fields, enumerations, ranges, formats - and a call that fails is rejected rather than passed on with a warning.


  The guarantee is deterministic and its limit is exact: the schema decides shape, never intent. A call that is well formed and wrong passes, which is what makes this a floor under other controls rather than a substitute for them.


  Non-bypass rests on the tool being reachable only through the invocation layer. A tool that can also be called directly is outside this control''s guarantee.'
