id: CTRL-AGENT-REPORT
name: Agent action audit trail
status: draft
mitigation_class: detector
purpose: Records all significant agent actions in an immutable log tied to timestamps,
  session identifiers, and execution context, ensuring the ability to fully reconstruct
  the chronology of events for incident investigation. The mechanism runs continuously
  throughout the agent's entire lifecycle, intercepting tool calls, data accesses,
  action decisions, and their results at the logging middleware or instrumentation
  level. This makes it possible to detect anomalous behavior after the fact, conduct
  forensic analysis of an incident, and ensure accountability of autonomous systems
  to regulators and users.
