locus: null
scope: null
control_mechanism: 'Structured logging with trace ID (medium): Each agent action is
  logged in a structured JSON format with mandatory fields: timestamp, agent_id, session_id,
  trace_id, action_type, parameters, result, decision_rationale. Logs are collected
  into a centralized system (ELK, Splunk, CloudWatch) with indexing across all key
  fields. This approach gives rich context for analysis, but it requires significant
  storage volume and may contain sensitive data that requires masking.


  Immutable event store (high): All agent events are written to an append-only event
  store with a cryptographic linkage between records (hash chain or Merkle tree),
  which makes it impossible to delete or modify history without detection. The event
  store supports replay to reconstruct the sequence of actions and can be used as
  a source of truth during an investigation. The implementation is more complex than
  ordinary logging, but it provides a judicial-grade audit trail.


  Aggregation with anomaly detection (medium): Audit logs are aggregated in real time
  to detect anomalies: unusual action patterns, threshold breaches, access to sensitive
  data. Alerts are sent to a SIEM or monitoring system for immediate response. This
  combines a detective control with the ability to react quickly, but it requires
  careful tuning of detection rules to avoid alert fatigue.'
