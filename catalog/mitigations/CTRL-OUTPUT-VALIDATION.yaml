id: CTRL-OUTPUT-VALIDATION
title: Model Output Validation
description: Validates model output against the expected format, content policies,
  and security requirements before delivery or use, ensuring detection of malformed,
  malicious, or policy-violating outputs. The mechanism operates as a post-generation
  validation layer and checks every output against defined schemas and policies. This
  blocks outputs that could cause system failures, detects attempts to bypass content
  restrictions, and provides quality control over model responses.
type: DETECTIVE
requirement_level: RECOMMENDED
implementations:
- name: Schema validation for structured output
  complexity: medium
  description: Structured outputs are validated against a JSON Schema or equivalent
    schema definition. The schema defines required fields, types, value ranges, allowed
    values. Outputs that do not conform to the schema are rejected or flagged for
    regeneration. This ensures downstream consumers receive a predictable format.
- name: Content policy compliance check
  complexity: high
  description: 'Output is checked for compliance with content policies: prohibited
    topics, safety guidelines, ethical standards. An ML classifier or rule-based system
    evaluates compliance. Violations are blocked with a trigger for regeneration or
    human review.'
- name: Semantic validation for actionable output
  complexity: high
  description: 'For outputs that will be consumed by the system (tool arguments, API
    calls, code), semantic validation is applied: correctness checks, safety analysis,
    feasibility verification. Output is evaluated not only on format but on whether
    the proposed action is safe and appropriate.'
