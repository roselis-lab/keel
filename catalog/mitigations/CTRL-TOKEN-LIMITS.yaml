id: CTRL-TOKEN-LIMITS
name: Token Limits on Request and Response
mitigation_class: gating_control
purpose: Limits the number of tokens in model requests and responses through maximum input and output token limits with mandatory user notification on truncation, preventing resource exhaustion and cost overruns from excessively large requests. The mechanism operates at the API gateway and model invocation layers. This protects against DoS via oversized prompts, controls infrastructure costs, and ensures predictable resource consumption.
formal_implementation_risk: null
review: null
maintainer: null
locus: null
scope: null
control_mechanism: 'Hard limit on input tokens: Count the full assembled request, including instructions, history, tool descriptions and results. Requests exceeding the limit are rejected or truncated with explicit user notification. The user is informed when their input has been truncated.


  Output token limit: Output generation is bounded by a maximum number of output tokens enforced by the model service, including hidden reasoning when metered. When the limit is reached, the response is truncated with a [...truncated] marker. The user can request continuation if needed.


  Session-level token quotas: Cumulative tracking of tokens at the session level - total token consumption is tracked and capped. The session quota prevents runaway conversations from exhausting resources.'
failure_behavior: null
telemetry: null
anti_patterns: []
validation: []
faq: []
out_of_scope: Per-call and per-session token limits do not bound aggregate work across retries, delegated branches and resumed tasks; use a root-task budget for that.
