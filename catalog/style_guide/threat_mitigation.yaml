fields:
  rationale:
    purpose: Recommended controls for mitigating the threat case
    content_requirements:
    - Each item is rationale + control_id + applies_to
    - rationale explains how exactly the control interrupts or weakens the attack chain for this case
    - applies_to indicates which component the control applies to - self (node case), from/to/edge (edge case), from_downstream/to_downstream (when has_edge_to is in the applicability)
    - A specific control mechanism in the context of this threat case
    avoid:
    - 'General phrases not tied to the threat case: reduces risk, improves security'
    - Copying the control description without adapting it to the threat case
    - Repeating the threat case description without explaining the mitigation mechanism
    examples:
    - 'T-INJECT-direct → CTRL-INPUT-FILTERING: Direct user input is intercepted before it reaches the model context - patterns of the form "ignore the instructions" and "now you are..." are detected before the model processes them'
    - 'T-INJECT-via-toolcall → CTRL-ARG-VALIDATION: Tool-call arguments are validated against a schema before execution - values generated by the model from poisoned content are discarded if they do not match the expected type/format'
