fields:
  title:
    purpose: Name what goes wrong, in a few words.
    content_requirements:
    - Name the outcome or scenario, not a technique or a restated consequence.
    avoid:
    - A technique as the title (prompt injection, jailbreak) — that is a mechanism, not a threat.
    - Just the harm restated.
    examples:
    - Sensitive data disclosure through the response
    - Unauthorized or destructive tool action
  harm:
    purpose: The consequence class — what actually breaks.
    content_requirements:
    - One primary value from catalog/harm.yaml.
  surface:
    purpose: Which trust boundary the untrusted influence crosses to reach the weakness.
    content_requirements:
    - One or more values from catalog/surface.yaml, matching the reachability path.
  source:
    purpose: Who or what drives the threat.
    content_requirements:
    - Values from catalog/source.yaml.
    - Include non-attacker causes (hallucination / error / accident) when the threat is real without an attacker.
    avoid:
    - Attacker-only when the threat fires from a plain model mistake.
  reachability:
    purpose: The rule-out gate — when this threat is NOT a live path in a given system.
    content_requirements:
    - Frame as "NOT applicable if …".
    - About the path not being reachable or the asset not being material.
    - Judge on the un-mitigated architecture (before controls).
    avoid:
    - Re-negating the weakness itself.
    - Naming a control — closing the weakness is the mitigation's job, not the carve-out's.
    examples:
    - NOT applicable if the model cannot influence the arguments (hard-coded), or the interpreter runs with no valuable access.
  references:
    purpose: Provenance — where this maps in public catalogs.
    content_requirements:
    - Each entry is {id, url} with a real, working link.
    - Relevant CWE / CAPEC / OWASP-LLM / ATLAS ids.
    avoid:
    - Using a reference to rule out or to build chains — provenance only.
  tags:
    purpose: Coarse labels for grouping and search.
    content_requirements:
    - Short, lowercase, reusable labels.
    avoid:
    - Encoding meaning here that belongs in a real field.
