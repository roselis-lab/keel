entity:
  purpose: 'One card is one control: something an organisation adopts, written so it can be adopted for any threat it closes rather than only the first one.'
  instructions:
  - Apply the splitting test before naming anything. Two controls are two cards if and only if an organisation could adopt one without the other. If adopting the first always means adopting the second, they are one card, and the second is part of its control mechanism or an entry in its acceptance criteria.
  - Pick mitigation_class first. It is a switch that sets how control_mechanism and failure_behavior are read, so choosing it after writing either means rewriting both.
  - Write every field against the control, never against the threat that prompted the card. Test it by asking whether the card would still read correctly linked to an unrelated threat.
  avoid:
  - Two controls in one card, where an organisation could plainly ship half of it.
  - A card carrying the shape of its first occasion - the name, the scope or the acceptance criteria written against one threat. That card will not link to a second threat without reading oddly, so the same control gets written twice under two names.
  - Anything of the form 'the organisation decides' or 'depending on your risk appetite'. Org-specific content goes in `implementations`, or nowhere.
fields:
  name:
    purpose: What the control is, at the altitude a reader would go looking for it. The name is the first thing that decides whether a card is found and reused, or written a second time under another name.
    content_requirements:
    - Name the control, not one occasion of using it. If the name only fits the first threat it was written against, it is a use of the control rather than the control.
    - Use the name the field already has where one exists - a reader arrives with the industry's word, not with ours.
    - It should be possible to link the card to a second, unrelated threat without the name reading oddly. If it cannot, the name is too narrow.
    avoid:
    - A name carrying the threat it was first written for. 'Human decision on the path of an irreversible action' is a sentence about one link; the control is human-in-the-loop for agent actions.
    - A name carrying the deployment ('approval service'), the vendor, or the mechanism's implementation detail.
    - A restated purpose. The name is a handle, not a summary.
    examples:
    - Human-in-the-loop for agent actions
    - Least-privilege identity for agent tool calls
    instructions: null
  mitigation_class:
    purpose: 'One of gating_control / detector / process / evidential_mitigation / corrective. The class is a switch: it sets how the Control mechanism and Failure behavior sections are read.'
    content_requirements:
    - Exactly one class per card; secondary behavior is noted in prose inside Control mechanism.
  purpose:
    purpose: '1-3 sentences: which class of failure the mitigation prevents.'
    content_requirements:
    - 1-3 sentences naming the specific class of failure or risk that goes away if this mitigation works — not a restated title, not an aspiration.
    - Answer 'what breaks without this' in terms of harm or attack pattern, not in terms of a technology or vendor.
    avoid:
    - Naming the mechanism or technology used to achieve it (encryption, sandboxing, allowlisting) — that's control_mechanism's job.
    - Unmeasurable aspirations ('be more secure', 'prevent all X') with no bounded failure class.
    - Restating the mitigation's name or class.
  formal_implementation_risk:
    purpose: '1-3 sentences: what a useless-but-mitigation-looking implementation looks like - what happens if the mitigation is implemented ''formally''. This field sets the failure mode that the other fields are obliged to close.'
    content_requirements:
    - Name ONE concrete way THIS mitigation can be technically present yet not close the gap it claims to close — a coverage gap (scope narrower than the weakness it's meant to cover), an enforcement gap (a bypass or exception path nobody monitors), or an evidence gap (existence is provable, effectiveness is not).
    - Specific to this control's mechanism — a reader should not be able to paste the same sentence onto a different mitigation card.
    avoid:
    - Restating failure_behavior — that's a correctly-built control breaking at runtime; this field is a control that was never built to spec in the first place.
    - Vague phrasing ('if not implemented properly', 'if done superficially') without naming the concrete gap.
    examples:
    - An allowlist is enforced at request time but never re-synced after new tools are registered, so anything added after initial rollout is silently permitted.
  scope:
    purpose: A deterministic rule for when this control applies, stated through a property of the system, the operation, or the asset - so two readers with the same architecture reach the same answer.
    content_requirements:
    - 'Deterministic: no ''by team decision'' and no ''if the model judges it risky''.'
    - Written about the class of operations this control governs, not about any one threat. A card links to many threats over its life, and a scope written against the first of them is wrong by the second.
    - Structure it. A rule with several independent tests reads as a list or a table; as one paragraph nobody checks their own system against it.
    - Strictness levels, where they exist, set by a deterministic property of the contour (criticality, regulation, blast radius) rather than by a choice.
    - Profiles - the same control varied by such a property - belong here, not as separate cards.
    avoid:
    - Writing it against the threat the card was created for. Why this control fits that threat is the link's `rationale`; scope is about the control alone.
    - 'Mechanism: where the check is computed, when it is registered, what the middleware does. That is `control_mechanism`. Scope answers WHEN it applies, not HOW it fires.'
    - The boundary. What the control deliberately does not cover is `out_of_scope`, its own field so its absence is visible.
    - A blanket carve-out by a technical label ('read-only operations') without checking it against the tests above - a read that carries regulated data out is not exempt because it is a read.
    - Variation dictated by a team's timeline or resources - that is a temporary exception in the acceptance record, not scope.
  control_mechanism:
    purpose: 'Read per mitigation_class: the concrete mechanism and the deterministic guarantee it holds.'
    content_requirements:
    - 'gating_control: the enforcement point (concrete architectural component); the trust boundary at which it fires; the deterministic mechanism that guarantees it cannot be bypassed. The trigger is deterministic, not at the discretion of the model or a human ad hoc.'
    - 'detector: what emits the signal (what is measured, signal quality, the budget of false positives and misses); who or what deterministically responds and with what SLA; which deterministic gate relies on the signal - or an explicit justification that there is none. A detector does not gate by itself; the reaction gates.'
    - 'process: the trigger for conducting it; coverage; who evaluates sufficiency and by what criteria. Separate ''is X done'' from ''is X done well'' - sufficiency criteria are mandatory.'
    - 'evidential_mitigation: what is stored (event types, mandatory attributes, per-event integrity anchors - ID + hash); where it is emitted (instrumentation points on the platform side); the completeness guarantee (append-only, cryptographic chain) that needed events are not lost or falsified.'
    - 'corrective: the remediation action (concrete component / runbook performing rollback / kill-switch / containment); the trigger (deterministic, or an explicit decision authority + SLA); the deterministic guarantee it brings the system to a known-good state, not a partial or ambiguous one.'
  failure_behavior:
    purpose: 'What happens when the control itself fails, and what makes it so. The value is what lets a reader ask the question that matters across a whole system: what here fails open.'
    content_requirements:
    - 'value: fail_closed (the guarded thing stops), fail_open (it continues unguarded), or degraded (it continues with a named, reduced guarantee).'
    - 'note: every condition counted as a failure - unavailable, expired, unauthenticated, state lost - and what happens in each.'
    - Say what makes the value flip. Whether a blind detector is a shrug or a full stop is a property of the contour, not of the control's kind, so a card that can go either way names the property that decides.
    - Say how the failure is noticed. A control that fails silently is indistinguishable from one that is working.
    avoid:
    - Deriving the value from mitigation_class. A detector is not automatically fail_open and a gate is not automatically fail_closed.
    - fail_open with no justification - it is a real answer, but never a default.
    - Describing a control that was built wrong. That is formal_implementation_risk; this field is a correct control breaking at runtime.
  telemetry:
    purpose: 'The evidence this control leaves behind: which events, what each one has to carry, and where the record is held.'
    content_requirements:
    - One entry per event, with the name as it is emitted and one line saying what the event establishes.
    - 'Attributes without which the event proves nothing - attribution above all: who acted, on what, and what was decided.'
    - Include the event that fires when the control REFUSES. The count of refusals is what says whether the control is doing anything at all.
    - 'evidence: where the record is held and for how long. A log the producing system can rewrite is not evidence.'
    avoid:
    - Attributes already implied by the mechanism - this field is what is written down, not how the control works.
    - Standard identifiers (timestamp, session id) unless this control needs something specific of them.
  anti_patterns:
    purpose: An explicit list of implementations that look like the mitigation but are not - a clean list of 'how NOT to do it', including at minimum the 'formal' variant from Risk of formal implementation.
    content_requirements:
    - Each entry names a concrete, plausible-looking implementation AND the diagnostic signal that exposes it — something checkable in config, logs, or behavior, not an abstract 'if done carelessly'.
    - Reference the formal_implementation_risk variant briefly (don't re-copy it verbatim) as one entry, plus at least one further entry that is a genuinely different failure shape — a list with only the formal variant restated isn't a list.
    instructions:
    - 'For each candidate entry, ask: could a reviewer catch this from evidence (config, logs, a test), or does it require trusting a self-report? If only the latter, sharpen it until there''s a concrete signal.'
    avoid:
    - A vague 'if implemented poorly' entry with no diagnostic signal — a reader must be able to go check for it.
    - Anti_patterns as a verbatim copy-paste of formal_implementation_risk with no added entry.
  validation:
    purpose: Pass/fail acceptance criteria with the scenario that decides each. Base criteria are the bar for anyone adopting the control at all; situational ones apply to some contours and not others.
    content_requirements:
    - Each criterion is a pass/fail statement; if it cannot be, it is not a criterion.
    - Each criterion checks what the others do not. Thresholds and numeric values go here.
    - 'A scenario per criterion: a drill, a red-team case, or a reproducible audit check - something someone can actually run.'
    - 'Mark a criterion situational (base: false) when it depends on the contour, not when it is merely harder. A situational criterion says which contour it is for.'
    - Between them, the criteria should catch the anti-patterns the card lists. An anti-pattern nothing would catch is a warning nobody can act on.
    - Run frequency comes from the change-triggers in Review; a calendar cadence is only the safety net.
  review:
    purpose: Change-triggers for revising the card + a safety-net review cadence. If the safety-net run regularly finds something, the list of change-triggers is incomplete.
    content_requirements:
    - List concrete, control-specific change-triggers — events that make this card's scope/mechanism stale (e.g. a new component type appears, a linked threat's weakness changes, the enforcement point moves) — not generic 'when things change'.
    - State that a periodic safety-net review exists alongside the triggers, without a specific frequency — cadence is set where implementation specifics live, not on the card.
    avoid:
    - A calendar cadence with no named triggers — exposure from a real change then sits uncaught until the next date.
    - A fixed frequency (monthly/quarterly/annual) written into the card.
    - Re-describing operational re-testing of a deployed instance — that's validation's job, not this field's.
  locus:
    purpose: Which layer this control's mechanism belongs to, and why. A reader arrives asking whether this is something to build once for everyone; the value answers that and the note says on what it depends.
    content_requirements:
    - 'value: product, infrastructure, or split. Say it about the mechanism itself, not about any one organisation''s deployment.'
    - 'note: what makes it so - and where it would be otherwise. A control that pays to centralise across many agents may be plain application code for a team with one.'
    - 'split: name the handoff in general terms - the point where a call crosses from application code into the shared path, and which side holds which half.'
    avoid:
    - Writing it as settled for every reader. This field helps someone decide, so a sentence that leaves them nothing to decide has failed at its job.
    - Describing a particular company's platform or team split - that is `implementations`, a different axis.
    - A value with a note that only restates it ('infrastructure, because it is infrastructure').
    examples:
    - split - the mechanism is an interception point in the runtime, so wherever several agents share one, a single enforcement serves all of them. A team with one agent gains nothing from that and can hold the same stop in its own code. The handoff is where a call crosses into the shared execution path.
  maintainer:
    purpose: Name + contact for operational communication.
    content_requirements:
    - Name + contact of whoever maintains this catalog entry — kept it accurate, answers questions about the card itself.
    avoid:
    - The accountable role for a specific deployed instance — that's `implementation.owner`, a different axis (this card's definition vs. a real deployment).
  faq:
    purpose: Short answers to questions that arise when implementing the mitigation - only what is not obvious from the other sections or regularly causes divergent readings.
    content_requirements:
    - Each question is a real point of recurring confusion or divergent reading among people implementing this control — not an invented question added to pad the list.
    - Short, direct answers — no restating purpose/scope/control_mechanism/etc.; if the other fields already answer it, it doesn't belong here.
    avoid:
    - Duplicating content that lives in another field — the FAQ exists for exactly what those fields don't cover.
    - Sneaking a new requirement, threshold, or scope change into an answer — that belongs in scope/validation, not here.
  positioning:
    purpose: How this entry sits relative to the entries in the sources Keel tracks. Only what the mapping itself does not already say.
    content_requirements:
    - Write it only where the shapes differ. A source entry that lines up one-to-one with this one needs nothing here - the mapping already says it.
    - Where a source entry is broader, say what the rest of it is and where that lands, so a reader who came from that entry can find the other half.
    - Where this entry answers a source in a shape of its own (a mechanism carried across many entries rather than one row), say which shape and why.
    - 'Written so it stays true as the catalog grows: about this entry''s relationship to the source, never about the set of entries answering that source.'
    avoid:
    - Catalog state - which entries exist, what is still a gap, what is planned. All of that is computed and shown, and a sentence repeating it is wrong the day it changes.
    - A to-do. This field describes a relationship, not work outstanding.
    - Restating the mapping. That an entry answers ASI02 is already recorded; this field is only for what that fact leaves unsaid.
    - Framework mappings written out by hand - the ids live in catalog/coverage/ and reach the card automatically.
    examples:
    - 'ASI02 groups everything an agent''s tools can be turned to, which spans two harms: an action that should not have been taken, and a read that should not have been served. This entry is the first of those; the second anchors to `data-exposed` and is therefore a separate threat.'
  out_of_scope:
    purpose: What this control deliberately does not cover, and where that is handled instead.
    content_requirements:
    - Name what a reader would reasonably expect this control to catch and it does not, so they stop looking here and go where it is handled.
    - Where the control is structurally the wrong answer for a case rather than merely absent, say so and name the pattern that fits - claiming a card that cannot work is worse than an admitted gap.
    - Bounded by the same deterministic properties `scope` uses, so the two read as one rule seen from both sides.
    avoid:
    - A restated negation of scope ('everything not listed above') - that is what scope already says.
    - Anything conditioned on a team's time or priorities. That is an exception in the acceptance record, not a boundary.
    examples:
    - A stream of near-identical decisions. At that rate a person approves without reading, which looks like the control working and is not; the path needs sampling with a bound on the aggregate, recorded as a deliberate choice.
