function renderReportsMain() {
  const m = document.getElementById("main");
  if (!state.currentReport) {
    m.innerHTML = '<div class="empty">Select a system from the list.</div>';
    renderReportExport();
    return;
  }
  m.innerHTML = reportDetailHtml(state.currentReport);
  wireReportDetail();
  renderReportExport();
}

// Open a system's most recent report (or a specific date). The series is fetched once
// per system and cached, since an archive never changes under us mid-session.
async function openReportSystem(systemId, date) {
  try {
    if (!state.reportSeries[systemId]) {
      state.reportSeries[systemId] = (await j("/reports/" + encodeURIComponent(systemId))).series;
    }
    const series = state.reportSeries[systemId];
    const pick = date || (series[0] && series[0].date);
    if (!pick) { state.currentReport = null; state.reportSelected = null; renderReportsMain(); return; }
    state.currentReport = await j(
      "/reports/" + encodeURIComponent(systemId) + "/" + encodeURIComponent(pick)
    );
    if (!state.reportSelected || state.reportSelected.system_id !== systemId) {
      state.reportExport = null;   // hand-off options are remembered per system
    }
    state.reportSelected = { system_id: systemId, date: pick };
    state.reportSave = "";
  } catch (e) {
    toast(e.message, true);
    return;
  }
  // Names and owners for the referenced controls, resolved once per opened report.
  // Best-effort: if the mitigations call fails the report still renders, just with ids.
  try {
    state.reportMitInfo = await resolveMitigationsForReport(state.currentReport);
  } catch (e) {
    state.reportMitInfo = {};
  }
  renderReportsRail(); renderReportsMain();
}

// -------------------------------------------------- report draft editing --- //
// A draft is edited in place: no Edit button, no mode switch. Every control carries a
// dot-path into state.currentReport (data-rp) and a change schedules one debounced PUT
// of the whole report. Going final swaps every control back to plain text.
const reportEditable = () => (state.currentReport || {}).status === "draft";

// Fixed by keel/schemas/report.py, which is not served through /schema (that endpoint
// covers catalog entities). Keep these in step with the Literals there.
const REPORT_LEVELS = ["low", "medium", "high"];

function setByPath(obj, path, value) {
  const parts = path.split(".");
  let node = obj;
  for (const p of parts.slice(0, -1)) node = node[p];
  node[parts[parts.length - 1]] = value;
}

// A prose field. Editable draft -> a textarea wearing the surrounding type; final -> text.
function rProse(path, value, cls) {
  const v = value == null ? "" : value;
  if (!reportEditable()) {
    return v ? `<div class="${cls}">${esc(v)}</div>` : `<div class="${cls} rep-empty">not recorded</div>`;
  }
  return `<textarea class="ie ${cls}" rows="1" data-rp="${esc(path)}"
    placeholder="not recorded">${esc(v)}</textarea>`;
}

function rSelect(path, value, options, cls) {
  if (!reportEditable()) return `<span class="${cls}">${esc(value)}</span>`;
  const opts = options.map(o =>
    `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("");
  return `<select class="${cls}" data-rp="${esc(path)}">${opts}</select>`;
}

// A textarea that is exactly as tall as its content — an inline editor that scrolls
// internally would hide the sentence being corrected.
function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

let reportSaveTimer = null;
function scheduleReportSave() {
  state.reportSave = "saving";
  paintSaveState();
  renderReportExport();          // the hand-off preview tracks every edit
  clearTimeout(reportSaveTimer);
  reportSaveTimer = setTimeout(saveReport, 500);
}

async function saveReport() {
  const sel = state.reportSelected;
  if (!sel || !state.currentReport) return;
  try {
    // The response is deliberately discarded: replacing state.currentReport mid-typing
    // would swap the object the focused control is bound to.
    await api("PUT", `/reports/${encodeURIComponent(sel.system_id)}/${encodeURIComponent(sel.date)}`,
      state.currentReport);
    state.reportSave = "ok";
  } catch (e) {
    state.reportSave = "err";
    toast(e.message, true);
  }
  paintSaveState();
}

function paintSaveState() {
  const el = document.getElementById("repSave");
  if (!el) return;
  const text = { saving: "saving…", ok: "saved", err: "not saved" };
  el.textContent = text[state.reportSave] || "";
  el.className = "savestate " + (state.reportSave === "ok" ? "ok" : state.reportSave === "err" ? "err" : "");
}

// One finding card. `included` on each requirement is a stored decision, not copy-time
// UI, so the specialist's judgment about what ships survives a reload.
function reportFindingHtml(f, fi) {
  // The card id alone ("CTRL-HACT-CRITICAL") is not a requirement anyone outside this
  // repo can read, and it is what the product team is being handed. Name and owner are
  // resolved once when the report opens (state.reportMitInfo) and shown here.
  const reqs = (f.requirements || []).map((r, ri) => {
    const info = r.mitigation_id ? (state.reportMitInfo || {})[r.mitigation_id] : null;
    const label = info ? info.name : (r.description || r.mitigation_id || "(unnamed requirement)");
    const statusBadge = r.coverage_status !== "needs_implementation"
      ? `<span class="badge soft">${esc(r.coverage_status.replace(/_/g, " "))}</span>` : "";
    // The id link sits OUTSIDE the label — inside it, clicking through to the mitigation
    // would also toggle the checkbox it is nested in.
    const idLink = r.mitigation_id
      ? `<button type="button" class="reflink" data-jump-mit="${esc(r.mitigation_id)}">${esc(r.mitigation_id)}</button>`
      : "";
    const owner = info && info.owner ? esc(" · owner: " + info.owner) : "";
    const box = reportEditable()
      ? `<input type="checkbox" data-rp="findings.${fi}.requirements.${ri}.included" ${r.included ? "checked" : ""}>`
      : `<input type="checkbox" ${r.included ? "checked" : ""} disabled>`;
    return `<div class="req-row"><label>${box}<span>${esc(label)} ${statusBadge}</span></label></div>`
      + ((idLink || owner) ? `<div class="req-meta" style="margin-left:24px">${idLink}${owner}</div>` : "")
      + (r.coverage_note ? `<div class="req-note">${esc(r.coverage_note)}</div>` : "");
  }).join("");
  const ignored = (f.ignored_mitigations || []).map(im =>
    `<div class="req-ignored">Not applied: <button type="button" class="reflink" data-jump-mit="${esc(im.mitigation_id)}">${esc(im.mitigation_id)}</button> — ${esc(im.reason)}</div>`).join("");
  // Severity and likelihood are grades, so they carry the weight ramp. Harm, surface and
  // exploitation cost are facts ABOUT the finding, not grades of it — neutral badges, so
  // nothing on the card competes with the ranking. They also read without being named,
  // which is why they are badges and the chain rows below are labelled.
  const fact = (path, value, options) => reportEditable()
    ? `<span class="badge type">${rSelect(path, value, options, "ie")}</span>`
    : `<span class="badge type">${esc(value)}</span>`;
  const facts = fact(`findings.${fi}.harm`, f.harm, harmEnum())
    + fact(`findings.${fi}.attack_surface`, f.attack_surface, surfaceEnum())
    + `<span class="badge type">exploitation ${rSelect(`findings.${fi}.exploitation_complexity`,
        f.exploitation_complexity, REPORT_LEVELS, "ie")}</span>`;
  const grade = (kind, path, level, quiet) => {
    const inner = reportEditable()
      ? `<select class="ie-grade" data-rp="${esc(path)}" data-grade="${kind}">${REPORT_LEVELS.map(o =>
          `<option value="${o}" ${o === level ? "selected" : ""}>${o}</option>`).join("")}</select>`
      : esc(level);
    return `<span class="sev ${quiet ? "quiet " : ""}sev-${esc(level)}"><span class="p">${kind}</span>${inner}</span>`;
  };
  // The chain the grades rest on. asset / vulnerability / delta and the attacker's motive
  // and access are all in the report and none of them used to reach the screen, so a
  // reader had a severity with nothing behind it.
  const row = (k, path, v) => (reportEditable() || (v || "").toString().trim())
    ? `<dt>${k}</dt><dd>${rProse(path, v, "")}</dd>` : "";
  const chain = row("Asset", `findings.${fi}.asset`, f.asset)
    + row("Weakness", `findings.${fi}.vulnerability`, f.vulnerability)
    + row("Attacker", `findings.${fi}.source.motive`, f.source.motive)
    + row("Their access", `findings.${fi}.source.access`, f.source.access)
    + row("Since last time", `findings.${fi}.delta`, f.delta);
  // A finding names a threat. If it came from the catalog, that name is a way into it.
  const title = f.from_catalog
    ? `<button type="button" class="ctitle reflink" data-jump-threat="${esc(f.id)}">${esc(f.id)}</button>`
    : `<span class="ctitle">${esc(f.id)}</span>`;
  return `<div class="card finding sev-${esc(f.risk.severity)}" data-fi="${fi}">
    <div class="chead">
      ${title}
      <span class="badge soft">${f.from_catalog ? "from catalog" : "not in catalog"}</span>
      ${fact(`findings.${fi}.source.who`, f.source.who, sourceEnum())}
      <span class="grades">
        ${grade("severity", `findings.${fi}.risk.severity`, f.risk.severity)}
        ${grade("likelihood", `findings.${fi}.risk.likelihood`, f.risk.likelihood, true)}
        ${reportEditable() ? `<button type="button" class="fdrop" data-drop-finding="${fi}" title="Remove this finding">&times;</button>` : ""}
      </span>
    </div>
    ${rProse(`findings.${fi}.scenario`, f.scenario, "fscenario")}
    <div class="fwhy"><span class="k">Why these grades</span>${rProse(`findings.${fi}.risk.reasoning`, f.risk.reasoning, "")}</div>
    ${chain ? `<dl class="fchain">${chain}</dl>` : ""}
    <div class="badges">${facts}</div>
    ${(reqs || ignored) ? `<div class="freqs"><span class="freqs-k">Requirements</span>${reqs}${ignored}</div>` : ""}
  </div>`;
}

function reportDetailHtml(rep) {
  const sel = state.reportSelected || {};
  const series = state.reportSeries[sel.system_id] || [];
  const dateChips = series.length > 1
    ? readsec("Other assessments", `<div class="ov-chips">${series.map(s =>
        `<span class="ov-chip ${s.date === sel.date ? "on" : ""}" data-date="${esc(s.date)}" title="Open ${esc(s.date)}">${esc(s.date)}${s.status === "draft" ? " · draft" : ""}</span>`
      ).join("")}</div>`)
    : "";

  // One ranked list, high → low. The spine carries the ranking, so grouping the same
  // card under two different headings only added a second way to render one thing.
  // Sorted as (finding, original index) pairs — the index is the write path, and a
  // sorted copy's index would point every edit at the wrong finding.
  const findings = (rep.findings || []).map((f, i) => [f, i])
    .sort((a, b) => SEVERITY_RANK.indexOf(a[0].risk.severity) - SEVERITY_RANK.indexOf(b[0].risk.severity));
  const findingsHtml = findings.length
    ? findings.map(([f, i]) => reportFindingHtml(f, i)).join("")
    : '<p class="placeholder">No findings.</p>';

  // A ruled-out candidate names a catalog threat, so it links like anything else does.
  const discarded = (rep.discarded || []).length
    ? rep.discarded.map(d => `<div class="req-ignored">
        <button type="button" class="reflink" data-jump-threat="${esc(d.id)}">${esc(d.id)}</button> — ${esc(d.reason)}</div>`).join("")
    : '<p class="placeholder">Nothing ruled out.</p>';

  const dialogue = (rep.dialogue || []).length
    ? rep.dialogue.map(d => `<div class="card">
        <div class="rep-qa"><span class="meta">Q</span>${esc(d.question)}</div>
        <div class="rep-qa"><span class="meta">A</span>${esc(d.answer)}</div>
        <div class="rationale">${esc(d.impact)}</div>
      </div>`).join("")
    : '<p class="placeholder">No recorded exchanges.</p>';

  // Folded and side by side at the foot: both are a trace of how the assessment ran,
  // useful when debugging the assessor, not part of reviewing the system.
  const fold = (key, label, count, body) => `<section class="readsec">
    <details class="fold" data-fold="${key}" ${state.reportAside[key] ? "open" : ""}>
      <summary><h3 class="slabel">${label} <span class="sub">— ${count}</span></h3></summary>
      <div class="fold-body">${body}</div>
    </details></section>`;

  const draft = rep.status === "draft";
  const actions = draft
    ? `<span class="savestate" id="repSave"></span>
       <button class="btn primary" id="repFinalize" title="Freeze this report as a dated record">Finalize</button>`
    : `<button class="btn ghost" id="repReopen" title="Copy this report into a new draft dated today">Revise as a new draft</button>`;

  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">R</div>
      <div class="dtitle">
        <h2>${esc(rep.system_name)}</h2>
        <div class="dsub">Assessed ${esc(rep.date)} by ${esc(rep.assessor)}
          <span class="rep-status ${esc(rep.status)}">${esc(rep.status)}</span></div>
      </div>
      <div class="hactions">${actions}</div>
    </div>
    ${draft ? "" : `<p class="notauthored">This report is final. Revising it opens a new draft dated today, beside this record rather than over it.</p>`}
    ${readsec("System", rProse("system_description", rep.system_description, "prose"))}
    ${(draft || rep.delta_summary)
      ? readsec("What changed since the last assessment", rProse("delta_summary", rep.delta_summary, "prose"))
      : ""}
    ${readsec("Findings", findingsHtml, `— ${findings.length}, worst first`)}
    <div class="rep-aside">
      ${fold("discarded", "Ruled out", (rep.discarded || []).length, discarded)}
      ${fold("dialogue", "Assessor dialogue", (rep.dialogue || []).length, dialogue)}
    </div>
    ${dateChips}
  </div>`;
}

// Resolve each referenced mitigation's display name and the owner accountable for it
// HERE — owner lives on the implementation (a real deployment), not on the card, so
// prefer a shared implementation's owner, else the first one recorded.
async function resolveMitigationsForReport(rep) {
  const ids = [...new Set((rep.findings || [])
    .flatMap(f => (f.requirements || []).map(r => r.mitigation_id).filter(Boolean)))];
  if (!ids.length) return {};
  const all = (await j("/mitigations?brief=false&include=implementations")).mitigations;
  const byId = Object.fromEntries(all.map(m => [m.id, m]));
  const out = {};
  for (const id of ids) {
    const m = byId[id];
    if (!m) continue;
    const impls = m.implementations || [];
    const pick = impls.find(i => i.coverage === "shared") || impls[0] || {};
    out[id] = { name: m.name || id, owner: (pick.owner || "").trim() || null };
  }
  return out;
}

// ------------------------------------------------------- report hand-off --- //
// What goes to the product team, and what it looks like before it goes. The options
// run most-useful-first for THAT reader: the asks, then the evidence behind them, then
// the framing. Nothing is mandatory, but turning the asks off leaves an empty document.
const REPORT_EXPORT_GROUPS = [
  { key: "requirements", label: "Requirements", opts: [
    { key: "reqs", label: "The asks themselves" },
    { key: "owner", label: "Who owns each", sub: "reqs" },
    { key: "covered", label: "Ones already covered", sub: "reqs" },
  ] },
  { key: "evidence", label: "Evidence", opts: [
    { key: "scenario", label: "The scenario behind each" },
    { key: "grades", label: "Severity and likelihood" },
    { key: "reasoning", label: "Why those grades", sub: "grades" },
    { key: "chain", label: "Asset, weakness, attacker" },
  ] },
  { key: "context", label: "Context", opts: [
    { key: "header", label: "System and date" },
    { key: "delta", label: "What changed since last time" },
    { key: "discarded", label: "Ruled out" },
    { key: "dialogue", label: "Assessor dialogue" },
  ] },
];
const REPORT_EXPORT_DEFAULTS = {
  reqs: true, owner: true, covered: false,
  scenario: true, grades: false, reasoning: false, chain: false,
  header: true, delta: false, discarded: false, dialogue: false,
};
const LS_REPORT_EXPORT = "keel.reportExport.";

function reportExportSettings() {
  if (state.reportExport) return state.reportExport;
  const sys = (state.reportSelected || {}).system_id || "";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS_REPORT_EXPORT + sys) || "{}"); } catch (e) { saved = {}; }
  state.reportExport = { ...REPORT_EXPORT_DEFAULTS, ...saved };
  return state.reportExport;
}

function saveReportExportSettings() {
  const sys = (state.reportSelected || {}).system_id || "";
  try { localStorage.setItem(LS_REPORT_EXPORT + sys, JSON.stringify(state.reportExport)); } catch (e) { /* private mode */ }
}

// The hand-off as markdown. Requirements are grouped under the finding that produced
// them, so the prose leading to a set of asks is stated once rather than repeated under
// every one of them.
function buildReportMarkdown(rep, mitInfo, s) {
  if (!rep) return "";
  const lines = [];
  if (s.header) {
    lines.push(`# Security requirements — ${rep.system_name}`, "");
    lines.push(`Assessed ${rep.date} by ${rep.assessor}.`, "");
    if (s.delta && rep.delta_summary) lines.push(rep.delta_summary, "");
  }

  const reqLine = r => {
    const info = r.mitigation_id ? mitInfo[r.mitigation_id] : null;
    const label = info ? info.name : (r.description || r.mitigation_id);
    const owner = s.owner && info && info.owner ? ` (owner: ${info.owner})` : "";
    const note = r.coverage_status === "already_covered" ? " — already covered" : "";
    return `- ${label}${owner}${note}`;
  };

  let any = false;
  for (const f of rep.findings || []) {
    const reqs = s.reqs
      ? (f.requirements || []).filter(r => r.included || (s.covered && r.coverage_status === "already_covered"))
      : [];
    const wantsBody = s.scenario || s.grades || s.chain;
    if (!reqs.length && !wantsBody) continue;
    any = true;
    if (s.grades) lines.push(`**${f.id}** — severity ${f.risk.severity}, likelihood ${f.risk.likelihood}`, "");
    else if (s.scenario || s.chain) lines.push(`**${f.id}**`, "");
    if (s.scenario) lines.push(f.scenario, "");
    if (s.grades && s.reasoning && f.risk.reasoning) lines.push(`Why: ${f.risk.reasoning}`, "");
    if (s.chain) {
      lines.push(`- Asset: ${f.asset}`);
      lines.push(`- Weakness: ${f.vulnerability}`);
      lines.push(`- Attacker: ${f.source.who} — ${f.source.motive}, via ${f.source.access}`);
      lines.push("");
    }
    if (reqs.length) { lines.push(...reqs.map(reqLine), ""); }
  }
  if (!any) lines.push("_Nothing selected._", "");

  if (s.discarded && (rep.discarded || []).length) {
    lines.push("## Ruled out", "");
    lines.push(...rep.discarded.map(d => `- ${d.id} — ${d.reason}`), "");
  }
  if (s.dialogue && (rep.dialogue || []).length) {
    lines.push("## Assessor dialogue", "");
    for (const d of rep.dialogue) lines.push(`- **Q** ${d.question}`, `  **A** ${d.answer}`, `  ${d.impact}`, "");
  }
  return lines.join("\n").trimEnd();
}

// The third grid column, which Reports never used. It earns it here: the hand-off is
// visible the whole time you read the report, not buried in a section at the foot.
function renderReportExport() {
  const el = document.getElementById("preview");
  if (!el || state.screen !== "reports") return;
  if (!state.currentReport) {
    el.innerHTML = '<p class="ptitle">Send to the product team</p><div class="empty" style="margin-top:6vh">—</div>';
    return;
  }
  const s = reportExportSettings();
  const groups = REPORT_EXPORT_GROUPS.map(g => `<div class="exp-group">
      <p class="exp-k">${esc(g.label)}</p>
      ${g.opts.map(o => {
        const off = o.sub && !s[o.sub];
        return `<label class="exp-opt ${o.sub ? "sub" : ""} ${off ? "off" : ""}">
          <input type="checkbox" data-exp="${esc(o.key)}" ${s[o.key] ? "checked" : ""} ${off ? "disabled" : ""}>
          ${esc(o.label)}</label>`;
      }).join("")}
    </div>`).join("");

  const md = buildReportMarkdown(state.currentReport, state.reportMitInfo || {}, s);
  el.innerHTML = `<p class="ptitle">Send to the product team</p>
    <p class="exp-note">Only what is ticked below leaves this screen. Unticking a requirement here does not change the report — untick it in the finding for that.</p>
    ${groups}
    <div class="exp-actions">
      <button class="btn primary" id="expCopy">Copy</button>
      <button class="btn ghost" id="expDownload">Download</button>
    </div>
    <div class="exp-preview" id="expPreview">${esc(md)}</div>`;

  el.querySelectorAll("[data-exp]").forEach(cb => cb.onchange = () => {
    state.reportExport[cb.dataset.exp] = cb.checked;
    saveReportExportSettings();
    renderReportExport();
  });
  const copy = document.getElementById("expCopy");
  if (copy) copy.onclick = async () => {
    try { await copyText(md); toast("Copied to clipboard"); }
    catch (e) { toast(e.message, true); }
  };
  const dl = document.getElementById("expDownload");
  if (dl) dl.onclick = () => {
    const rep = state.currentReport;
    const name = `${rep.system_id}-${rep.date}-requirements.md`;
    const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  };
}

// navigator.clipboard only exists in a secure context, so it is absent when someone
// serves Keel to their team over plain http on a LAN address. Fall back to the old
// execCommand path there rather than losing the feature.
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  document.body.removeChild(ta);
  if (!ok) throw new Error("Copy failed — select the text and copy it manually");
}

function wireReportDetail() {
  const main = document.getElementById("main");
  main.querySelectorAll(".ov-chip[data-date]").forEach(chip =>
    chip.onclick = () => openReportSystem(state.reportSelected.system_id, chip.dataset.date));

  // Every reference into the model is a way into it.
  main.querySelectorAll("[data-jump-threat]").forEach(b =>
    b.onclick = () => jumpToThreat(b.dataset.jumpThreat));
  main.querySelectorAll("[data-jump-mit]").forEach(b =>
    b.onclick = () => jumpToMit(b.dataset.jumpMit));

  // Remember which folded footer sections the reader opened, across re-renders.
  main.querySelectorAll("details[data-fold]").forEach(d =>
    d.ontoggle = () => { state.reportAside[d.dataset.fold] = d.open; });

  main.querySelectorAll("textarea.ie").forEach(ta => autosize(ta));

  // One handler for every editable control: write the value at its dot-path into the
  // open report, then schedule the save. Nothing re-renders on a keystroke.
  main.querySelectorAll("[data-rp]").forEach(el => {
    const commit = () => {
      setByPath(state.currentReport, el.dataset.rp, el.type === "checkbox" ? el.checked : el.value);
      scheduleReportSave();
    };
    if (el.tagName === "TEXTAREA") {
      el.oninput = () => { autosize(el); commit(); };
    } else {
      el.onchange = () => {
        commit();
        // A grade repaints its own badge and spine in place. Re-rendering here would
        // re-sort the list under the cursor and move the card that was just changed.
        if (el.dataset.grade) {
          el.parentElement.className = "sev " + (el.dataset.grade === "likelihood" ? "quiet " : "") + "sev-" + el.value;
          if (el.dataset.grade === "severity") {
            const card = el.closest(".finding");
            if (card) card.className = "card finding sev-" + el.value;
          }
        }
      };
    }
  });

  main.querySelectorAll("[data-drop-finding]").forEach(b => b.onclick = () => {
    const fi = Number(b.dataset.dropFinding);
    const f = state.currentReport.findings[fi];
    if (!confirm(`Remove ${f.id} from this report?`)) return;
    state.currentReport.findings.splice(fi, 1);
    scheduleReportSave();
    renderReportsMain();
  });

  const finalize = document.getElementById("repFinalize");
  if (finalize) finalize.onclick = () => finalizeReport();
  const reopen = document.getElementById("repReopen");
  if (reopen) reopen.onclick = () => reopenReport();
  paintSaveState();
}

// Freezing is the one irreversible step on this screen, so it asks first.
async function finalizeReport() {
  const sel = state.reportSelected;
  if (!sel) return;
  if (!confirm("Finalize this report? It becomes a dated record and stops being editable. "
    + "Revising it later opens a new draft dated that day.")) return;
  clearTimeout(reportSaveTimer);
  await saveReport();
  try {
    state.currentReport = await api("POST",
      `/reports/${encodeURIComponent(sel.system_id)}/${encodeURIComponent(sel.date)}/finalize`);
    state.reportSeries[sel.system_id] = null;   // its status changed
    toast("Report finalized");
  } catch (e) { toast(e.message, true); return; }
  await openReportSystem(sel.system_id, sel.date);
}

async function reopenReport() {
  const sel = state.reportSelected;
  if (!sel) return;
  let fresh;
  try {
    fresh = await api("POST",
      `/reports/${encodeURIComponent(sel.system_id)}/${encodeURIComponent(sel.date)}/reopen`);
  } catch (e) { toast(e.message, true); return; }
  state.reportSeries[sel.system_id] = null;     // a new date exists
  await loadReports();
  await openReportSystem(sel.system_id, fresh.date);
  toast("Opened a new draft dated " + fresh.date);
}

// ------------------------------------------------------- style-guide screen -- //
// Coverage completeness for a field, matched by entity_type + field_name.
// Orphans are excluded from the coverage report, so this returns null for them.
function coverageFor(entity, field) {
  const ents = (state.coverage && state.coverage.entities) || [];
  const ent = ents.find(e => e.entity_type === entity);
  if (!ent) return null;
  const f = (ent.fields || []).find(x => x.field_name === field);
  return f ? f.completeness : null;
}
function covClass(pct) { return pct >= 67 ? "c-hi" : pct >= 34 ? "c-mid" : "c-lo"; }

// Text search: match the field name and its entity.
function styleFieldMatchesText(entity, fname) {
  const q = state.styleFilter.toLowerCase();
  if (!q) return true;
  return (fname + " " + entity).toLowerCase().includes(q);
}
// Facet-match a field: entity chips, coverage band, orphans-only. Orphan fields are
// excluded from the coverage report (coverageFor → null), so they count as empty.
function styleFieldMatchesFacets(entity, fname, f) {
  const F = state.styleFacets;
  if (F.entity.size && !F.entity.has(entity)) return false;
  if (F.coverage.size) {
    const pct = f.is_orphan ? 0 : (coverageFor(entity, fname) ?? 0);
    const band = pct >= 100 ? "complete" : pct > 0 ? "partial" : "empty";
    if (!F.coverage.has(band)) return false;
  }
  if (F.orphan.size && !f.is_orphan) return false;
  return true;
}

// Left rail: entity → field tree built from state.style.entities (schema-derived,
// so it can never drift from the model). Text + facets filter which fields render;
// an entity group with no matching fields is hidden entirely.
function renderStyleRail() {
  const el = document.getElementById("list");
  const ents = (state.style && state.style.entities) || {};
  let html = "";
  let total = 0, shown = 0;
  for (const [etype, ent] of Object.entries(ents)) {
    const fnames = Object.keys(ent.fields || {});
    const matched = fnames.filter(fname => {
      total++;
      const f = ent.fields[fname];
      return styleFieldMatchesText(etype, fname) && styleFieldMatchesFacets(etype, fname, f);
    });
    if (!matched.length) continue;                 // hide empty entity groups
    html += `<div class="sg-group">${esc(etype)}</div>`;
    for (const fname of matched) {
      shown++;
      const f = ent.fields[fname];
      const active = state.styleSel && state.styleSel.entity === etype && state.styleSel.field === fname;
      let badge;
      if (f.is_orphan) {
        badge = '<span class="badge orphan" title="Schema removed this field">orphan</span>';
      } else {
        const pct = coverageFor(etype, fname);
        const n = pct == null ? 0 : pct;
        badge = `<span class="badge cov ${covClass(n)}">${n}%</span>`;
      }
      html += `<div class="row sg-frow ${active ? "active" : ""}" data-entity="${esc(etype)}" data-field="${esc(fname)}">
        <span class="fname">${esc(fname)}</span>${badge}
      </div>`;
    }
  }
  el.innerHTML = html || '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = shown + " / " + total;
  el.querySelectorAll(".sg-frow").forEach(r => r.onclick = () => selectStyleField(r.dataset.entity, r.dataset.field));
}

// Style-guide facet panel — Entity / Coverage / Orphan, same builder as the other rails.
function styleFacetDefs() {
  const ents = Object.keys((state.style && state.style.entities) || {});
  return [
    { key: "entity", label: "Entity", opts: ents.map(e => [e, e]) },
    { key: "coverage", label: "Coverage", opts: [["complete", "complete"], ["partial", "partial"], ["empty", "empty"]] },
    { key: "orphan", label: "Orphan", opts: [["orphan", "orphans only"]] },
  ];
}
function renderStyleFacets() {
  renderFacetPanel({
    open: state.styleFacetsOpen,
    facets: state.styleFacets,
    defs: styleFacetDefs(),
    onopen: on => { state.styleFacetsOpen = on; renderStyleFacets(); },
    onclear: () => { for (const s of Object.values(state.styleFacets)) s.clear(); renderStyleFacets(); renderStyleRail(); },
    ontoggle: (key, val) => {
      const s = state.styleFacets[key];
      s.has(val) ? s.delete(val) : s.add(val);
      renderStyleFacets(); renderStyleRail();
    },
  });
}

// Select a field → seed the editor draft from the saved style entry (a working copy,
// so the right-pane preview can reflect edits before they are saved).
function selectStyleField(entity, field) {
  state.styleSel = { entity, field };
  const sf = styleField(entity, field) || {};
  state.styleDraft = {
    purpose: sf.purpose || "",
    content_requirements: [...(sf.content_requirements || [])],
    avoid: [...(sf.avoid || [])],
    examples: [...(sf.examples || [])],
    instructions: [...(sf.instructions || [])],
  };
  renderStyleRail(); renderStyleDetail(); renderStylePreview();
}

// The live draft as a style-field-like object (what sgHint/sgPanel consume).
function styleDraftAsField() {
  const d = state.styleDraft || {};
  return {
    purpose: d.purpose || "",
    content_requirements: d.content_requirements || [],
    avoid: d.avoid || [],
    examples: d.examples || [],
    instructions: d.instructions || [],
  };
}

// Slots that count toward the coverage percentage (mirrors TRACKED_SLOTS server-side).
const STYLE_SLOTS = ["purpose", "content_requirements", "instructions", "avoid", "examples"];
function filledSlotCount(d) {
  return STYLE_SLOTS.filter(s => {
    const v = d[s];
    return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
  }).length;
}

// Center pane: the bar editor for the selected field's authoring slots.
function renderStyleDetail() {
  const m = document.getElementById("main");
  if (!state.styleSel) { m.innerHTML = '<div class="empty">Select a field from the tree.</div>'; return; }
  const { entity, field } = state.styleSel;
  const sf0 = styleField(entity, field) || {};
  const orphan = !!sf0.is_orphan;
  const d = state.styleDraft;
  m.innerHTML = `<div class="detail">
    <div class="dhead">
      <div class="dicon">S</div>
      <div class="dtitle">
        <h2>${esc(field)}</h2>
        <div class="did">${esc(entity)}${orphan ? " · orphan — schema removed this field" : ""}</div>
      </div>
      <div class="hactions"><button class="btn primary" id="sgSaveBtn">Save</button></div>
    </div>
    <section class="field">
      <h3 class="slabel">Purpose <span class="sub">— the one-line hint shown above the input</span></h3>
      <textarea class="f" id="sg_purpose" rows="2" placeholder="what this field is for">${esc(d.purpose)}</textarea>
    </section>
    ${slotListSection("content_requirements", "Content requirements", "shown as “Include” in the guidance panel")}
    ${slotListSection("avoid", "Avoid", "shown as “Avoid” in the guidance panel")}
    ${slotListSection("examples", "Examples", "the first powers “use example” on the Threats screen")}
    ${slotListSection("instructions", "Instructions", "step-by-step authoring guidance")}
  </div>`;

}

// A list-of-strings slot editor (add/remove rows) — same grammar as screen 1's
// repeatable cards: edit in place, add/remove re-renders.
function slotListSection(slot, label, sub) {
  const items = state.styleDraft[slot] || [];
  const rows = items.map((v, i) => `<li>
    <input class="f sg-item" data-slot="${esc(slot)}" data-i="${i}" value="${esc(v)}">
    <button class="btn ghost sm sg-item-rm" data-slot="${esc(slot)}" data-i="${i}" title="Remove">×</button>
  </li>`).join("");
  return `<section class="field">
    <h3 class="slabel">${esc(label)}${sub ? ` <span class="sub">— ${sub}</span>` : ""}</h3>
    <ul class="slot-list">${rows || '<li class="placeholder" style="border:none">None yet.</li>'}</ul>
    <button class="btn ghost sm sg-item-add" data-slot="${esc(slot)}">+ Add</button>
  </section>`;
}

function wireStyleEditor() {
  const purpose = document.getElementById("sg_purpose");
  if (purpose) purpose.oninput = () => { state.styleDraft.purpose = purpose.value; renderStylePreview(); };
  document.querySelectorAll(".sg-item").forEach(inp => inp.oninput = () => {
    state.styleDraft[inp.dataset.slot][+inp.dataset.i] = inp.value;
    renderStylePreview();   // right pane reflects the unsaved edit live
  });
  document.querySelectorAll(".sg-item-rm").forEach(b => b.onclick = () => {
    state.styleDraft[b.dataset.slot].splice(+b.dataset.i, 1);
    renderStyleDetail(); renderStylePreview();
  });
  document.querySelectorAll(".sg-item-add").forEach(b => b.onclick = () => {
    state.styleDraft[b.dataset.slot].push("");
    renderStyleDetail(); renderStylePreview();
  });
  const save = document.getElementById("sgSaveBtn");
  if (save) save.onclick = saveStyleField;
}

// Right pane: a LIVE preview of exactly what an author sees when they focus this
// field on the Threats screen — same sgHint/sgPanel markup, fed from the in-progress
// draft (not just the saved value), so the maintainer sees the result as they type.
function renderStylePreview() {
  applyPreviewVisibility();
  const el = document.getElementById("preview");
  if (!state.styleSel) {
    el.innerHTML = '<p class="ptitle">Author preview</p><div class="empty" style="margin-top:10vh">—</div>';
    return;
  }
  const { field } = state.styleSel;
  const sf = styleDraftAsField();
  const n = filledSlotCount(state.styleDraft);
  const hint = sgHintFrom(sf) || '<div class="sg-hint" style="opacity:.55">No purpose yet.</div>';
  const panel = sgPanelFrom(sf, null, { show: true });
  el.innerHTML = `<p class="ptitle">Author preview <span class="slotcount">${n} / ${STYLE_SLOTS.length} slots</span></p>
    <p class="hint" style="margin:0 0 12px">What an author sees when they focus <b>${esc(field)}</b> on the Threats screen.</p>
    <div class="sg-fieldwrap field">
      <h3 class="slabel">${esc(field)}</h3>
      ${hint}
      <textarea class="f" rows="2" readonly placeholder="author's ${esc(field)} goes here"></textarea>
      ${panel}

}

// PATCH the changed slots, then refresh the guide + coverage so the tree badges move.
async function saveStyleField() {
  if (!state.styleSel) return;
  const { entity, field } = state.styleSel;
  const d = state.styleDraft;
  const body = {
    purpose: d.purpose,
    content_requirements: d.content_requirements,
    avoid: d.avoid,
    examples: d.examples,
    instructions: d.instructions,
  };
  try {
    await api("PATCH", "/style-guide/" + encodeURIComponent(entity) + "/" + encodeURIComponent(field), body);
    state.style = await j("/style-guide");
    state.coverage = await j("/style-guide/coverage");
    renderStyleRail(); renderStyleFacets(); renderStyleDetail(); renderStylePreview();
    toast("Style guide saved");
    showSavedDialog("catalog/style_guide/" + entity + ".yaml");
  } catch (e) { toast(e.message, true); }
}

// ===================================================================== //
// Mitigations screen — reuses the three-pane grammar, the fieldset/legend //
// section tiers, the .ecard cards, the one-line hints, and the right-rail //
// Preview/Guidance modes from the threat editor.                          //
// ===================================================================== //

// Enum values off the mitigation schema. status/mitigation_class are Optional /
// required Literals, so the enum can sit directly on the prop or inside an anyOf.
function mitProp(name) { return (state.schema.mitigation && state.schema.mitigation.properties || {})[name]; }
function mitEnum(name) {
  const p = mitProp(name);
  if (!p) return [];
  if (Array.isArray(p.enum)) return p.enum;
  if (Array.isArray(p.anyOf)) { for (const a of p.anyOf) if (Array.isArray(a.enum)) return a.enum; }
  return [];
}

// Which threats currently link a given mitigation (reverse index over state.threatMits).
function threatsAddressing(mid) {
  return (state.threatMits || []).filter(t => (t.mitigations || []).some(l => l.id === mid));
}

// --------------------------------------------------------- mitigations rail - //
// Text search across id + name + purpose.
function mitMatchesText(m, f) {
  if (!f) return true;
  return [m.id, m.name, m.purpose].join(" ").toLowerCase().includes(f);
}
// A mitigation's facet-values for a group (orphan = addresses 0 threats).
function mitFacetValues(m, key) {
  switch (key) {
    case "class": return m.mitigation_class ? [m.mitigation_class] : [];
    case "status": return m.status ? [m.status] : [];
    case "implementations": {
      const impls = m.implementations || [];
      if (!impls.length) return ["none"];
      return impls.some(i => i.coverage === "shared") ? ["has", "shared"] : ["has"];
    }
    case "linkage": return threatsAddressing(m.id).length ? ["linked"] : ["orphan"];
  }
  return [];
}
function mitMatchesFacets(m) {
  const F = state.mitFacets;
  for (const key of Object.keys(F)) {
    const sel = F[key];
    if (!sel || !sel.size) continue;
    const vals = mitFacetValues(m, key);
    if (!vals.some(v => sel.has(v))) return false;   // AND across groups, OR within
  }
  return true;
}

function renderMitRail() {
  const el = document.getElementById("list");
  const f = state.mitFilter.toLowerCase();
  const items = state.mitRich.filter(m => mitMatchesText(m, f) && mitMatchesFacets(m));
  el.innerHTML = items.length ? items.map(m => `
    <div class="row ${state.mitSelected === m.id ? "active" : ""}" data-id="${esc(m.id)}">
      <span class="rid">${esc(m.id)}</span>
      <span class="rtitle">${esc(m.name)}</span>
    </div>`).join("") : '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = items.length + " / " + state.mitRich.length;
  el.querySelectorAll(".row").forEach(r => r.onclick = () => selectMit(r.dataset.id));
}

// Mitigations facet panel — a lighter set: class, status, implementations, linkage.
function mitFacetDefs() {
  return [
    { key: "class", label: "Class", opts: mitEnum("mitigation_class").map(v => [v, v]) },
    { key: "status", label: "Status", opts: mitEnum("status").map(v => [v, v]) },
    { key: "implementations", label: "Implementations", opts: [["has", "has"], ["shared", "shared"], ["none", "none"]] },
    { key: "linkage", label: "Linkage", opts: [["linked", "linked"], ["orphan", "orphan"]] },
  ];
}
function renderMitFacets() {
  renderFacetPanel({
    open: state.mitFacetsOpen,
    facets: state.mitFacets,
    defs: mitFacetDefs(),
    onopen: on => { state.mitFacetsOpen = on; renderMitFacets(); },
    onclear: () => { for (const s of Object.values(state.mitFacets)) s.clear(); renderMitFacets(); renderMitRail(); },
    ontoggle: (key, val) => {
      const s = state.mitFacets[key];
      s.has(val) ? s.delete(val) : s.add(val);
      renderMitFacets(); renderMitRail();
    },
  });
}

async function selectMit(id) {
  state.mitSelected = id; state.mitEditing = false; state.mitDraft = null;
  state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };
  // History is per-entry: clear it on select; loadHistory refetches and re-renders.
  state.mitHistory = null; state.mitHistoryExpanded = false;
  state.mitHistoryOpen = new Set(); state.mitDiffCache = {};
  renderMitRail();
  try {
    state.currentMit = await j("/mitigations/" + encodeURIComponent(id));
  } catch (e) { state.currentMit = null; toast(e.message, true); }
  // Reverse index for "addresses threats" — one cheap call, kept fresh per select.
  try { const d = await j("/threats?brief=false&include=mitigations"); state.threatMits = d.threats || []; }
  catch (e) { /* leave whatever we had */ }
  renderMitDetail(); renderMitPreview();
  document.getElementById("main").scrollTop = 0;
  loadHistory(mitHistoryCfg());   // fetch the commit list, then re-render (non-blocking)
}

// --------------------------------------------------------- mitigations detail //
function renderMitDetail() {
  const m = document.getElementById("main");
  if (!state.mitSelected || !state.currentMit) {
    m.innerHTML = '<div class="empty">Select a mitigation from the list.</div>';
    return;
  }
  m.innerHTML = state.mitEditing ? editMitigation(state.currentMit) : readMitigation(state.currentMit);
  wireMitDetail();
}

// Read view — the mitigation card grouped into readable sections.
// Empty optional sections are omitted (no wall of dashes) and summarized in one muted
// line; Implementations stays visible with its intentional "orgs add these" empty state.
function readMitigation(mt) {
  const badge = (cls, v) => `<span class="badge ${cls}">${esc(v)}</span>`;
  const omitted = [];
  const parts = [];
  // Optional prose: rendered only when it has content; else recorded as a gap (with the
  // edit-form field to jump to when its chip is clicked).
  const optProse = (label, field, v, sub) => {
    if (v && String(v).trim()) parts.push(readsec(label, `<div class="prose">${esc(v)}</div>`, sub));
    else omitted.push({ label, field });
  };
  // Optional block (list/cards): rendered only when non-empty; else recorded as a gap.
  // `count` (when given) is shown in the header of a populated block but kept out of the
  // gap chip, so an empty one reads "Validation", not "Validation (0)".
  const optBlock = (label, field, has, inner, sub, count) => {
    if (has) parts.push(readsec(count === undefined ? label : `${label} (${count})`, inner, sub));
    else omitted.push({ label, field });
  };

  optProse("Purpose", "purpose", mt.purpose);
  optProse("Scope", "scope", mt.scope, "— applicability rule + boundary");
  optProse("Control mechanism", "control_mechanism", mt.control_mechanism);
  optProse("Failure behavior", "failure_behavior", mt.failure_behavior);
  optProse("Risk of formal implementation", "formal_implementation_risk", mt.formal_implementation_risk);
  optProse("Review", "review", mt.review);

  // Ownership — omit entirely when maintainer/locus are all blank; else show the filled rows.
  const own = [["Maintainer", mt.maintainer], ["Locus", mt.locus]]
    .filter(([, v]) => v && String(v).trim());
  optBlock("Ownership", "maintainer", own.length,
    `<ul class="plain">${own.map(([k, v]) => `<li><span class="meta">${esc(k)}</span>${esc(v)}</li>`).join("")}</ul>`,
    "— maintainer / locus");

  optProse("Telemetry", "telemetry", mt.telemetry);

  optBlock("Anti-patterns", "anti_patterns", (mt.anti_patterns || []).length,
    `<ul class="plain">${(mt.anti_patterns || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);

  const vlen = (mt.validation || []).length;
  optBlock("Validation", "validation", vlen,
    (mt.validation || []).map(v => `<div class="card">
        <div class="chead"><span class="ctitle">${esc(v.criterion || "(criterion)")}</span>${
          v.base === false ? '<span class="badge soft" style="margin-left:auto">extended</span>' : ""}</div>
        ${v.test_scenario ? `<div class="cdesc"><b>Test:</b> ${esc(v.test_scenario)}</div>` : ""}
        ${v.expected_result ? `<div class="cdesc"><b>Expected:</b> ${esc(v.expected_result)}</div>` : ""}
      </div>`).join(""), null, vlen);

  const flen = (mt.faq || []).length;
  optBlock("FAQ", "faq", flen,
    (mt.faq || []).map(q => `<div class="card">
        <div class="chead"><span class="ctitle">${esc(q.question || "(question)")}</span></div>
        ${q.answer ? `<div class="cdesc">${esc(q.answer)}</div>` : ""}
      </div>`).join(""), null, flen);

  // Implementations — ALWAYS shown; its empty state is intentional and discoverable.
  const impl = (mt.implementations || []).length
    ? (mt.implementations || []).map(im => `<div class="card">
        <div class="chead"><span class="ctitle">${esc(im.title || "(untitled)")}</span>${im.coverage === "shared" ? `<span class="badge shared">shared</span>` : ""}</div>
        ${im.description ? `<div class="cdesc">${esc(im.description)}</div>` : ""}
        ${im.coverage === "shared" && im.covers ? `<div class="cdesc">Covers: ${esc(im.covers)}</div>` : ""}
        ${im.owner ? `<div class="cdesc">Owner: ${esc(im.owner)}</div>` : ""}
        ${im.reference ? `<div class="cdesc"><a href="${esc(im.reference)}" target="_blank" rel="noopener">${esc(im.reference)}</a></div>` : ""}
      </div>`).join("")
    : '<p class="placeholder">None yet — orgs add these after forking.</p>';
  parts.push(readsec(`Implementations (${(mt.implementations || []).length})`, impl, "— how orgs realize this control"));

  // Addresses threats — ALWAYS shown; each card jumps to that threat.
  const addressing = threatsAddressing(mt.id);
  const addressed = addressing.length
    ? addressing.map(t => `<div class="card jrow" data-jthreat="${esc(t.id)}" title="Open ${esc(t.id)}"><div class="chead">
        <span class="cid">${esc(t.id)}</span><span class="ctitle">${esc(t.title)}</span></div></div>`).join("")
    : '<p class="placeholder">No threats link this mitigation.</p>';
  parts.push(readsec(`Addresses threats (${addressing.length})`, addressed));

  return `<div class="detail">
    ${crumb("Mitigations", mt.id)}
    ${lastChangedLine(state.mitHistory)}
    <div class="dhead">
      <div class="dicon">C</div>
      <div class="dtitle">
        <h2>${esc(mt.name)}</h2>
        <div class="did">${esc(mt.id)}</div>
        <div class="hbadges badges">
          ${mt.mitigation_class ? badge("type", mt.mitigation_class) : ""}
          ${mt.status ? badge("soft", mt.status) : ""}
        </div>
      </div>
      ${mitHeadActions()}
    </div>
    ${parts.join("")}
    ${gapsBar(omitted)}
    ${historySection(mitHistoryCfg())}
  </div>`;
}

// Header actions for a mitigation (Edit / Delete).
function mitHeadActions() {
  return `<div class="hactions">
    <button class="btn ghost" id="mitEditBtn">Edit</button>
    <button class="btn ghost" id="mitDeleteBtn" title="Delete this mitigation">Delete</button>
  </div>`;
}

// Wire the mitigation detail pane (read + edit).
function wireMitDetail() {
  const editBtn = document.getElementById("mitEditBtn");
  if (editBtn) editBtn.onclick = enterMitEdit;
  const delBtn = document.getElementById("mitDeleteBtn");
  if (delBtn) delBtn.onclick = deleteMitigation;
  // Read view only: breadcrumb clears the selection; "Addresses threats" cards jump across.
  const crumbBtn = document.querySelector("#main .crumb-type");
  if (crumbBtn) crumbBtn.onclick = clearMitSelection;
  document.querySelectorAll("#main [data-jthreat]").forEach(el =>
    el.onclick = () => jumpToThreat(el.dataset.jthreat));
  // Read view only: a gap chip enters the editor and jumps to that field.
  document.querySelectorAll("#main .gap-chip").forEach(chip =>
    chip.onclick = () => { state.focusField = chip.dataset.gapField; enterMitEdit(); });
  // Read view only: the Git history section (selectors miss in edit mode).
  wireHistory(mitHistoryCfg());
  const cancelBtn = document.getElementById("mitCancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => {
    const wasNew = state.mitDraft && state.mitDraft.isNew;
    state.mitEditing = false; state.mitDraft = null;
    state.railMode = "preview"; state.guidance = null;
    if (wasNew) { state.mitSelected = null; state.currentMit = null; renderMitRail(); }
    renderMitDetail(); renderMitPreview();
  };
  const saveBtn = document.getElementById("mitSaveBtn");
  if (saveBtn) saveBtn.onclick = saveMitigation;
  if (state.mitEditing) { wireMitEdit(); wireInlineGuidance(); applyMitValidation(); }
}

// Mitigations have no right rail either — the read view is the canonical surface
// and its own preview, and guidance is inline (see inlineGuidance). Thin shim so
// the repaint call sites just re-check whether any rail should show (only Style).

// ------------------------------------------------------ mitigation edit ---- //
// One input builder shared by standalone sections and grouped subfields.
function mitInput(name, kind, rows) {
  const d = state.mitDraft;
  if (kind === "select") {
    const vals = mitEnum(name);
    const cur = d[name] || "";
    const blank = name === "status" ? `<option value="" ${cur ? "" : "selected"}>— none —</option>` : "";
    return `<select class="f" id="mit_${name}">${blank}${
      vals.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  }
  if (kind === "textarea") {
    return `<textarea class="f" id="mit_${name}" rows="${rows || 3}">${esc(d[name] || "")}</textarea>`;
  }
  return `<input class="f" id="mit_${name}" value="${esc(d[name] || "")}">`;
}

function mitGroupSection(legend, sub, inner) {

// Anti-patterns — repeatable bordered .ecard cards, each holding one string.
function antiPatternsEditor() {
  const items = state.mitDraft.anti_patterns || [];
  const open = state.mitApOpen || new Set();
  const cards = items.map((v, i) => {
    const isOpen = open.has(i);

// A blank draft for a new mitigation (id + name prompted; class defaults to the first enum).
function newMitigation() {
  const id = (window.prompt("New mitigation id (e.g. CTRL-NEW-CONTROL):") || "").trim();
  if (!id) return;
  if (state.mitList.some(([mid]) => mid === id)) { toast("A mitigation with that id already exists", true); return; }
  const name = (window.prompt("Name (you can edit it below):") || "").trim();
  const class0 = mitEnum("mitigation_class")[0] || "";
  const blank = {
    id, name, status: "draft", mitigation_class: class0, purpose: "", scope: "",

    maintainer: "", locus: "", telemetry: "", anti_patterns: [], validation: [], faq: [],
    implementations: [],
  };
  state.mitSelected = id;

  state.mitDraft = { ...blank, isNew: true };
  state.mitApOpen = new Set(); state.mitValOpen = new Set(); state.mitFaqOpen = new Set();
  state.mitImplOpen = new Set();
  state.mitEditing = true; state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };

async function deleteMitigation() {
  const id = state.mitSelected;
  if (!id || (state.mitDraft && state.mitDraft.isNew)) return;
  if (!window.confirm(`Delete ${id}? It will be unlinked from any threats that reference it.`)) return;
  try { await api("DELETE", "/mitigations/" + encodeURIComponent(id)); }
  catch (e) { toast(e.message, true); return; }
  await refreshMitList();
  try { const d = await j("/threats?brief=false&include=mitigations"); state.threatMits = d.threats || []; } catch (e) { /* keep */ }
  state.mitSelected = null; state.currentMit = null; state.mitDraft = null;
  state.mitEditing = false; state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };
  renderMitRail(); renderMitFacets(); renderMitDetail(); renderMitPreview();
  toast("Mitigation deleted");
}

async function refreshMitList() {
  const mi = await j(MITS_RICH_URL);
  setMitData(mi.mitigations || []);
}

// Wire the edit form: scalar fields, the three card lists, add/remove/collapse.
const MIT_SCALARS = ["name", "status", "mitigation_class", "purpose", "scope", "control_mechanism",
  "failure_behavior", "formal_implementation_risk", "review", "maintainer", "locus", "telemetry"];
function shiftOpenSet(set, removed) {
  const next = new Set();
  (set || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  return next;
}
function wireMitEdit() {
  const d = state.mitDraft;
  MIT_SCALARS.forEach(n => {
    const el = document.getElementById("mit_" + n);
    if (!el) return;
    const ev = el.tagName === "SELECT" ? "onchange" : "oninput";
    el[ev] = () => { d[n] = el.value; };
  });
  // Anti-pattern cards
  document.querySelectorAll(".ap-card").forEach(card => {
    const i = +card.dataset.idx;
    const text = card.querySelector(".ap-text");
    if (text) text.oninput = () => d.anti_patterns[i] = text.value;
    const rm = card.querySelector(".ap-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.anti_patterns.splice(i, 1); state.mitApOpen = shiftOpenSet(state.mitApOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".ap-remove")) return; toggleSet(state.mitApOpen, i); renderMitDetail(); };
  });
  const addAp = document.getElementById("addAntiPattern");
  if (addAp) addAp.onclick = () => { d.anti_patterns.push(""); (state.mitApOpen || (state.mitApOpen = new Set())).add(d.anti_patterns.length - 1); renderMitDetail(); };
  // Validation cards
  document.querySelectorAll(".validation-card").forEach(card => {
    const i = +card.dataset.idx;
    const cr = card.querySelector(".val-criterion");
    const ts = card.querySelector(".val-test");
    const ex = card.querySelector(".val-expected");
    if (cr) cr.oninput = () => d.validation[i].criterion = cr.value;
    if (ts) ts.oninput = () => d.validation[i].test_scenario = ts.value;

    const rm = card.querySelector(".val-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.validation.splice(i, 1); state.mitValOpen = shiftOpenSet(state.mitValOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".val-remove")) return; toggleSet(state.mitValOpen, i); renderMitDetail(); };
  });
  const addVal = document.getElementById("addValidation");
  if (addVal) addVal.onclick = () => { d.validation.push({ criterion: "", test_scenario: "", expected_result: "" }); (state.mitValOpen || (state.mitValOpen = new Set())).add(d.validation.length - 1); renderMitDetail(); };
  // FAQ cards
  document.querySelectorAll(".faq-card").forEach(card => {
    const i = +card.dataset.idx;
    const q = card.querySelector(".faq-question");
    const a = card.querySelector(".faq-answer");
    if (q) q.oninput = () => d.faq[i].question = q.value;
    if (a) a.oninput = () => d.faq[i].answer = a.value;
    const rm = card.querySelector(".faq-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.faq.splice(i, 1); state.mitFaqOpen = shiftOpenSet(state.mitFaqOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".faq-remove")) return; toggleSet(state.mitFaqOpen, i); renderMitDetail(); };
  });
  const addFaq = document.getElementById("addFaq");
  if (addFaq) addFaq.onclick = () => { d.faq.push({ question: "", answer: "" }); (state.mitFaqOpen || (state.mitFaqOpen = new Set())).add(d.faq.length - 1); renderMitDetail(); };
  // Implementation cards
  document.querySelectorAll(".implementation-card").forEach(card => {
    const i = +card.dataset.idx;
    const ti = card.querySelector(".impl-title");
    const de = card.querySelector(".impl-description");
    const re = card.querySelector(".impl-reference");
    const cv = card.querySelector(".impl-coverage");
    const cvs = card.querySelector(".impl-covers");
    const ow = card.querySelector(".impl-owner");
    if (ti) ti.oninput = () => d.implementations[i].title = ti.value;
    if (de) de.oninput = () => d.implementations[i].description = de.value;
    if (re) re.oninput = () => d.implementations[i].reference = re.value;

    if (cvs) cvs.oninput = () => d.implementations[i].covers = cvs.value;

// Map a failed PATCH/POST error path to its .field wrapper (no live validate endpoint).
function fieldElMit(path) {
  if (!path) return null;
  const parts = path.split(".");
  if ((parts[0] === "validation" || parts[0] === "faq") && parts.length === 3) {
    return document.querySelector(`.${parts[0]}-card[data-idx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`)
      || document.querySelector(`.field[data-entity="mitigation"][data-field="${CSS.escape(parts[0])}"]`);
  }
  if (parts[0] === "implementations" && parts.length === 3) {
    return document.querySelector(`.implementation-card[data-idx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`)
      || document.querySelector('.field[data-entity="implementation"]');
  }
  if (parts[0] === "anti_patterns") {
    return document.querySelector('.field[data-entity="mitigation"][data-field="anti_patterns"]');
  }
  if (parts.length === 1) {
    return document.querySelector(`.field[data-entity="mitigation"][data-field="${CSS.escape(parts[0])}"]`);
  }
  return null;
}
function renderMitErrorSummary(errors) {
  const el = document.getElementById("mitErrSummary");
  if (!el) return;
  if (!errors.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "block";
  el.innerHTML = `<strong>Fix these before saving:</strong><ul>${errors.map(e =>
    `<li>${e.field ? `<code>${esc(e.field)}</code> — ` : ""}${esc(e.msg)}</li>`).join("")}</ul>`;
}
// Same red channel the threat editor uses — mapped from the server's Pydantic errors.
function applyMitValidation() {
  const errors = (state.mitValidation && state.mitValidation.errors) || [];
  document.querySelectorAll("#main .fld-msg").forEach(e => e.remove());
  document.querySelectorAll("#main .field").forEach(f => f.classList.remove("has-err", "has-adv"));
  renderMitErrorSummary(errors);
  errors.forEach(item => {
    const el = fieldElMit(item.field);
    if (!el) return;
    el.classList.add("has-err");
    const msg = document.createElement("div");
    msg.className = "fld-msg err";
    msg.textContent = item.msg;
    el.appendChild(msg);
  });
  markCollapsedCards(errors);   // surface errors hidden inside collapsed cards
}

// Save: PATCH an existing mitigation, POST a new one. A failed request maps the
// server's Pydantic error response into the RED channel (dup id on create → 409).
async function saveMitigation() {
  const d = state.mitDraft;
  const isNew = !!d.isNew;
  const body = {
    name: d.name,
    status: d.status || null,
    mitigation_class: d.mitigation_class,
    purpose: d.purpose, scope: d.scope, control_mechanism: d.control_mechanism,
    failure_behavior: d.failure_behavior, formal_implementation_risk: d.formal_implementation_risk,
    review: d.review, maintainer: d.maintainer, locus: d.locus, telemetry: d.telemetry,
    anti_patterns: (d.anti_patterns || []).map(s => (s || "").trim()).filter(Boolean),
    validation: (d.validation || []).filter(v => (v.criterion || "").trim()).map(v => ({
      criterion: v.criterion, test_scenario: v.test_scenario || null, expected_result: v.expected_result || null,
    })),
    faq: (d.faq || []).filter(q => (q.question || "").trim() || (q.answer || "").trim())
      .map(q => ({ question: q.question, answer: q.answer })),
    implementations: (d.implementations || []).filter(im => (im.title || "").trim() || (im.description || "").trim())
      .map(im => ({
        title: im.title, description: im.description, reference: (im.reference || "").trim() || null,
        coverage: im.coverage || "local",
        covers: im.coverage === "shared" ? (im.covers || "").trim() || null : null,
        owner: (im.owner || "").trim() || null,
      })),
  };
  const url = isNew ? "/mitigations" : "/mitigations/" + encodeURIComponent(state.mitSelected);
  if (isNew) body.id = state.mitSelected;
  const r = await fetch(url, {
    method: isNew ? "POST" : "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    let errs;
    if (Array.isArray(data.detail)) {
      errs = data.detail.map(e => ({
        field: (e.loc || []).filter(x => x !== "body").join("."),
        msg: e.msg || "invalid",
      }));
    } else {
      errs = [{ field: "", msg: data.detail || ((isNew ? "POST " : "PATCH ") + url + " → " + r.status) }];
    }
    state.mitValidation = { errors: errs, advice: [] };
    applyMitValidation();
    toast("Save blocked — fix the errors", true);
    return;
  }
  state.currentMit = await j("/mitigations/" + encodeURIComponent(state.mitSelected));
  state.mitEditing = false; state.mitDraft = null;
  state.railMode = "preview"; state.guidance = null;
  await refreshMitList();
  state.mitValidation = { errors: [], advice: [] };
  renderMitRail(); renderMitFacets(); renderMitDetail(); renderMitPreview();
  showSavedDialog("catalog/mitigations/" + state.mitSelected + ".yaml");
}

// --------------------------------------------------------------- start ----- //
document.getElementById("search").oninput = e => {
  if (state.screen === "mitigations") { state.mitFilter = e.target.value; renderMitRail(); }
  else if (state.screen === "style") { state.styleFilter = e.target.value; renderStyleRail(); }
  else { state.filter = e.target.value; renderList(); }
};
document.getElementById("newThreatBtn").onclick = () =>
  state.screen === "mitigations" ? newMitigation() : newThreat();
document.querySelectorAll("#screens button").forEach(b => b.onclick = () => switchScreen(b.dataset.screen));
// Validate the threat draft on BLUR of any edit field (debounced, never per keystroke).
// Authoring guidance is now inline under each field (see inlineGuidance), so focus no
// longer drives a right-rail mode — nothing to switch here.
document.getElementById("main").addEventListener("focusout", () => {
  if (state.screen === "threats" && state.editing) scheduleValidate();
});
// ------------------------------------------------- rail collapse + resize -- //
// Left rail collapses to a thin strip (list/search/filters hidden, only the expand
// affordance visible); the right rail is drag-resizable on the main|preview seam.
// Both persist to localStorage and re-apply on load. No library.
const LS_RAIL = "keel.railCollapsed";
const LS_PREVIEW = "keel.previewW";
const PREVIEW_MIN = 280, PREVIEW_MAX = 640;

function initRailToggle() {
  const btn = document.getElementById("railToggle");
  const apply = on => {
    document.body.classList.toggle("rail-collapsed", on);
    if (btn) { btn.textContent = on ? "»" : "«"; btn.title = on ? "Expand" : "Collapse"; }
  };
  apply(localStorage.getItem(LS_RAIL) === "1");
  if (btn) btn.onclick = () => {
    const on = !document.body.classList.contains("rail-collapsed");
    localStorage.setItem(LS_RAIL, on ? "1" : "0");
    apply(on);
  };
}

function initPreviewResizer() {
  const setW = px => document.documentElement.style.setProperty("--preview-w", px + "px");
  const clamp = px => Math.max(PREVIEW_MIN, Math.min(PREVIEW_MAX, px));
  const saved = parseInt(localStorage.getItem(LS_PREVIEW), 10);
  if (saved >= PREVIEW_MIN && saved <= PREVIEW_MAX) setW(saved);
  const handle = document.getElementById("preview-resizer");
  if (!handle) return;
  handle.addEventListener("mousedown", e => {
    e.preventDefault();
    document.body.classList.add("resizing");
    let last = clamp(window.innerWidth - e.clientX);
    const move = ev => { last = clamp(window.innerWidth - ev.clientX); setW(last); };
    const up = () => {
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      localStorage.setItem(LS_PREVIEW, String(last));
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}

initRailToggle();
initPreviewResizer();

// Land on the Overview dashboard; switchScreen wires the rail/main/right and loads it.
boot().then(() => switchScreen("overview")).catch(e =>
  document.getElementById("main").innerHTML = '<div class="empty">Load error: ' + esc(e.message) + '</div>');
</script>
