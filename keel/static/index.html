<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel · GenAI threat model</title>
<style>
  /* Design tokens — mirrors .claude/skills/keel-design-system/tokens/*.css.
     Inlined rather than linked: the app is one static file with zero external
     requests, which the design system states as a non-negotiable. Keep the two
     in step; author against the semantic aliases at the foot, not the raw ramps. */
  :root {
    /* type */
    --font-sans: -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", monospace;
    --fs-10: 10px; --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
    --fs-15: 15px; --fs-19: 19px; --fs-20: 20px; --fs-24: 24px; --fs-28: 28px;
    --lh-tight: 1.35; --lh-base: 1.55; --lh-prose: 1.6; --lh-legend: 1.7;
    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
    --ls-title: -.01em; --ls-number: -.02em; --ls-eyebrow: .08em; --ls-key: .06em; --ls-meta: .05em;
    --numeric: tabular-nums;
    /* colour ramps */
    --navy-900: #17203a; --navy-800: #232d4a; --navy-700: #38415f; --navy-600: #4a5570;
    /* navy-500 darkened from #6b7690: at the old value the quiet text tier measured
       4.20:1 on the app background and 4.28:1 on the section tint, so most of the meta,
       hints and provenance lines in the app failed WCAG AA. #636e88 clears 4.5:1 on all
       four surfaces (app, tint, panel, navy-100) and is visually the same grey-blue. */
    --navy-500: #636e88; --navy-400: #97a0b5; --navy-200: #d7dce8; --navy-100: #eef1f7;
    --crimson-700: #b81f42; --crimson-600: #d6294e; --crimson-200: #f6c9d3; --crimson-50: #fdeef1;
    --amber: #e0a021; --amber-50: #fdf3e0; --amber-700: #8f6410;
    /* --green-700 is the text-only step, the same arrangement --amber-700 already had:
       --green on green-50 measures 3.10:1. Green stays a fill on dots and bar segments. */
    --green: #1f9d57; --green-50: #eaf4ee; --green-200: #bfe3cd; --green-700: #136c3a;
    --bg: #f4f6fb; --panel: #ffffff; --tint: #f6f8fc; --white: #ffffff;
    --border: #dfe3ec; --border2: #eef1f7;
    /* diff palette — deliberately GitHub's, not Keel's, so a reviewer reads it instantly */
    --diff-add-bg: #e6ffec; --diff-add-gutter: #cdffd8; --diff-add-gutter-fg: #2b7d47; --diff-add-fg: #17683a;
    --diff-del-bg: #ffeef0; --diff-del-gutter: #ffdce0; --diff-del-gutter-fg: #b0374f; --diff-del-fg: #9e1c3a;
    --diff-hunk-bg: #eef1f7;
    /* one spacing scale (multiples of 4/8) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    --field-gap: 24px; --section-gap: 44px; --input-h: 38px;
    --pad-rail-row: 10px 15px; --pad-card: 13px 15px; --pad-section: 12px 14px; --pad-main: 30px 40px;
    /* radii */
    --r-4: 4px; --r-5: 5px; --r-6: 6px; --r-8: 8px; --r-9: 9px; --r-10: 10px; --r-pill: 20px; --r-round: 50%;
    /* elevation — only genuinely floating layers cast a shadow */
    --shadow-toast: 0 8px 24px rgba(20, 30, 60, .2);
    --shadow-dialog: 0 10px 30px rgba(20, 30, 60, .18);
    --focus-ring: 0 0 0 3px var(--crimson-50);
    --selected-rail-accent: inset 3px 0 0 var(--crimson-600);
    /* motion — browser default easing throughout, no custom curves */
    --dur-hover: .12s; --dur-layer: .2s; --ease: ease; --toast-rise: 8px;
    /* grid track widths — driven by the rail collapse toggle + the preview resizer */
    --rail-w: 320px; --rail-w-collapsed: 44px; --preview-w: 360px; --resizer-w: 9px; --app-h: 100vh;
    --topbar-h: 46px;
    /* Prose measure. The editor pane is 1fr and goes very wide on a large display;
       14px running text at 1600px is unreadable. Body copy caps at a normal line. */
    --measure: 74ch;
    /* ---- semantic aliases ---- */
    --text-strong: var(--navy-900); --text-body: var(--navy-700); --text-body-read: var(--navy-800);
    /* navy-400 is NOT a text step — it measures 2.62:1 on white and cannot carry type
       on any Keel surface. It stays in the ramp for rules, dots and the low spine. */
    --text-muted: var(--navy-500); --text-faint: var(--navy-500); --text-inverse: #ffffff;
    --text-link: var(--crimson-600); --text-link-hover: var(--crimson-700);
    --surface-app: var(--bg); --surface-panel: var(--panel); --surface-section: var(--tint);
    --surface-card: var(--white); --surface-inset: var(--tint);
    --surface-selected: var(--crimson-50); --surface-hover: var(--navy-100);
    --line-panel: var(--border); --line-inner: var(--border2); --line-control: var(--navy-200);
    --line-focus: var(--crimson-600); --line-danger: var(--crimson-200);
    --accent: var(--crimson-600); --accent-hover: var(--crimson-700);
    --accent-wash: var(--crimson-50); --accent-line: var(--crimson-200);
    --status-error: var(--crimson-700); --status-error-bg: var(--crimson-50); --status-error-line: var(--crimson-200);
    --status-advice: var(--amber); --status-advice-bg: var(--amber-50);
    --status-ok: var(--green); --status-ok-bg: var(--green-50); --status-ok-line: var(--green-200);
    --status-ok-fg: var(--green-700);
    /* Severity escalates by weight, not hue — only the top band takes a solid fill.
       THREE bands, not the design system's four: an organisation's risk policy is
       written against three, and a fourth level only ever meant "high, but really".
       See keel/schemas/report.py, which is the scale these mirror. Low is navy, never
       green: green means covered/closed, a different axis — a low finding is still open. */
    --sev-high-bg: var(--crimson-700); --sev-high-fg: #ffffff;
    --sev-high-line: var(--crimson-700); --sev-high-spine: var(--crimson-700);
    --sev-medium-bg: var(--amber-50); --sev-medium-fg: var(--amber-700);
    --sev-medium-line: #f0dcb0; --sev-medium-spine: var(--amber);
    --sev-low-bg: var(--navy-100); --sev-low-fg: var(--navy-600);
    --sev-low-line: var(--border); --sev-low-spine: var(--navy-400);
    /* classification is neutral — harm/surface/source are facts about a finding, not grades of it */
    --classify-bg: var(--navy-200); --classify-fg: var(--navy-700);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--navy-900);
    font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: var(--rail-w) 1fr var(--preview-w);
    grid-template-rows: var(--topbar-h) 1fr; height: 100vh;
  }
  body.resizing { cursor: col-resize; user-select: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ------ top bar ------ */
  /* Primary navigation belongs to the app, not to the 320px rail. Five text tabs
     stretched across the rail read as a cramped segmented control, and they pushed the
     rail's own title, count and ＋New into a second squeezed row directly beneath.
     Up here the tabs sit at their natural width and the rail serves only its list. */
  .topbar { grid-column: 1 / -1; display: flex; align-items: stretch;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .topbar .brand { display: flex; align-items: center; padding: 0 20px;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--navy-900); }

  /* ------ left rail ------ */
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  header {
    padding: 10px 15px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  /* The tab above already names the screen; this names the LIST — "Systems" under the
     Reports tab, "Fields" under Style guide — so it is an eyebrow, not a second title. */
  header h1 { font-size: 10px; margin: 0; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--navy-500); }
  header .count { color: var(--navy-500); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .rail-toggle { border: none; background: none; color: var(--navy-500); font-size: 15px; line-height: 1; padding: 3px 6px; border-radius: 6px; flex-shrink: 0; }
  .rail-toggle:hover { background: var(--navy-100); color: var(--navy-800); }
  /* Collapsed left rail — a thin strip that keeps only the expand affordance. */
  body.rail-collapsed { --rail-w: 44px; }
  body.rail-collapsed .search,
  body.rail-collapsed .facets,
  body.rail-collapsed .list,
  body.rail-collapsed header h1,
  body.rail-collapsed header .count,
  body.rail-collapsed #newThreatBtn { display: none; }
  body.rail-collapsed header { padding: 12px 0; justify-content: center; }
  .search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 9px 11px; background: var(--tint); color: var(--navy-900);
    border: 1px solid var(--border); border-radius: 9px; outline: none; font-size: 13px;
  }
  .search input:focus { border-color: var(--line-focus); background: var(--surface-card); }
  /* ------ faceted filter panel (Threats + Mitigations rails) ------ */
  /* A collapsed "Filters (N)" expander under the search; open it for grouped,
     multi-select chip facets. Fits a ~320px rail — chips wrap, panel scrolls if tall. */
  .facets { border-bottom: 1px solid var(--border); }
  .facets-bar { display: flex; align-items: center; gap: 7px; padding: 8px 14px; cursor: pointer; user-select: none; }
  .facets-bar:hover { background: var(--navy-100); }
  .fx-caret { color: var(--navy-500); font-size: 10px; width: 10px; flex-shrink: 0; }
  .fx-label { font-size: 12px; font-weight: 600; color: var(--navy-700); }
  .fx-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px;
    background: var(--accent); color: var(--text-inverse); font-variant-numeric: var(--numeric); }
  .fx-clear { margin-left: auto; border: none; background: none; color: var(--navy-500);
    font-size: 11px; font-weight: 600; padding: 2px 4px; border-radius: 6px; }
  .fx-clear:hover { color: var(--crimson-700); text-decoration: underline; }
  .facets-body { display: none; padding: 2px 14px 10px; max-height: 46vh; overflow-y: auto; }
  .facets.open .facets-body { display: block; }
  .fx-group { margin-top: 9px; }
  .fx-group:first-child { margin-top: 4px; }
  .fx-gk { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy-500);
    font-weight: 700; margin: 0 0 5px; }
  .fx-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .fx-chip { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--tint);
    color: var(--navy-600); border: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
  .fx-chip:hover { border-color: var(--crimson-200); color: var(--crimson-700); }
  .fx-chip.on { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
  .fx-chip.on:hover { background: var(--accent-hover); color: var(--text-inverse); }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  /* Scannable rows: title is the primary line, id a readable mono secondary. */
  .row { padding: 10px 15px; border-bottom: 1px solid var(--border2); display: flex; flex-direction: column; gap: 2px; }
  .row:hover { background: var(--navy-100); }
  .row.active { background: var(--surface-selected); box-shadow: var(--selected-rail-accent); }
  .row.active:hover { background: var(--crimson-50); }
  .row .rid { font-size: 11px; color: var(--navy-500); font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: .01em; }
  .row .rtitle { font-size: 14px; color: var(--navy-900); font-weight: 500; line-height: 1.35; }

  /* ------ badges ------ */
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  /* 11px, not 10 — a badge carries a real word (a harm class, a link strength) that a
     reader has to take in, and at 10px those were the smallest type on a laptop screen. */
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .badge.soft { background: var(--navy-100); color: var(--navy-600); font-weight: 500; border-radius: 10px; }
  .badge.type { background: var(--navy-200); color: var(--navy-700); }
  /* Classification is neutral. harm/surface/source/mitigation_class are facts ABOUT an
     entry, not grades OF it — a crimson fill here made every rail row shout and left
     nothing louder for the accent to mean. */
  .badge.harm { background: var(--classify-bg); color: var(--classify-fg); }
  .badge.tag { background: var(--status-ok-bg); color: var(--status-ok-fg); }
  .badge.shared { background: var(--status-ok-bg); color: var(--status-ok-fg); margin-left: 6px; }

  /* ------ center editor ------ */
  main { overflow-y: auto; padding: 30px 40px; min-width: 0; }
  .empty { color: var(--navy-500); margin-top: 22vh; text-align: center; }
  .detail { max-width: none; }

  /* ------ editor section tiers (fieldset/legend) ------ */
  /* SECTION = fieldset + legend. The top-level edit sections wear the SAME surface as
     the read view's .readsec (tint fill, hairline border, radius, padding, spacing) so
     toggling Edit ↔ read keeps the block framing and the eye doesn't lose its place. */
  .detail fieldset {
    background: var(--tint); border: 1px solid var(--border2); border-radius: 10px;
    padding: 12px 14px; margin: 14px 0 0; min-width: 0;
  }
  /* The legend is the same tier as the read view's section header — see h3.slabel. */
  .detail fieldset > legend.slabel { display: block; width: 100%; float: none; padding: 0; }
  .ecard .field + .field { margin-top: var(--field-gap); }
  input.f, select.f { min-height: var(--input-h); }
  .dhead { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 20px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  /* Navy, not the accent. Every entity header carries one of these; in crimson there was
     a solid accent block on every single screen, which is the one fill the severity ramp
     needs to keep for its top band. The Overview already overrode it to navy inline. */
  .dicon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; color: var(--text-inverse); flex-shrink: 0; font-size: 18px;
    font-weight: 700; background: var(--navy-700); }
  .dhead .dtitle { flex: 1; min-width: 0; }
  .dhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .dhead .did { font-family: ui-monospace, monospace; color: var(--navy-500); font-size: 12px; margin-top: 4px; }
  /* .did is for an identifier. A screen whose subtitle is a sentence uses this instead —
     a wrapped sentence set in the mono face reads as code the reader has to decode. */
  .dhead .dsub { color: var(--navy-500); font-size: 13px; margin-top: 5px; line-height: 1.5; max-width: var(--measure); }
  .dhead .hbadges { margin-top: 8px; }
  .hactions { display: flex; gap: 8px; flex-shrink: 0; }
  section { margin-top: 28px; }

  /* ------ heading tiers ------
     20 / 700   entity title (.dhead h2)
     15 / 600   SECTION heading — h3.slabel and the editor's fieldset legend
     14 / 500-600  card and row titles
     14 / 400   body prose
     12 / 400   meta, hints, counts
     10 / 700   eyebrow, uppercase

     The section heading used to BE the eyebrow: 11px uppercase under 14px prose, so
     every heading sat a step below the text it introduced and the page had no
     hierarchy to read by. The eyebrow is now reserved for labels that name a single
     field or group — facet keys, sub-labels inside a repeatable card, the rail list. */
  h3.slabel, .detail fieldset > legend.slabel {
    font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: -.01em;
    color: var(--navy-900); margin: 0 0 10px;
  }
  .slabel .sub { font-size: 13px; font-weight: 400; text-transform: none;
    color: var(--navy-500); letter-spacing: 0; }
  /* Inside a repeatable card a label names one field, not a section — eyebrow tier. */
  .ecard h3.slabel, .ecard .field > .slabel, .ecard .field > legend.slabel {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-500); margin: 0 0 5px; border: 0; padding: 0;
  }
  .prose { white-space: pre-wrap; color: var(--navy-700); font-size: 14px; line-height: 1.65; max-width: var(--measure); }
  .warn { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  .placeholder { color: var(--navy-500); font-style: italic; }
  .card { border: 1px solid var(--line-panel); border-radius: var(--r-10); padding: var(--pad-card); margin-bottom: 10px; background: var(--surface-card); }
  .card .chead { display: flex; align-items: center; gap: 8px; }
  .card .cid { font-family: ui-monospace, monospace; font-size: 11px; color: var(--navy-500); }
  .card .ctitle { font-weight: 600; color: var(--navy-900); font-size: 14px; }
  .card .rationale { margin-top: 8px; color: var(--navy-500); font-size: 13px; font-style: italic;
    white-space: pre-wrap; line-height: 1.6; max-width: var(--measure); }
  /* A card's body copy is body copy — it was 13px, half a step under the surrounding
     prose for no reason, which is most of why the screens read as inconsistent. */
  .card .cdesc { margin-top: 8px; color: var(--navy-700); font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; max-width: var(--measure); }
  ul.plain { margin: 6px 0 0; padding-left: 0; list-style: none; }
  ul.plain li { border-left: 2px solid var(--navy-200); padding: 3px 0 3px 10px; margin-bottom: 7px; color: var(--navy-700); }
  ul.plain li .meta { font-size: 11px; color: var(--navy-500); text-transform: uppercase; letter-spacing: .05em; }

  /* ------ read view (per-section surfaces, breadcrumb, omit-empty) ------ */
  /* A read/document view, so each populated section sits on its own subtle surface,
     unlike the edit form (whose only heavy container is the repeatable-card border). */
  .readsec { background: var(--tint); border: 1px solid var(--border2); border-radius: 10px; padding: 16px 18px; margin-top: 16px; }
  .readsec > h3.slabel { margin: 0 0 10px; }
  .readsec .prose { color: var(--navy-800); }
  .readsec .card { background: var(--surface-card); }
  .notauthored { color: var(--navy-500); font-size: 12px; font-style: italic; margin: 16px 0 0; }
  /* ------ gaps bar (read view) — empty fields as clickable, jump-to-edit chips ------ */
  .gaps-bar { margin-top: var(--section-gap); border-top: 1px dashed var(--border); padding-top: 14px; }
  .gaps-k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--navy-500); font-weight: 700; margin: 0 0 9px; }
  .gaps-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .gap-chip { font-size: 12px; padding: 4px 11px; border-radius: 20px; background: var(--navy-100);
    color: var(--navy-600); border: 1px solid var(--border); font-weight: 500; }
  .gap-chip:hover { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy-500); margin-bottom: 12px; }
  .crumb-type { border: none; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--navy-500); }
  .crumb-type:hover { color: var(--crimson-600); text-decoration: underline; }
  .crumb-sep { color: var(--navy-500); }
  .crumb-id { font-family: ui-monospace, "SFMono-Regular", monospace; color: var(--navy-500); }
  /* A card that jumps to a linked entity on click. */
  .card.jrow { cursor: pointer; transition: background .12s, border-color .12s; }
  .card.jrow:hover { background: var(--crimson-50); border-color: var(--crimson-200); }

  /* ------ read-view Git history (read-only) ------ */
  /* A quiet provenance line under the breadcrumb, plus a collapsed History .readsec
     at the foot of the read view: commit rows that expand an inline diff (accordion). */
  .last-changed { font-size: 12px; color: var(--navy-500); margin: -4px 0 12px; }
  .history-sec .history-head { display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; user-select: none; }
  .history-sec .history-head:hover { color: var(--crimson-700); }
  .history-sec .history-head .fx-caret { color: var(--navy-500); font-size: 10px; width: 10px; flex-shrink: 0; }
  .history-list { margin-top: 2px; }
  /* commit list — GitHub-style: message is the primary line, a muted submeta row below */
  .commit { border-top: 1px solid var(--border2); }
  .commit:first-child { border-top: none; }
  .commit-row { padding: 9px 8px; border-radius: 6px; cursor: pointer; }
  .commit-row:hover { background: var(--navy-100); }
  .commit.open > .commit-row { background: var(--navy-100); }
  .commit-msg { font-size: 13px; color: var(--navy-900); font-weight: 500; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit-meta { font-size: 11px; color: var(--navy-500); margin-top: 3px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .commit-meta .sep { color: var(--navy-200); }
  .commit-sha { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 10px;
    background: var(--navy-100); color: var(--navy-600); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; letter-spacing: .01em; }
  .commit-diff { margin: 4px 2px 10px; }

  /* ------ unified Git diff (native GitHub look: line-number gutters + full-row tints) ------ */
  /* Parsed from the unified-diff text into rows: two gutters (old #, new #) driven by the
     @@ hunk headers, a content cell that keeps the +/-/space sign and preserves whitespace,
     and a horizontally-scrolling body for long lines. File-header noise is folded into one
     tiny caption; hunk headers render as a muted separator row that resets the counters. */
  .diffwrap { border: 1px solid var(--line-panel); border-radius: var(--r-8); overflow: hidden; background: var(--surface-card); }
  .diff-cap { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 11px; color: var(--navy-500);
    padding: 6px 12px; background: var(--tint); border-bottom: 1px solid var(--border2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diff-scroll { overflow-x: auto; }
  .difftbl { border-collapse: collapse; width: 100%; font-family: ui-monospace, "SFMono-Regular", monospace;
    font-size: 12px; line-height: 1.5; }
  .difftbl td { padding: 0; vertical-align: top; }
  .difftbl .dg { width: 1%; min-width: 42px; text-align: right; padding: 0 10px;
    color: var(--navy-500); background: var(--tint); border-right: 1px solid var(--border2);
    user-select: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .difftbl .dc { padding: 0 10px; white-space: pre; color: var(--navy-800); }
  .dr-ctx .dc { color: var(--navy-700); }
  /* additions — light green row, greener gutter, green left accent */
  .dr-add { background: var(--diff-add-bg); }
  .dr-add .dg { background: var(--diff-add-gutter); color: var(--diff-add-gutter-fg); }
  .dr-add .dg-o { border-left: 2px solid var(--status-ok); }
  .dr-add .dc { color: var(--diff-add-fg); }
  /* deletions — light red row, redder gutter, crimson left accent */
  .dr-del { background: var(--diff-del-bg); }
  .dr-del .dg { background: var(--diff-del-gutter); color: var(--diff-del-gutter-fg); }
  .dr-del .dg-o { border-left: 2px solid var(--accent); }
  .dr-del .dc { color: var(--diff-del-fg); }
  /* hunk header — a muted separator row spanning the width, resets the counters */
  .dr-hunk td { background: var(--diff-hunk-bg); }
  .dr-hunk .dg { color: var(--navy-500); border-right-color: var(--border); }
  .dr-hunk .dc { color: var(--navy-500); }
  .dr-meta .dc { color: var(--navy-500); }
  .diff-loading { padding: 10px 12px; background: var(--surface-card); border: 1px solid var(--line-panel);
    border-radius: 8px; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 12px;
    color: var(--navy-500); font-style: italic; }

  /* ------ buttons ------ */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid transparent; background: none; }
  .btn.primary { background: var(--accent); color: var(--text-inverse); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled { opacity: .5; }
  .btn.ghost { background: var(--surface-hover); color: var(--text-body); }
  .btn.ghost:hover { background: var(--navy-200); }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  /* ------ inputs ------ */
  input.f, textarea.f, select.f {
    width: 100%; border: 1px solid var(--navy-200); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: var(--fs-14); color: var(--text-strong); background: var(--surface-card); outline: none;
  }
  input.f:focus, textarea.f:focus, select.f:focus { border-color: var(--line-focus); box-shadow: var(--focus-ring); }
  textarea.f { resize: vertical; line-height: 1.55; }
  .titlein { font-size: 19px; font-weight: 700; }
  .checkset { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkset label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border: 1px solid var(--line-control); border-radius: var(--r-8); font-size: var(--fs-13); cursor: pointer; background: var(--surface-card);
  }
  .checkset label:hover { border-color: var(--crimson-200); }
  .checkset input { accent-color: var(--crimson-600); }
  .hint { color: var(--navy-500); font-size: 12px; margin-top: 4px; }

  /* ------ repeatable editor cards (weaknesses, mitigation links) ------ */
  /* The card border is the ONLY heavy container: surface fill + border + radius + padding. */
  .ecard { position: relative; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--tint); }
  .ecard-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; }
  .ecard.collapsed .ecard-head { padding: 9px 12px; }
  .ecard-body { padding: 2px 14px 14px; }
  .ecard-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--navy-700); font-weight: 600; font-family: ui-monospace, "SFMono-Regular", monospace; }
  .card-toggle { border: none; background: none; color: var(--navy-500); font-size: 11px; line-height: 1; padding: 2px 3px; }
  .card-toggle:hover { color: var(--navy-800); }
  .ecard .field + .field { margin-top: var(--field-gap); }
  .cardx { border: none; background: none; color: var(--navy-500); font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .cardx:hover { background: var(--crimson-50); color: var(--crimson-600); }
  .link-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .link-row select { flex: 1; }

  /* ------ inline style-guide bar ------ */
  .field { position: relative; }
  /* one muted ~12px single-line hint under each label; row height reserved so fields align */
  .sg-hint { color: var(--navy-500); font-size: 12px; line-height: 1.4; margin: 0 0 6px; min-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-panel { display: none; margin-top: 8px; padding: 10px 12px; background: var(--surface-card); border: 1px solid var(--line-control); border-radius: var(--r-8); font-size: var(--fs-12); }
  .sg-panel.show { display: block; }
  .sg-sec { margin-bottom: 8px; }
  .sg-sec:last-child { margin-bottom: 0; }
  .sg-k { display: block; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10px; color: var(--navy-600); margin-bottom: 3px; }
  .sg-panel ul { margin: 0; padding-left: 16px; color: var(--navy-600); }
  .sg-panel ul li { margin-bottom: 2px; }
  .sg-ex { color: var(--navy-700); font-style: italic; margin: 0 0 5px; }
  /* inline per-field guidance — a compact <details> that replaces the old rail mode */
  .fguide { margin-top: 8px; }
  .fguide > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--navy-500); user-select: none; padding: 2px 0; }
  .fguide > summary::-webkit-details-marker { display: none; }
  .fguide > summary::before { content: "\24D8"; color: var(--navy-500); font-size: 13px; }
  .fguide[open] > summary { color: var(--navy-700); }
  .fguide > summary:hover { color: var(--crimson-600); }
  .fguide .sg-panel { display: block; margin-top: 6px; }
  /* "view change" affordance on the read-view provenance line — reveals the latest diff inline */
  .lc-diff { border: none; background: none; color: var(--crimson-600); font-weight: 600; font-size: 12px;
    padding: 0 0 0 4px; cursor: pointer; }
  .lc-diff:hover { text-decoration: underline; }

  /* ------ right preview ------ */
  #preview { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; }
  /* The right rail earns its column only on the Style-guide screen (the live author
     preview — a genuinely different artifact). Everywhere else it collapses: the third
     grid track goes to 0 and the rail + its resizer hide. Threats and mitigations read
     and edit on one surface, so there is no rail to duplicate the card. The user's saved
     --preview-w is kept on <html> and restored when the Style screen brings the rail back. */
  body.no-preview { --preview-w: 0px; }
  body.no-preview #preview, body.no-preview #preview-resizer { display: none; }
  /* draggable divider on the main|preview border; sits fixed over the seam */
  /* Starts below the top bar so the seam handle never overlays the tabs. */
  #preview-resizer { position: fixed; top: var(--topbar-h); height: calc(100vh - var(--topbar-h));
    width: 9px; right: var(--preview-w); margin-right: -4px; cursor: col-resize; z-index: 40; }
  #preview-resizer::after { content: ""; position: absolute; top: 0; left: 4px; width: 1px; height: 100%; background: transparent; transition: background .12s; }
  #preview-resizer:hover::after, body.resizing #preview-resizer::after { background: var(--crimson-600); left: 3px; width: 3px; }
  #preview .ptitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--navy-500); font-weight: 700; margin: 0 0 12px; }

  /* ------ toast ------ */
  .toast { position: fixed; bottom: 20px; right: 22px; background: var(--navy-900); color: var(--text-inverse); padding: 10px 16px; border-radius: var(--r-10); font-size: var(--fs-13); box-shadow: var(--shadow-toast); opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(8px); pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--crimson-700); }

  /* ------ validation channels ------ */
  .err-summary { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 10px 14px; margin: 16px 0 4px; font-size: 13px; }
  .err-summary strong { display: block; margin-bottom: 5px; }
  .err-summary ul { margin: 0; padding-left: 18px; }
  .err-summary code { font-family: ui-monospace, monospace; font-size: 12px; }
  .fld-msg { font-size: 12px; margin-top: 5px; line-height: 1.4; }
  .fld-msg.err { color: var(--crimson-700); }
  /* --amber on a light surface fails contrast; --amber-700 is the text-only step.
     Amber stays a fill only on dots and bar segments, never on type. */
  .fld-msg.adv { color: var(--amber-700); }
  .field .slabel, .dtitle .did { position: relative; }
  .field.has-err > .slabel::after, .field.has-adv > .slabel::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .field.has-err > .slabel::after { background: var(--crimson-600); }
  .field.has-adv > .slabel::after { background: var(--amber); }
  /* The title/name field has no .slabel — hang its dot off the .did line instead. */
  .dtitle.field.has-err .did::after, .dtitle.field.has-adv .did::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .dtitle.field.has-err .did::after { background: var(--crimson-600); }
  .dtitle.field.has-adv .did::after { background: var(--amber); }
  /* A collapsed repeatable card hiding an errored field still shows an error marker. */
  .ecard.collapsed.has-err { border-color: var(--crimson-200); }
  .ecard.collapsed.has-err .ecard-sum::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--crimson-600); margin-left: 8px; vertical-align: middle;
  }

  /* ------ saved dialog ------ */
  .saved-dialog { position: fixed; bottom: 20px; right: 22px; max-width: 340px; background: var(--surface-card); border: 1px solid var(--line-panel); border-left: 4px solid var(--status-ok); color: var(--text-body-read); padding: 13px 16px; border-radius: var(--r-10); font-size: var(--fs-13); box-shadow: var(--shadow-dialog); z-index: 60; display: none; }
  .saved-dialog.show { display: block; }
  .saved-dialog code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--navy-900); }
  .saved-dialog .sd-actions { margin-top: 10px; display: flex; gap: 12px; align-items: center; }
  .saved-dialog a { color: var(--crimson-600); font-weight: 600; text-decoration: none; }
  .saved-dialog a:hover { text-decoration: underline; }
  .saved-dialog .sd-close { margin-left: auto; border: none; background: none; color: var(--navy-500); font-size: 12px; }

  /* ------ screen switcher (lives in the top bar) ------ */
  .screens { display: flex; }
  .screens button { border: none; background: none; color: var(--navy-500); font-size: 13px;
    font-weight: 600; padding: 0 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .screens button:hover { color: var(--navy-800); }
  .screens button.on { color: var(--navy-900); border-bottom-color: var(--crimson-600); }

  /* ------ style-guide field tree ------ */
  .sg-group { padding: 9px 15px 5px; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--navy-500); font-weight: 700; background: var(--tint); border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
  .sg-frow { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  .sg-frow .fname { font-size: 13px; color: var(--navy-800); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .badge.cov { font-variant-numeric: tabular-nums; }
  .badge.cov.c-hi { background: var(--status-ok-bg); color: var(--status-ok-fg); }
  .badge.cov.c-mid { background: var(--status-advice-bg); color: var(--amber-700); }
  .badge.cov.c-lo { background: var(--status-error-bg); color: var(--status-error); }
  .badge.orphan { background: var(--navy-200); color: var(--navy-600); }

  /* ------ style-guide bar editor ------ */
  .slot-list { list-style: none; margin: 6px 0 0; padding: 0; }
  .slot-list li { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .slot-list li input { flex: 1; }
  .slotcount { color: var(--navy-500); font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  #preview .sg-fieldwrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px; background: var(--tint); }
  #preview .sg-fieldwrap .f { background: var(--surface-card); }

  /* ------ overview screen ------ */
  .ov-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .ov-stat { flex: 1; min-width: 120px; border: 1px solid var(--line-panel); border-radius: var(--r-10); padding: 14px 16px; background: var(--surface-card); }
  .ov-stat .num { font-size: 28px; font-weight: 700; color: var(--navy-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ov-stat .lbl { font-size: 13px; color: var(--navy-500); margin-top: 4px; }
  .ov-cov-overall { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .ov-cov-overall .pct { font-size: 24px; font-weight: 700; color: var(--navy-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ov-cov-overall .lbl { font-size: 12px; color: var(--navy-500); }
  .ov-cov-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border2); }
  .ov-cov-row:last-child { border-bottom: none; }
  .ov-cov-row .ent { font-size: 14px; color: var(--navy-700); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .ov-gap-group { margin-bottom: 10px; }
  .ov-gap-head { display: flex; align-items: center; gap: 8px; }
  .ov-gap-head .gname { font-weight: 600; color: var(--navy-900); font-size: 14px; }
  .ov-gap-desc { color: var(--navy-600); font-size: 13px; line-height: 1.55; margin: 5px 0 10px; max-width: var(--measure); }
  .ov-chips { display: flex; flex-wrap: wrap; align-items: center; }
  /* A warning that names no entity (a whole-catalog observation) has nothing to put in
     a chip. It used to render an empty chip row under a bare label and a count, which
     is why "Unused vocabulary 1" said nothing at all. Show the message instead. */
  .ov-warn-msg { color: var(--navy-700); font-size: 14px; line-height: 1.55; margin: 5px 0 0; max-width: var(--measure); }
  /* Long id lists get cut to a readable run; the rest is one click away. */
  .ov-more { border: none; background: none; color: var(--crimson-600); font-size: 12px;
    font-weight: 600; padding: 3px 6px; margin: 0 0 6px; border-radius: 6px; }
  .ov-more:hover { background: var(--crimson-50); }
  /* `display: contents` so the parked chips rejoin the same wrapping flex row. */
  .ov-rest { display: contents; }
  .ov-rest.hide { display: none; }
  .ov-chip { display: inline-flex; align-items: center; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 12px;
    padding: 3px 9px; border-radius: 6px; background: var(--navy-100); color: var(--navy-700); border: 1px solid var(--border);
    cursor: pointer; margin: 0 6px 6px 0; }
  .ov-chip:hover { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); }
  .ov-chip.on { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); font-weight: 600; }
  .ov-clean { display: flex; align-items: flex-start; gap: 10px; background: var(--status-ok-bg); border: 1px solid var(--status-ok-line);
    color: var(--status-ok-fg); border-radius: 10px; padding: 14px 16px; }
  /* Status is a CSS dot, not a glyph — Keel has no icon set and says the word instead. */
  .ov-clean .ok-i { width: 8px; height: 8px; border-radius: var(--r-round); background: var(--status-ok);
    flex-shrink: 0; margin-top: 6px; }
  .ov-clean p { margin: 0; color: var(--navy-700); font-size: 14px; line-height: 1.55; max-width: var(--measure); }
  .ov-clean p b { color: var(--status-ok-fg); }
  .ov-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .ov-grid2 > div > .readsec:first-child { margin-top: 0; }
  @media (max-width: 900px) { .ov-grid2 { grid-template-columns: 1fr; } }
  .ov-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--navy-100); margin: 8px 0 6px; }
  .ov-bar-seg { height: 100%; }
  .ov-bar-seg.verified, .ov-bar-seg.shared { background: var(--green); }
  .ov-bar-seg.draft, .ov-bar-seg.local { background: var(--amber); }
  .ov-bar-seg.unset, .ov-bar-seg.none { background: var(--navy-200); }
  .ov-bar-legend { display: flex; gap: 16px; font-size: 13px; color: var(--navy-500); flex-wrap: wrap; }
  .ov-bar-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .ov-activity-row { padding: 11px 0; border-bottom: 1px solid var(--border2); font-size: 14px; }
  .ov-activity-row:last-child { border-bottom: none; }
  .ov-activity-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ov-activity-msg { color: var(--navy-900); font-weight: 500; }
  .ov-activity-meta { color: var(--navy-500); font-size: 12px; }
  .ov-activity-row .ov-chips { margin-top: 7px; }

  /* ------ reports screen ------ */
  /* Severity escalates by WEIGHT, not hue, and only the top band takes a solid fill — if
     the Edit button is as loud as the worst finding, nothing reads as worst. The 4px spine
     carries the ranking so the list is legible before a word is read. Low is navy, never
     green: green means covered/closed, a different axis — a low finding is still open. */
  .finding { border-left: 4px solid var(--sev-low-spine); padding: 15px 17px; }
  .finding.sev-high { border-left-color: var(--sev-high-spine); }
  .finding.sev-medium { border-left-color: var(--sev-medium-spine); }
  .finding.sev-low { border-left-color: var(--sev-low-spine); }
  .finding .chead { flex-wrap: wrap; }
  .grades { margin-left: auto; display: flex; gap: 6px; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-11);
    padding: 2px 9px; border-radius: var(--r-4); white-space: nowrap; border: 1px solid transparent; }
  .sev .p { opacity: .7; font-weight: var(--fw-medium); }
  .sev.sev-high { background: var(--sev-high-bg); color: var(--sev-high-fg);
    border-color: var(--sev-high-line); font-weight: var(--fw-bold); }
  .sev.sev-medium { background: var(--sev-medium-bg); color: var(--sev-medium-fg);
    border-color: var(--sev-medium-line); font-weight: var(--fw-semibold); }
  .sev.sev-low { background: var(--sev-low-bg); color: var(--sev-low-fg);
    border-color: var(--sev-low-line); font-weight: var(--fw-medium); }
  /* Severity owns the solid fill; likelihood is graded on the same three bands but drawn
     as an outline. Otherwise a single card shows two solid crimson blocks side by side
     and neither of them reads as the thing to look at. */
  .sev.quiet.sev-high { background: var(--crimson-50); color: var(--crimson-700);
    border-color: var(--crimson-200); font-weight: var(--fw-semibold); }
  .fscenario { margin: 10px 0 0; font-size: 14px; line-height: 1.65; color: var(--navy-800); max-width: var(--measure); }
  /* Why the grade is what it is. This is the first question a reader asks of a graded
     finding, so it sits directly under the scenario on its own surface — it used to be
     12px muted type at the foot of the card, below the requirements it justifies. */
  .fwhy { margin-top: 12px; padding: 10px 12px; background: var(--tint); border: 1px solid var(--border2);
    border-radius: var(--r-8); font-size: 13px; line-height: 1.6; color: var(--navy-700); max-width: var(--measure); }
  .fwhy .k, .freqs-k { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--navy-600); margin-bottom: 5px; }
  /* The chain the grade rests on: asset, weakness, attacker, what moved since last time.
     Facts that need naming to be understood get a label here; the ones that read on their
     own (harm, surface, exploitation cost) stay unlabelled badges below. */
  .fchain { display: grid; grid-template-columns: 116px 1fr; gap: 8px 14px; margin: 13px 0 0; }
  .fchain dt { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); padding-top: 3px; }
  .fchain dd { margin: 0; font-size: 14px; line-height: 1.55; color: var(--navy-700); max-width: var(--measure); }
  .finding .badges { margin-top: 13px; }
  .freqs { margin-top: 15px; border-top: 1px solid var(--border2); padding-top: 12px; }
  /* Requirement rows: checkbox and text on one line. A dedicated class, not .cdesc,
     because that carries white-space: pre-wrap and would keep the template's newlines. */
  .req-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--navy-700); }
  .req-row input { margin: 4px 0 0; flex-shrink: 0; accent-color: var(--crimson-600); }
  .req-row label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; line-height: 1.5; }
  .req-meta { display: block; font-family: ui-monospace, "SFMono-Regular", monospace;
    font-size: 11px; color: var(--navy-500); margin-top: 2px; }
  .req-note { margin: 4px 0 0 24px; color: var(--navy-500); font-size: 13px; font-style: italic;
    line-height: 1.55; max-width: var(--measure); }
  .req-ignored { margin-top: 9px; color: var(--navy-500); font-size: 13px; font-style: italic;
    line-height: 1.55; max-width: var(--measure); }
  .rep-qa { margin-top: 6px; font-size: 14px; line-height: 1.6; color: var(--navy-700); max-width: var(--measure); }
  .rep-qa .meta { display: inline-block; min-width: 18px; font-weight: 700; color: var(--navy-500); }
  /* Anything that names an entity in the model is a way into it. */
  .reflink { border: none; background: none; padding: 0; font: inherit; font-weight: inherit;
    color: var(--text-link); cursor: pointer; text-align: left; }
  .reflink:hover { color: var(--text-link-hover); text-decoration: underline; }

  /* ------ report: a draft is edited where it is read ------ */
  /* No Edit button and no mode switch. The read view IS the document being checked, so
     a separate form would mean checking one thing and correcting another. Controls wear
     the surrounding type and only show a box on hover or focus; every change saves. */
  .rep-status { font-size: 11px; padding: 2px 9px; border-radius: var(--r-4); font-weight: 700;
    text-transform: lowercase; }
  .rep-status.draft { background: var(--amber-50); color: var(--amber-700); }
  .rep-status.final { background: var(--navy-200); color: var(--navy-700); }
  .savestate { font-size: 12px; color: var(--navy-500); white-space: nowrap; align-self: center; }
  .savestate.ok { color: var(--status-ok-fg); }
  .savestate.err { color: var(--status-error); }
  .ie { display: block; width: 100%; max-width: var(--measure); font: inherit; color: inherit;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-6);
    padding: 4px 7px; margin: -4px -7px; resize: none; overflow: hidden; outline: none; }
  .ie:hover { border-color: var(--line-control); background: var(--surface-card); }
  .ie:focus { border-color: var(--line-focus); background: var(--surface-card); box-shadow: var(--focus-ring); }
  /* A grade stays a badge and becomes a picker — the thing you disagree with is the
     thing you click, with no hunt for the field that controls it. */
  .sev select.ie-grade { appearance: none; -webkit-appearance: none; background: transparent;
    border: none; color: inherit; font: inherit; font-weight: inherit; padding: 0; margin: 0;
    cursor: pointer; outline: none; }
  .sev select.ie-grade:focus { text-decoration: underline; }
  .fchain select.ie, .badges select.ie { display: inline-block; width: auto; max-width: none; }
  .finding .fdrop { margin-left: 4px; border: none; background: none; color: var(--navy-500);
    font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: var(--r-6); }
  .finding .fdrop:hover { background: var(--crimson-50); color: var(--accent); }
  .rep-empty { color: var(--navy-500); font-style: italic; }

  /* Ruled out and the assessor dialogue are how WE debug the assessment run, not the
     specialist's job — a discarded candidate is rare and the Q&A is a trace. They sit
     at the foot, side by side, folded shut. */
  .rep-aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 1100px) { .rep-aside { grid-template-columns: 1fr; } }
  .rep-aside > .readsec { margin-top: 0; }
  .fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "\25B8"; color: var(--navy-500); font-size: 10px; width: 9px; flex-shrink: 0; }
  .fold[open] > summary::before { content: "\25BE"; }
  .fold > summary:hover h3 { color: var(--accent-hover); }
  .fold > summary h3 { margin: 0; }
  .fold-body { margin-top: 12px; }

  /* ------ report export rail ------ */
  /* Options run most-useful-first for the reader receiving this: the asks, then the
     evidence for them, then the framing. A sub-option greys out with its parent. */
  .exp-group { margin-bottom: 16px; }
  .exp-k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); margin: 0 0 7px; }
  .exp-opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--navy-700);
    padding: 3px 0; cursor: pointer; }
  .exp-opt input { accent-color: var(--crimson-600); flex-shrink: 0; }
  .exp-opt.sub { margin-left: 20px; font-size: 12px; color: var(--navy-600); }
  .exp-opt.off { opacity: .45; cursor: default; }
  .exp-actions { display: flex; gap: 8px; margin: 4px 0 12px; }
  .exp-preview { border: 1px solid var(--line-panel); border-radius: var(--r-8); background: var(--surface-card);
    font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 11px; line-height: 1.6;
    color: var(--navy-700); white-space: pre-wrap; padding: 11px 13px; overflow-x: auto; }
  .exp-note { font-size: 12px; color: var(--navy-500); margin: 0 0 10px; line-height: 1.5; }
  .ov-rail-legend { padding: 16px 15px; color: var(--navy-500); font-size: 13px; line-height: 1.6; }
  .ov-legend .ov-leg-k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy-500); font-weight: 700; margin: 0 0 6px; }
  .ov-legend p { color: var(--navy-600); font-size: 13px; margin: 0 0 6px; line-height: 1.65; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Keel</span>
  <nav class="screens" id="screens">
    <button data-screen="overview" class="on">Overview</button>
    <button data-screen="threats">Threats</button>
    <button data-screen="mitigations">Mitigations</button>
    <button data-screen="style">Style guide</button>
    <button data-screen="reports">Reports</button>
  </nav>
</div>
<aside>
  <header>
    <button class="rail-toggle" id="railToggle" title="Collapse">«</button>
    <h1 id="railTitle">Threats</h1>
    <span class="count" id="count"></span>
    <button class="btn sm ghost" id="newThreatBtn" title="Create a new threat">＋ New</button>
  </header>
  <div class="search" id="searchWrap"><input id="search" type="search" placeholder="Filter threats…" autocomplete="off"></div>
  <div class="facets" id="facetPanel" style="display:none"></div>
  <div class="list" id="list"></div>
</aside>

<main id="main"><div class="empty">Select a threat from the list.</div></main>

<section id="preview"><p class="ptitle">Preview</p><div class="empty" style="margin-top:10vh">—</div></section>
<div id="preview-resizer" title="Drag to resize"></div>

<div class="toast" id="toast"></div>
<div class="saved-dialog" id="savedDialog"></div>

<script>
// ------------------------------------------------------------------ state --- //
const state = {
  schema: { threat: null, weakness: null, mitigation_link: null, mitigation: null },
  style: null,
  threats: [],          // rich rail items (harm/surface/source/weaknesses/mitigations/references/tags)
  threatFacets: { harm: new Set(), surface: new Set(), source: new Set(), component: new Set(),
                  nature: new Set(), mitigation: new Set(), references: new Set(),
                  attention: new Set(), tags: new Set() },  // faceted filter — AND across groups, OR within a group
  threatFacetsOpen: false, // is the Threats filter panel expanded
  focusField: null,     // read-view gap chip → field to focus after entering edit
  mitById: {},          // id -> { id, name, mitigation_class }
  mitList: [],          // [[id, name, class], ...] — derived from mitRich (threats editor picker)
  mitRich: [],          // rich rail items (status/implementations/purpose) — powers the mitigations facets
  mitFacets: { class: new Set(), status: new Set(), implementations: new Set(), linkage: new Set() },
  warnings: [],          // GET /health/warnings — structured advisory list for the overview
  recentActivity: { available: false, commits: [] },   // GET /history/recent
  reportsList: [],       // GET /reports — [{system_id, system_name, latest_date, report_count, has_delta}]
  reportSeries: {},      // system_id -> GET /reports/{id} series, cached as each system is opened
  reportSelected: null,  // {system_id, date} of the open report
  currentReport: null,   // GET /reports/{id}/{date} — edited in place while status is "draft"
  reportMitInfo: {},     // mitigation_id -> { name, owner } for the open report
  reportSave: "",        // "", "saving", "ok" or "err" — the inline save indicator
  reportExport: null,    // hand-off options for the open system (see REPORT_EXPORT_DEFAULTS)
  reportAside: {},       // which folded footer sections ("discarded"/"dialogue") are open
  mitFacetsOpen: false, // is the Mitigations filter panel expanded
  mitFilter: "",        // mitigations rail text filter
  mitSelected: null,    // selected mitigation id
  currentMit: null,     // full mitigation card from GET /mitigations/{id}
  mitHistory: null,     // GET /history/mitigations/{id} — { available, file, commits }
  mitHistoryExpanded: false, // is the read-view History section itself expanded
  mitHistoryOpen: null, // Set of commit shas whose diff is expanded (accordion)
  mitDiffCache: {},     // sha -> diff payload (per-sha cache)
  mitEditing: false,    // mitigations screen: edit mode
  mitDraft: null,       // mitigations screen: in-progress edits
  mitValidation: { errors: [], advice: [] },  // mapped from a failed PATCH/POST (no live endpoint)
  mitApOpen: null,      // anti_patterns open-card index set
  mitValOpen: null,     // validation open-card index set
  mitFaqOpen: null,     // faq open-card index set
  mitImplOpen: null,    // implementations open-card index set
  threatMits: null,     // [{id,title,mitigations}] — reverse index for "addresses threats"
  selected: null,       // selected threat id
  current: null,        // full threat record from GET /threats/{id}
  history: null,        // GET /history/threats/{id} — { available, file, commits }; null until loaded
  historyExpanded: false, // is the read-view History section itself expanded
  historyOpen: null,    // Set of commit shas whose diff is expanded (accordion)
  diffCache: {},        // sha -> diff payload (per-sha cache)
  filter: "",
  editing: false,
  draft: null,          // in-progress edits
  validation: { errors: [], advice: [] },  // last /threats/validate result
  view: "structure",    // editor view: "structure" | "yaml"
  config: { repo_url: "" },  // GET /config
  screen: "overview",   // top-level screen: "overview" | "threats" | "mitigations" | "style"
  coverage: null,       // GET /style-guide/coverage
  health: null,         // GET /health/library — { stats, style_guide_coverage, issues, issue_count }
  railMode: "preview",  // threats right rail: "preview" | "guidance"
  guidance: null,       // { entity, field, targetId } of the focused form field
  styleSel: null,       // style screen: { entity, field } selected in the tree
  styleDraft: null,     // style screen: in-progress slot edits for the selected field
  styleFilter: "",      // style screen: rail text filter (field name + entity)
  styleFacets: { entity: new Set(), coverage: new Set(), orphan: new Set() },  // AND across groups, OR within
  styleFacetsOpen: false, // is the Style-guide filter panel expanded
};
window.state = state;   // exposed for smoke checks / debugging

// ------------------------------------------------------------- helpers ----- //
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : {};
  if (!r.ok) throw new Error(data.detail || (method + " " + url + " → " + r.status));
  return data;
}
const j = url => api("GET", url);

let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = "toast", 2200);
}

// ------------------------------------------------------- schema readers ---- //
// The form vocabularies come from the JSON Schema, never hardcoded.
function resolveRef(rootSchema, ref) {
  // ref like "#/$defs/Weakness"
  const parts = ref.replace(/^#\//, "").split("/");
  let node = rootSchema;
  for (const p of parts) node = node && node[p];
  return node;
}
// Resolve a property node, following an items.$ref one level if present.
function itemSchema(rootSchema, prop) {
  if (prop && prop.items && prop.items.$ref) return resolveRef(rootSchema, prop.items.$ref);
  return prop && prop.items ? prop.items : prop;
}
// Enum values for a scalar prop (properties.harm) or an array-of-enum prop (properties.surface).
function enumValues(rootSchema, prop) {
  if (!prop) return [];
  if (Array.isArray(prop.enum)) return prop.enum;
  const it = itemSchema(rootSchema, prop);
  return (it && Array.isArray(it.enum)) ? it.enum : [];
}
const threatProp = name => (state.schema.threat.properties || {})[name];
const harmEnum = () => enumValues(state.schema.threat, threatProp("harm"));
const surfaceEnum = () => enumValues(state.schema.threat, threatProp("surface"));
const sourceEnum = () => enumValues(state.schema.threat, threatProp("source"));
// Weakness component enum — resolved via the standalone weakness schema.
const componentEnum = () => {
  const wp = state.schema.weakness && state.schema.weakness.properties;
  return wp && wp.component && Array.isArray(wp.component.enum) ? wp.component.enum : [];
};
// Weakness nature enum (targeted / secondary) — from the weakness schema.
const natureEnum = () => {
  const wp = state.schema.weakness && state.schema.weakness.properties;
  return wp && wp.nature && Array.isArray(wp.nature.enum) ? wp.nature.enum : [];
};
// Mitigation-link strength enum (gating / soft) — from the mitigation_link schema.
const strengthEnum = () => {
  const mp = state.schema.mitigation_link && state.schema.mitigation_link.properties;
  return mp && mp.strength && Array.isArray(mp.strength.enum) ? mp.strength.enum : [];
};

// --------------------------------------------------------------- boot ------ //
async function boot() {
  const [sThreat, sWeak, sMitLink, sMit, style, cov, tr, mi, cfg, health] = await Promise.all([
    j("/schema/threat"),
    j("/schema/weakness"),
    j("/schema/mitigation_link"),
    j("/schema/mitigation"),
    j("/style-guide"),
    j("/style-guide/coverage"),  // { overall, entities: [{entity_type, overall, fields:[{field_name, completeness, is_orphan}]}] }
    j(THREATS_RICH_URL),        // rich rail items — everything the Threats facets need (13 threats, fine over REST)
    j(MITS_RICH_URL),           // rich rail items — everything the Mitigations facets need
    j("/config"),               // { repo_url } — empty string when unset
    j("/health/library"),       // { stats, issues, issue_count } — seeds the "needs attention" facet
  ]);
  state.schema.threat = sThreat;
  state.schema.weakness = sWeak;
  state.schema.mitigation_link = sMitLink;
  state.schema.mitigation = sMit;
  state.style = style;
  state.coverage = cov;
  state.threats = tr.threats || [];
  state.threatMits = state.threats;   // rich threats carry mitigations — powers "addresses"/linkage facet
  state.health = health;
  setMitData(mi.mitigations || []);
  state.config = cfg || { repo_url: "" };
}

// The rich rail URLs — each item carries everything its facet panel needs.
const THREATS_RICH_URL = "/threats?brief=false&include=harm&include=surface&include=source" +
  "&include=weaknesses&include=mitigations&include=references&include=tags";
const MITS_RICH_URL = "/mitigations?brief=false&include=status&include=implementations&include=purpose";

// Seed mitRich (facets) plus the derived mitList/mitById the threats editor still uses.
function setMitData(rich) {
  state.mitRich = rich;
  state.mitList = rich.map(m => [m.id, m.name, m.mitigation_class]);
  state.mitById = Object.fromEntries(
    rich.map(m => [m.id, { id: m.id, name: m.name, mitigation_class: m.mitigation_class }])
  );
}

// --------------------------------------------------------------- rail ------ //
// Threat ids flagged in /health/library (any gap). Returns null when health isn't loaded.
function attentionThreatIds() {
  const iss = state.health && state.health.issues;
  if (!iss) return null;
  const ids = new Set();
  const add = arr => (arr || []).forEach(x => ids.add(String(x).split("::")[0]));
  add(iss.threats_missing_weaknesses);
  add(iss.threats_missing_harm);
  add(iss.threats_without_mitigation);
  add(iss.dangling_mitigation_links);
  return ids;
}

// Broadened text search: id, title, weakness text, reachability.
function threatMatchesText(t, f) {
  if (!f) return true;
  const hay = [t.id, t.title, t.reachability, ...(t.weaknesses || []).map(w => w.text)].join(" ").toLowerCase();
  return hay.includes(f);
}
// The facet-values a threat carries for a given group (used both to filter and, by
// membership, to decide if a chip matches). OR within a group, AND across groups.
function threatFacetValues(t, key) {
  switch (key) {
    case "harm": return t.harm ? [t.harm] : [];
    case "surface": return t.surface || [];
    case "source": return t.source || [];
    case "component": return [...new Set((t.weaknesses || []).map(w => w.component).filter(Boolean))];
    case "nature": return [...new Set((t.weaknesses || []).map(w => w.nature).filter(Boolean))];
    case "mitigation": {
      const mits = t.mitigations || [];
      if (!mits.length) return ["none"];
      return mits.some(m => m.strength === "gating") ? ["gating"] : ["soft"];
    }
    case "references": return (t.references || []).length ? ["has"] : ["none"];
    case "attention": { const a = attentionThreatIds(); return a && a.has(t.id) ? ["attn"] : []; }
    case "tags": return t.tags || [];
  }
  return [];
}
function threatMatchesFacets(t) {
  const F = state.threatFacets;
  for (const key of Object.keys(F)) {
    const sel = F[key];
    if (!sel || !sel.size) continue;                    // empty group = no constraint
    const vals = threatFacetValues(t, key);
    if (!vals.some(v => sel.has(v))) return false;      // AND across groups
  }
  return true;
}

function renderList() {
  const el = document.getElementById("list");
  const f = state.filter.toLowerCase();
  const items = state.threats.filter(t => threatMatchesText(t, f) && threatMatchesFacets(t));
  el.innerHTML = items.length ? items.map(t => `
    <div class="row ${state.selected === t.id ? "active" : ""}" data-id="${esc(t.id)}">
      <span class="rid">${esc(t.id)}</span>
      <span class="rtitle">${esc(t.title)}</span>
    </div>`).join("") : '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = items.length + " / " + state.threats.length;
  el.querySelectorAll(".row").forEach(r => r.onclick = () => select(r.dataset.id));
}

// ---- shared facet-panel machinery (both rails) ---------------------------- //
// Renders a collapsed "Filters (N)" expander into #facetPanel; expanded it shows
// grouped, multi-select chips. `spec`: { open, facets (state Set map), defs: [{key,
// label, opts:[[value,label]]}], onchange }. Selected chip = crimson fill.
function renderFacetPanel(spec) {
  const el = document.getElementById("facetPanel");
  if (!el) return;
  const active = Object.values(spec.facets).reduce((n, s) => n + s.size, 0);
  const groups = spec.defs.filter(g => g.opts.length).map(g => {
    const sel = spec.facets[g.key];
    const chips = g.opts.map(([value, label]) =>
      `<button type="button" class="fx-chip ${sel.has(value) ? "on" : ""}" data-fkey="${esc(g.key)}" data-fval="${esc(value)}">${esc(label)}</button>`).join("");
    return `<div class="fx-group"><p class="fx-gk">${esc(g.label)}</p><div class="fx-chips">${chips}</div></div>`;
  }).join("");
  el.className = "facets" + (spec.open ? " open" : "");
  el.innerHTML = `
    <div class="facets-bar" id="fxBar">
      <span class="fx-caret">${spec.open ? "▾" : "▸"}</span>
      <span class="fx-label">Filters</span>
      ${active ? `<span class="fx-badge">${active}</span>` : ""}
      ${active ? `<button type="button" class="fx-clear" id="fxClear">Clear all</button>` : ""}
    </div>
    <div class="facets-body">${groups}</div>`;
  document.getElementById("fxBar").onclick = e => {
    if (e.target.closest("#fxClear")) return;           // clear handled below
    spec.onopen(!spec.open);
  };
  const clear = document.getElementById("fxClear");
  if (clear) clear.onclick = e => { e.stopPropagation(); spec.onclear(); };
  el.querySelectorAll(".fx-chip").forEach(c => c.onclick = () => spec.ontoggle(c.dataset.fkey, c.dataset.fval));
}

// Threats facet definitions — options come from the schema (never hardcoded) + the data.
function threatFacetDefs() {
  const tags = [...new Set(state.threats.flatMap(t => t.tags || []))].sort();
  return [
    { key: "harm", label: "Harm", opts: harmEnum().map(v => [v, v]) },
    { key: "surface", label: "Surface", opts: surfaceEnum().map(v => [v, v]) },
    { key: "source", label: "Source", opts: sourceEnum().map(v => [v, v]) },
    { key: "component", label: "Component", opts: componentEnum().map(v => [v, v]) },
    { key: "nature", label: "Nature", opts: natureEnum().map(v => [v, v]) },
    { key: "mitigation", label: "Mitigation", opts: [["gating", "has gating"], ["soft", "all soft"], ["none", "none"]] },
    { key: "references", label: "References", opts: [["has", "has refs"], ["none", "no refs"]] },
    { key: "attention", label: "Needs attention", opts: [["attn", "flagged"]] },
    { key: "tags", label: "Tags", opts: tags.map(v => [v, v]) },
  ];
}
function renderThreatFacets() {
  renderFacetPanel({
    open: state.threatFacetsOpen,
    facets: state.threatFacets,
    defs: threatFacetDefs(),
    onopen: on => { state.threatFacetsOpen = on; renderThreatFacets(); },
    onclear: () => { for (const s of Object.values(state.threatFacets)) s.clear(); renderThreatFacets(); renderList(); },
    ontoggle: (key, val) => {
      const s = state.threatFacets[key];
      s.has(val) ? s.delete(val) : s.add(val);
      renderThreatFacets(); renderList();
    },
  });
}

// Refresh the threats rail list (rich shape so facets keep working) + the "addresses" index.
async function refreshThreatList() {
  const tr = await j(THREATS_RICH_URL);
  state.threats = tr.threats || [];
  state.threatMits = state.threats;
}
async function refreshHealth() {
  try { state.health = await j("/health/library"); } catch (e) { /* keep prior */ }
}

async function select(id) {
  state.selected = id; state.editing = false; state.draft = null;
  state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  // History is per-entry: clear it on select; loadHistory refetches and re-renders.
  state.history = null; state.historyExpanded = false;
  state.historyOpen = new Set(); state.diffCache = {};
  renderList();
  try {
    state.current = await j("/threats/" + encodeURIComponent(id));
  } catch (e) {
    state.current = null; toast(e.message, true);
  }
  renderDetail();
  renderPreview();
  document.getElementById("main").scrollTop = 0;
  validateDraft();          // populate advice for the Insights strip (non-blocking)
  loadHistory(threatHistoryCfg());   // fetch the commit list, then re-render (non-blocking)
}

// ------------------------------------------------------------- detail ------ //
function renderDetail() {
  const m = document.getElementById("main");
  if (!state.selected || !state.current) {
    m.innerHTML = '<div class="empty">Select a threat from the list.</div>';
    return;
  }
  m.innerHTML = state.editing ? editThreat(state.current) : readThreat(state.current);
  wireDetail();
}

// ---- shared read-view helpers (both read views) --------------------------- //
// Each populated section sits on its own subtle surface (.readsec). Empty optional
// sections render NOTHING; their labels are gathered and summarized in one muted line
// so a stub entry reads as signal, not a wall of dashes.
function readsec(label, inner, sub) {
  return `<section class="readsec"><h3 class="slabel">${esc(label)}${sub ? ` <span class="sub">${sub}</span>` : ""}</h3>${inner}</section>`;
}
function notAuthoredLine(labels) {
  return labels.length
    ? `<p class="notauthored">Not authored yet: ${labels.map(l => esc(String(l).toLowerCase())).join(", ")}</p>`
    : "";
}
// Gaps bar (read view): the missing optional fields as clickable chips. Each chip
// stashes its target field on state.focusField and enters the editor, which then
// scrolls that field into view and focuses it (see focusDraftField). `gaps` is a
// list of { label, field } — label is what the reader sees, field the edit-form
// data-field to jump to.
function gapsBar(gaps) {
  if (!gaps.length) return "";
  const chips = gaps.map(g =>
    `<button type="button" class="gap-chip" data-gap-field="${esc(g.field)}">${esc(g.label)}</button>`).join("");
  return `<div class="gaps-bar">
    <span class="gaps-k">Not authored yet (${gaps.length})</span>
    <div class="gaps-chips">${chips}</div>
  </div>`;
}
// After an editor renders, jump to and focus the field a gap chip asked for (if any).
function focusDraftField() {
  const name = state.focusField;
  if (!name) return;
  state.focusField = null;
  const f = document.querySelector(`#main .field[data-field="${CSS.escape(name)}"]`);
  if (!f) return;
  f.scrollIntoView({ block: "center" });
  const input = f.querySelector("input, textarea, select");
  if (input) input.focus();
}
// Breadcrumb: "<Type> · <id>"; the type word clears the selection (back to the list).
function crumb(type, id) {
  return `<div class="crumb"><button type="button" class="crumb-type" data-crumb="${esc(type)}">${esc(type)}</button>
    <span class="crumb-sep">·</span><span class="crumb-id">${esc(id)}</span></div>`;
}
// Cross-screen jumps used by the read-view links (mirror overviewOpenThreat).
function jumpToThreat(id) { switchScreen("threats"); select(id); }
function jumpToMit(id) { switchScreen("mitigations"); selectMit(id); }
function clearThreatSelection() {
  state.selected = null; state.current = null;
  state.editing = false; state.draft = null;
  renderList(); renderDetail(); renderPreview();
}
function clearMitSelection() {
  state.mitSelected = null; state.currentMit = null;
  state.mitEditing = false; state.mitDraft = null;
  renderMitRail(); renderMitDetail(); renderMitPreview();
