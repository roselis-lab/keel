// ---- read-only Git history (both read views) ------------------------------ //
// The back end exposes GET /history/{entity}/{id} (commit list; available:false when
// the catalog isn't a git repo or the file is untracked) and GET /history/{entity}/
// {id}/{sha} (unified diff). Both read views degrade silently when unavailable.

// Coarse relative time from an ISO date, computed client-side. Falls back to the raw
// string when the date can't be parsed.
function relTime(iso) {
  const then = new Date(iso);
  if (isNaN(then.getTime())) return iso || "";
  const secs = Math.floor((Date.now() - then.getTime()) / 1000);
  const unit = (n, w) => n + " " + w + (n === 1 ? "" : "s") + " ago";
  if (secs < 45) return "just now";
  const mins = Math.floor(secs / 60);
  if (mins < 60) return unit(mins, "minute");
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return unit(hrs, "hour");
  const days = Math.floor(hrs / 24);
  if (days < 30) return unit(days, "day");
  const months = Math.floor(days / 30);
  if (months < 12) return unit(months, "month");
  return unit(Math.floor(days / 365), "year");
}
const firstLine = s => String(s ?? "").split("\n")[0];

// The two read views wire the same history machinery through a small config that
// names their state slice, id source, and re-render entry point.
function threatHistoryCfg() {
  return {
    entity: "threats",
    getId: () => state.selected,
    getHist: () => state.history,
    setHist: h => { state.history = h; },
    getExpanded: () => state.historyExpanded,
    setExpanded: v => { state.historyExpanded = v; },
    getOpen: () => (state.historyOpen || (state.historyOpen = new Set())),
    getCache: () => state.diffCache,
    rerender: renderDetail,
  };
}
function mitHistoryCfg() {
  return {
    entity: "mitigations",
    getId: () => state.mitSelected,
    getHist: () => state.mitHistory,
    setHist: h => { state.mitHistory = h; },
    getExpanded: () => state.mitHistoryExpanded,
    setExpanded: v => { state.mitHistoryExpanded = v; },
    getOpen: () => (state.mitHistoryOpen || (state.mitHistoryOpen = new Set())),
    getCache: () => state.mitDiffCache,
    rerender: renderMitDetail,
  };
}

// Fetch the commit list for the current entry once and stash it; re-render when it
// lands (guarded against a selection change mid-flight). Any error degrades to
// "no history" so the UI simply shows nothing.
async function loadHistory(cfg) {
  const id = cfg.getId();
  cfg.setHist(null);
  cfg.getOpen().clear();
  let h;
  try {
    h = await j("/history/" + cfg.entity + "/" + encodeURIComponent(id));
  } catch (e) {
    h = { available: false, commits: [] };
  }
  if (cfg.getId() !== id) return;   // selection moved on; drop this result
  cfg.setHist(h);
  cfg.rerender();
}

// The quiet "Last changed <when> by <who>" line from the newest commit. Omitted
// when history is unavailable or empty.
function lastChangedLine(hist) {
  if (!hist || !hist.available || !(hist.commits || []).length) return "";
  const c = hist.commits[0];
  return `<div class="last-changed">Last changed ${esc(relTime(c.date))} by ${esc(c.author)}<button type="button" class="lc-diff" data-hist-newest="${esc(c.sha)}">view diff</button></div>`;
}

// Render a unified diff as a native GitHub-style view: a 3-column table
// [old #][new #][content]. Line numbers are driven by each @@ hunk header —
// a "+" advances the NEW counter (old gutter blank), a "-" advances the OLD
// counter (new gutter blank), a context line advances BOTH. Additions get a
// green row, deletions a red row, context is plain. Hunk headers render as a
// muted separator row and reset the counters. File-header noise (diff --git,
// index, --- a/, +++ b/, mode/rename lines) is hidden, with the target path
// lifted into one tiny caption. Content is escaped and whitespace preserved
// (white-space: pre); long lines scroll horizontally. The sign stays on the row.
const DIFF_HUNK_RE = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/;
function isDiffFileHeader(ln) {
  return ln.startsWith("diff --git") || ln.startsWith("index ") ||
    ln.startsWith("--- ") || ln.startsWith("+++ ") ||
    ln.startsWith("new file") || ln.startsWith("deleted file") ||
    ln.startsWith("old mode") || ln.startsWith("new mode") ||
    ln.startsWith("similarity ") || ln.startsWith("rename ") || ln.startsWith("copy ");
}
function diffHtml(text) {
  const lines = String(text ?? "").split(/\r?\n/);   // tolerate CRLF checkouts
  if (lines.length && lines[lines.length - 1] === "") lines.pop();  // drop trailing split artifact
  const gutter = (o, n) => `<td class="dg dg-o">${o}</td><td class="dg dg-n">${n}</td>`;
  const row = (cls, o, n, ln) => `<tr class="${cls}">${gutter(o, n)}<td class="dc">${esc(ln)}</td></tr>`;
  let oldNo = 0, newNo = 0, filePath = "", inHunk = false;
  const rows = [];
  for (const ln of lines) {
    if (ln.startsWith("@@")) {
      const m = ln.match(DIFF_HUNK_RE);
      if (m) { oldNo = parseInt(m[1], 10); newNo = parseInt(m[2], 10); }
      rows.push(row("dr-hunk", "", "", ln));
      inHunk = true;
      continue;
    }
    if (isDiffFileHeader(ln)) {
      const path = p => p.replace(/\t.*$/, "").trim();
      if (ln.startsWith("+++ ")) { const p = path(ln.slice(4).replace(/^b\//, "")); if (p && p !== "/dev/null") filePath = p; }
      else if (ln.startsWith("--- ") && !filePath) { const p = path(ln.slice(4).replace(/^a\//, "")); if (p && p !== "/dev/null") filePath = p; }
      continue;
    }
    if (!inHunk) continue;  // preamble before the first hunk (leading blank, "commit …" lines) — noise
    if (ln.startsWith("+")) rows.push(row("dr-add", "", newNo++, ln));
    else if (ln.startsWith("-")) rows.push(row("dr-del", oldNo++, "", ln));
    else if (ln.startsWith("\\")) rows.push(row("dr-meta", "", "", ln));  // "\ No newline at end of file"
    else rows.push(row("dr-ctx", oldNo++, newNo++, ln));                  // context (leading space or blank)
  }
  const cap = filePath ? `<div class="diff-cap">${esc(filePath)}</div>` : "";
  return `<div class="diffwrap">${cap}<div class="diff-scroll"><table class="difftbl"><tbody>${rows.join("")}</tbody></table></div></div>`;
}

function historyRow(c, cfg) {
  const isOpen = cfg.getOpen().has(c.sha);
  const cached = cfg.getCache()[c.sha];
  const short = esc(String(c.sha || "").slice(0, 7));
  const diff = isOpen
    ? (cached ? diffHtml(cached.diff) : `<div class="diff-loading">Loading diff…</div>`)
    : "";
  return `<div class="commit ${isOpen ? "open" : ""}">
    <div class="commit-row" data-sha="${esc(c.sha)}">
      <div class="commit-msg">${esc(firstLine(c.message)) || "(no message)"}</div>
      <div class="commit-meta">
        <span class="commit-author">${esc(c.author)}</span>
        <span class="sep">·</span><span>${esc(relTime(c.date))}</span>
        <span class="sep">·</span><span class="commit-sha">${short}</span>
      </div>
    </div>
    ${isOpen ? `<div class="commit-diff">${diff}</div>` : ""}
  </div>`;
}

// The collapsed-by-default History .readsec at the foot of a read view. Renders
// nothing when history is unavailable or has no commits (silent degrade).
function historySection(cfg) {
  const hist = cfg.getHist();
  if (!hist || !hist.available || !(hist.commits || []).length) return "";
  const open = cfg.getExpanded();
  const commits = hist.commits;
  const body = open ? `<div class="history-list">${commits.map(c => historyRow(c, cfg)).join("")}</div>` : "";
  return `<section class="readsec history-sec">
    <h3 class="slabel history-head" data-hist-toggle="1">
      <span class="fx-caret">${open ? "▾" : "▸"}</span>History (${commits.length})
    </h3>
    ${body}
  </section>`;
}

// Wire the History section: header toggles the whole section; a commit row toggles
// its inline diff (fetched once per sha, then cached). Selectors miss in edit mode,
// so this is a no-op there.
function wireHistory(cfg) {
  const head = document.querySelector("#main [data-hist-toggle]");
  if (head) head.onclick = () => { cfg.setExpanded(!cfg.getExpanded()); cfg.rerender(); };
  document.querySelectorAll("#main .commit-row").forEach(row =>
    row.onclick = () => toggleDiff(cfg, row.dataset.sha));
  // "view diff" on the provenance line: open the History section and reveal the
  // newest commit's diff inline, right in the card — no separate history trip.
  const newest = document.querySelector("#main [data-hist-newest]");
  if (newest) newest.onclick = () => { cfg.setExpanded(true); toggleDiff(cfg, newest.dataset.histNewest); };
}
async function toggleDiff(cfg, sha) {
  const open = cfg.getOpen();
  if (open.has(sha)) { open.delete(sha); cfg.rerender(); return; }
  open.add(sha);
  cfg.rerender();                       // shows "Loading diff…" until the fetch lands
  const cache = cfg.getCache();
  if (cache[sha]) return;
  const id = cfg.getId();
  try {
    cache[sha] = await j("/history/" + cfg.entity + "/" + encodeURIComponent(id) + "/" + encodeURIComponent(sha));
  } catch (e) {
    cache[sha] = { diff: "(diff unavailable)" };
  }
  if (cfg.getId() === id && open.has(sha)) cfg.rerender();
}

// Read view — the NEW threat fields.
function readThreat(t) {
  const badge = (cls, v) => `<span class="badge ${cls}">${esc(v)}</span>`;
  const surface = (t.surface || []).map(v => badge("type", v)).join(" ") || '<span class="placeholder">none</span>';
  const source = (t.source || []).map(v => badge("type", v)).join(" ") || '<span class="placeholder">none</span>';

  const weaknesses = (t.weaknesses || []).length
    ? `<ul class="plain">${t.weaknesses.map(w => `
        <li><div class="meta">${esc(w.component)}${w.nature ? " · " + esc(w.nature) : ""}</div>${esc(w.text)}</li>`).join("")}</ul>`
    : '<div class="warn">No weaknesses authored.</div>';

  // Linked mitigations — each card jumps to that mitigation.
  const mits = (t.mitigations || []).length
    ? (t.mitigations || []).map(l => {
        const mm = state.mitById[l.id];
        return `<div class="card jrow" data-jmit="${esc(l.id)}" title="Open ${esc(l.id)}">
          <div class="chead">
            <span class="cid">${esc(l.id)}</span>
            <span class="ctitle">${esc(mm ? mm.name : "(missing)")}</span>
            <span class="badge soft" style="margin-left:auto">${esc(l.strength || "")}</span>
          </div>
          ${l.rationale ? `<div class="rationale">${esc(l.rationale)}</div>` : ""}
          ${l.exception ? `<div class="rationale">Exception: ${esc(l.exception)}</div>` : ""}
        </div>`;
      }).join("")
    : '<p class="placeholder">None linked.</p>';

  const omitted = [];
  // An optional prose section: shown only when it has content; else recorded as a gap
  // (with the edit-form field to jump to when its chip is clicked).
  const optProse = (label, field, v, sub) => {
    if (v && String(v).trim()) return readsec(label, `<div class="prose">${esc(v)}</div>`, sub);
    omitted.push({ label, field }); return "";
  };
  const refsHtml = (t.references || []).length
    ? readsec("References", `<ul class="plain">${t.references.map(r =>
        `<li><span class="meta">${esc(r.title)}</span> <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></li>`).join("")}</ul>`)
    : (omitted.push({ label: "References", field: "references" }), "");
  const tagsHtml = (t.tags || []).length
    ? readsec("Tags", `<div class="badges">${(t.tags || []).map(x => badge("tag", x)).join(" ")}</div>`)
    : (omitted.push({ label: "Tags", field: "tags" }), "");

  const sections = [
    readsec("Surface", `<div class="badges">${surface}</div>`, "— where the interaction happens"),
    readsec("Source", `<div class="badges">${source}</div>`, "— who or what drives it"),
    readsec("Weaknesses", weaknesses, "— architectural conditions"),
    optProse("Reachability", "reachability", t.reachability, "— when NOT a live path"),
    readsec(`Mitigations (${(t.mitigations || []).length})`, mits),
    refsHtml,
    tagsHtml,
  ].join("");

  return `<div class="detail">
    ${crumb("Threats", t.id)}
    ${lastChangedLine(state.history)}
    <div class="dhead">
      <div class="dicon">T</div>
      <div class="dtitle">
        <h2>${esc(t.title)}</h2>
        <div class="did">${esc(t.id)}</div>
        <div class="hbadges badges">
          ${t.harm ? badge("harm", t.harm) : '<span class="badge soft" style="color:var(--crimson-600)">no harm</span>'}
        </div>
      </div>
      <div class="hactions">
        <button class="btn ghost" id="editBtn">Edit</button>
        <button class="btn ghost" id="deleteBtn" title="Delete this threat">Delete</button>
      </div>
    </div>
    ${sections}
    ${gapsBar(omitted)}
    ${historySection(threatHistoryCfg())}
  </div>`;
}

// ---------------------------------------------------- style-guide bar ------ //
// Live guidance read from state.style.entities.<entity>.fields.<field>.
// Missing entries degrade gracefully (empty string, no hint, no panel).
function styleField(entity, field) {
  const ents = state.style && state.style.entities;
  const ent = ents && ents[entity];
  return (ent && ent.fields && ent.fields[field]) || null;
}
// One-line hint (the field's purpose), shown above the input at all times.
// The *From variants take a style-field-like object directly, so the style-guide
// editor's right pane can render the SAME markup fed from an in-progress draft.
function sgHintFrom(sf) {
  return (sf && sf.purpose) ? `<div class="sg-hint">${esc(sf.purpose)}</div>` : "";
}
function sgHint(entity, field) {
  return sgHintFrom(styleField(entity, field));
}
// Always-present one-line hint row (reserves height so inputs align even when a
// field has no style-guide purpose). Verbose guidance now lives in the right rail.
function hintRow(entity, field) {
  const sf = styleField(entity, field);
  const txt = (sf && sf.purpose) ? esc(sf.purpose) : "";
  return `<div class="sg-hint">${txt}</div>`;
}
// Expandable guidance panel: Include / Avoid / first example (+ "use example").
// opts.show forces the panel open (used by the always-on style-guide preview).
function sgPanelFrom(sf, targetId, opts) {
  if (!sf) return "";
  const list = (k, items) => `<div class="sg-sec"><span class="sg-k">${k}</span><ul>${
    items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const parts = [];
  if (sf.content_requirements && sf.content_requirements.length) parts.push(list("Include", sf.content_requirements));
  if (sf.avoid && sf.avoid.length) parts.push(list("Avoid", sf.avoid));
  if (sf.examples && sf.examples.length) {
    const ex = sf.examples[0];
    const btn = targetId
      ? `<button type="button" class="btn ghost sm sg-useex" data-target="${esc(targetId)}" data-example="${esc(encodeURIComponent(ex))}">use example</button>`
      : "";
    parts.push(`<div class="sg-sec"><span class="sg-k">Example</span><div class="sg-ex">${esc(ex)}</div>${btn}</div>`);
  }
  const cls = (opts && opts.show) ? "sg-panel show" : "sg-panel";
  return parts.length ? `<div class="${cls}">${parts.join("")}</div>` : "";
}
function sgPanel(entity, field, targetId) {
  return sgPanelFrom(styleField(entity, field), targetId);
}

// Inline, per-field authoring guidance — the replacement for the old right-rail
// "Guidance" mode. A compact <details> that reveals this field's Include / Avoid /
// Example (+ "use example") in place, so the editor never needs a second column and
// the guidance sits right where you are typing. Renders nothing when the field has
// no style-guide entry, so it adds no clutter to fields without guidance.
function inlineGuidance(entity, field, targetId) {
  const panel = sgPanelFrom(styleField(entity, field), targetId, { show: true });
  if (!panel) return "";
  return `<details class="fguide"><summary>Guidance</summary>${panel}</details>`;
}
// Wire the "use example" buttons inside any inline guidance panels: write the example
// into the target input without stealing/dropping focus (mousedown guard). Safe to
// call from any edit view; a no-op when there are no such buttons.
function wireInlineGuidance() {
  document.querySelectorAll("#main .sg-useex").forEach(b => {
    b.onmousedown = e => e.preventDefault();   // keep focus on the field
    b.onclick = () => {
      const t = document.getElementById(b.dataset.target);
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) {
        t.value = decodeURIComponent(b.dataset.example);
        t.dispatchEvent(new Event("input"));
        t.focus();
      }
    };
  });
}

// Edit form — built by walking the threat schema's field order.
// Only the schema-simple fields are editable here; weakness/mitigation editors are deferred.
const EDITABLE = new Set(["title", "harm", "surface", "source", "reachability", "tags"]);

function editThreat(t) {
  const d = state.draft;
  const order = Object.keys(state.schema.threat.properties || {});
  const blocks = [];
  for (const name of order) {
    if (name === "id" || name === "title") continue;   // id/title handled in the header
    if (name === "weaknesses") { blocks.push(weaknessesEditor()); continue; }
    if (name === "mitigations") { blocks.push(mitigationsEditor()); continue; }
    if (name === "references") { blocks.push(referencesEditor()); continue; }
    if (!EDITABLE.has(name)) continue;
    blocks.push(fieldEditor(name, d));
  }

  const body = `<div id="errSummary" class="err-summary" style="display:none"></div>${blocks.join("")}`;

  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">T</div>
      <div class="dtitle field" data-entity="threat" data-field="title" style="width:100%">
        ${hintRow("threat", "title")}
        <input class="f titlein" id="f_title" value="${esc(d.title)}">
        <div class="did" style="margin-top:6px">${esc(t.id)}</div>
      </div>
      <div class="hactions">
        <button class="btn primary" id="saveBtn">Save</button>
        <button class="btn ghost" id="cancelBtn">Cancel</button>
      </div>
    </div>
    ${body}
  </div>`;
}

function fieldEditor(name, d) {
  // Each threat field is a SECTION: a semantic fieldset/legend (no card border).
  // The one-line hint reserves its row; verbose guidance lives in the right rail.
  const tId = ["harm", "reachability", "tags", "title"].includes(name) ? "f_" + name : "";
  const wrap = (label, inner, sub) =>
    `<fieldset class="field" data-entity="threat" data-field="${esc(name)}">
      <legend class="slabel">${esc(label)}${sub ? ` <span class="sub">${sub}</span>` : ""}</legend>
      ${hintRow("threat", name)}
      ${inner}
      ${inlineGuidance("threat", name, tId)}
    </fieldset>`;
  if (name === "harm") {
    const opts = harmEnum().map(v => `<option value="${esc(v)}" ${v === d.harm ? "selected" : ""}>${esc(v)}</option>`).join("");
    return wrap("Harm", `<select class="f" id="f_harm">${opts}</select>`);
  }
  if (name === "surface" || name === "source") {
    const vals = name === "surface" ? surfaceEnum() : sourceEnum();
    const chosen = new Set(d[name] || []);
    const boxes = vals.map(v => `
      <label><input type="checkbox" data-set="${name}" value="${esc(v)}" ${chosen.has(v) ? "checked" : ""}>${esc(v)}</label>`).join("");
    // Sentence case: the label is a heading now, and a lowercase word under a 15px
    // heading treatment reads as an unformatted field name rather than a section.
    return wrap(name === "surface" ? "Surface" : "Source", `<div class="checkset">${boxes}</div>`);
  }
  if (name === "reachability") {
    return wrap("Reachability",
      `<textarea class="f" id="f_reachability" rows="4" placeholder="NOT applicable if…">${esc(d.reachability)}</textarea>`,
      "— NOT applicable if…");
  }
  if (name === "tags") {
    return wrap("Tags",
      `<input class="f" id="f_tags" value="${esc((d.tags || []).join(", "))}" placeholder="comma, separated">`);
  }
  return "";
}

// Small helpers for card open-state (the ONLY heavy container is the card border).
function toggleSet(set, key) { if (!set) return; if (set.has(key)) set.delete(key); else set.add(key); }
// After splicing index `removed`, shift the remaining open indices down by one.
function shiftWkOpen(removed) {
  const next = new Set();
  (state.wkOpen || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  state.wkOpen = next;
}
function shiftRefOpen(removed) {
  const next = new Set();
  (state.refOpen || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  state.refOpen = next;
}

// Weaknesses — repeatable BORDERED cards bound to state.draft.weaknesses.
// First card expanded; the rest collapse to a one-line summary (component · text).
function weaknessesEditor() {
  const ws = state.draft.weaknesses || [];
  const comps = componentEnum();
  const nats = natureEnum();
  const open = state.wkOpen || new Set();
  const cards = ws.map((w, i) => {
    const isOpen = open.has(i);
    const summary = `${esc(w.component || "—")}${(w.text || "").trim() ? " · " + esc((w.text || "").trim().slice(0, 40)) : ""}`;
    const head = `<div class="ecard-head" data-widx="${i}">
        <button type="button" class="card-toggle wk-toggle" data-widx="${i}" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${isOpen ? "Weakness " + (i + 1) : summary}</span>
        <button type="button" class="cardx wk-remove" data-widx="${i}" title="Remove weakness">×</button>
      </div>`;
    if (!isOpen) return `<div class="ecard wk-card collapsed" data-widx="${i}">${head}</div>`;
    const compOpts = comps.map(c => `<option value="${esc(c)}" ${c === w.component ? "selected" : ""}>${esc(c)}</option>`).join("");
    const natOpts = nats.map(n => `<option value="${esc(n)}" ${n === w.nature ? "selected" : ""}>${esc(n)}</option>`).join("");
    return `<div class="ecard wk-card open" data-widx="${i}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-entity="weakness" data-field="component">
        <h3 class="slabel">Component</h3>
        ${hintRow("weakness", "component")}
        <select class="f wk-component" data-widx="${i}">${compOpts}</select>
      </div>
      <div class="field" data-entity="weakness" data-field="text">
        <h3 class="slabel">Text</h3>
        ${hintRow("weakness", "text")}
        <textarea class="f wk-text" data-widx="${i}" id="wk_text_${i}" rows="3" placeholder="cause + where + defect">${esc(w.text || "")}</textarea>
      </div>
      <div class="field" data-entity="weakness" data-field="nature">
        <h3 class="slabel">Nature</h3>
        ${hintRow("weakness", "nature")}
        <select class="f wk-nature" data-widx="${i}">${natOpts}</select>
      </div>
      </div>
    </div>`;
  }).join("");
  return `<fieldset class="section wk-section">
    <legend class="slabel">Weaknesses <span class="sub">— architectural conditions</span></legend>
    ${cards}
    <button class="btn ghost" id="addWeakness">+ Add weakness</button></fieldset>`;
}

// Mitigation links — cards over state.current.mitigations (immediate server writes,
// separate from the draft/Save flow). Link/unlink/strength/rationale hit the API directly.
function mitigationsEditor() {
  // Links are immediate server writes, so they need the threat to exist first.
  if (state.draft && state.draft.isNew) {
    return `<fieldset class="section ml-section">
      <legend class="slabel">Mitigations</legend>
      <p class="placeholder">Save the threat first, then link mitigations.</p></fieldset>`;
  }
  const links = (state.current && state.current.mitigations) || [];
  const linkedIds = new Set(links.map(l => l.id));
  const strengths = strengthEnum();
  const open = state.mlOpen || new Set();
  const cards = links.length ? links.map(l => {
    const mm = state.mitById[l.id];
    const isOpen = open.has(l.id);
    const summary = `${esc(l.id)} · ${esc(mm ? mm.name : "(missing)")}`;
    const head = `<div class="ecard-head" data-mid="${esc(l.id)}">
        <button type="button" class="card-toggle ml-toggle" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${summary}</span>
        ${isOpen && l.strength ? `<span class="badge soft">${esc(l.strength)}</span>` : ""}
        <button type="button" class="cardx ml-unlink" title="Unlink mitigation">×</button>
      </div>`;
    if (!isOpen) return `<div class="ecard ml-card collapsed" data-mid="${esc(l.id)}">${head}</div>`;
    const opts = strengths.map(s => `<option value="${esc(s)}" ${s === l.strength ? "selected" : ""}>${esc(s)}</option>`).join("");
    return `<div class="ecard ml-card open" data-mid="${esc(l.id)}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-entity="mitigation_link" data-field="strength">
        <h3 class="slabel">Strength</h3>
        ${hintRow("mitigation_link", "strength")}
        <select class="f ml-strength">${opts}</select>
      </div>
      <div class="field" data-entity="mitigation_link" data-field="rationale">
        <h3 class="slabel">Rationale</h3>
        ${hintRow("mitigation_link", "rationale")}
        <textarea class="f ml-rationale" id="ml_rat_${esc(l.id)}" rows="2" placeholder="why this control addresses this threat">${esc(l.rationale || "")}</textarea>
      </div>
      <div class="field" data-entity="mitigation_link" data-field="exception">
        <h3 class="slabel">Exception <span class="sub">— optional, rare</span></h3>
        ${hintRow("mitigation_link", "exception")}
        <textarea class="f ml-exception" id="ml_exc_${esc(l.id)}" rows="2" placeholder="narrow case where this control doesn't apply to this threat">${esc(l.exception || "")}</textarea>
      </div>
      </div>
    </div>`;
  }).join("") : '<p class="placeholder">None linked.</p>';

  const unlinked = Object.values(state.mitById).filter(m => !linkedIds.has(m.id));
  const pickOpts = unlinked.map(m => `<option value="${esc(m.id)}">${esc(m.id)} — ${esc(m.name)}</option>`).join("");
  const picker = unlinked.length
    ? `<div class="link-row"><select class="f" id="mlPicker">${pickOpts}</select>
        <button class="btn ghost" id="mlLinkBtn">Link</button></div>`
    : '<p class="placeholder">All mitigations linked.</p>';

  return `<fieldset class="section ml-section">
    <legend class="slabel">Mitigations (${links.length})</legend>${cards}${picker}</fieldset>`;
}

// References — repeatable BORDERED cards bound to state.draft.references (same grammar
// as weaknesses). Each card holds a title + a url. First card expanded; the rest collapse
// to a one-line summary (title · url). The section carries the threat.references data-field
// so focusing any input shows that field's rail guidance; the per-item title/url inputs have
// no style entry of their own, so they degrade to no hint.
function referencesEditor() {
  const refs = state.draft.references || [];
  const open = state.refOpen || new Set();
  const cards = refs.map((r, i) => {
    const isOpen = open.has(i);
    const summary = `${esc(r.title || "—")}${(r.url || "").trim() ? " · " + esc((r.url || "").trim().slice(0, 48)) : ""}`;
    const head = `<div class="ecard-head" data-ridx="${i}">
        <button type="button" class="card-toggle ref-toggle" data-ridx="${i}" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${isOpen ? "Reference " + (i + 1) : summary}</span>
        <button type="button" class="cardx ref-remove" data-ridx="${i}" title="Remove reference">×</button>
      </div>`;
    if (!isOpen) return `<div class="ecard ref-card collapsed" data-ridx="${i}">${head}</div>`;
    return `<div class="ecard ref-card open" data-ridx="${i}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-field="title">
        <h3 class="slabel">Title</h3>
        <input class="f ref-title" data-ridx="${i}" value="${esc(r.title || "")}" placeholder="source name, e.g. OWASP LLM01: Prompt Injection">
      </div>
      <div class="field" data-field="url">
        <h3 class="slabel">URL</h3>
        <input class="f ref-url" data-ridx="${i}" id="ref_url_${i}" value="${esc(r.url || "")}" placeholder="https://…">
      </div>
      </div>
    </div>`;
  }).join("");
  return `<fieldset class="field section ref-section" data-entity="threat" data-field="references">
    <legend class="slabel">References <span class="sub">— sources and prior art</span></legend>
    ${cards}
    <button class="btn ghost" id="addReference">+ Add reference</button></fieldset>`;
}

// --------------------------------------------------------------- wiring ---- //
function wireDetail() {
  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.onclick = enterEdit;
  const deleteBtn = document.getElementById("deleteBtn");
  if (deleteBtn) deleteBtn.onclick = deleteThreat;
  // Read view only: breadcrumb clears the selection; mitigation cards jump across.
  const crumbBtn = document.querySelector("#main .crumb-type");
  if (crumbBtn) crumbBtn.onclick = clearThreatSelection;
  document.querySelectorAll("#main [data-jmit]").forEach(el =>
    el.onclick = () => jumpToMit(el.dataset.jmit));
  // Read view only: a gap chip enters the editor and jumps to that field.
  document.querySelectorAll("#main .gap-chip").forEach(chip =>
    chip.onclick = () => { state.focusField = chip.dataset.gapField; enterEdit(); });
  // Read view only: the Git history section (selectors miss in edit mode).
  wireHistory(threatHistoryCfg());
  const cancelBtn = document.getElementById("cancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => {
    // A brand-new, never-saved threat has no server record — drop the selection on cancel.
    const wasNew = state.draft && state.draft.isNew;
    state.editing = false; state.draft = null; state.view = "structure";
    state.railMode = "preview"; state.guidance = null;
    if (wasNew) { state.selected = null; state.current = null; renderList(); }
    renderDetail(); renderPreview();
  };
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick = saveThreat;
  if (state.editing) { wireThreatEdit(); wireInlineGuidance(); applyValidation(); }
}

function enterEdit() {
  const t = state.current;
  state.draft = {
    title: t.title || "",
    harm: t.harm || (harmEnum()[0] || ""),
    surface: [...(t.surface || [])],
    source: [...(t.source || [])],
    reachability: t.reachability || "",
    tags: [...(t.tags || [])],
    weaknesses: (t.weaknesses || []).map(w => ({
      component: w.component, text: w.text || "", nature: w.nature || "targeted",
    })),
    references: (t.references || []).map(r => ({ title: r.title || "", url: r.url || "" })),
  };
  // Progressive disclosure: the FIRST repeatable card is expanded, the rest collapse.
  state.wkOpen = new Set((t.weaknesses || []).length ? [0] : []);
  state.mlOpen = new Set((t.mitigations || [])[0] ? [t.mitigations[0].id] : []);
  state.refOpen = new Set((t.references || []).length ? [0] : []);
  state.editing = true;
  state.railMode = "preview"; state.guidance = null;
  renderDetail();
  renderPreview();   // repaint the rail so the Guidance toggle enables
  focusDraftField(); // if a gap chip opened this editor, jump to + focus that field
  validateDraft();   // seed the red/amber channels for the initial draft
}

// Create a brand-new threat: open a blank draft in edit mode. The record is only a
// client-side stub (isNew) until Save, which POSTs it. A new threat starts with no
// weaknesses, so validate/Save stays blocked until at least one is added — correct.
function newThreat() {
  const id = (window.prompt("New threat id (e.g. T-NEW-THREAT):") || "").trim();
  if (!id) return;
  if (state.threats.some(t => t.id === id)) { toast("A threat with that id already exists", true); return; }
  const title = (window.prompt("Title (optional — you can edit it below):") || "").trim();
  const harm0 = harmEnum()[0] || "";
  state.selected = id;
  state.current = {
    id, title, harm: harm0, surface: [], source: [],
    weaknesses: [], reachability: "", mitigations: [], references: [], tags: [],
  };
  state.draft = {
    isNew: true,
    title, harm: harm0, surface: [], source: [],
    reachability: "", tags: [], weaknesses: [], references: [],
  };
  state.wkOpen = new Set(); state.mlOpen = new Set(); state.refOpen = new Set();
  state.editing = true; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  renderList(); renderDetail(); renderPreview();
  validateDraft();
}

// Delete an existing threat after a confirm. Removes its file server-side, then clears
// the selection and refreshes the rail. A never-saved (isNew) threat has no server record.
async function deleteThreat() {
  const id = state.selected;
  if (!id || (state.draft && state.draft.isNew)) return;
  if (!window.confirm(`Delete ${id}? This removes the threat and its mitigation links.`)) return;
  try {
    await api("DELETE", "/threats/" + encodeURIComponent(id));
  } catch (e) { toast(e.message, true); return; }
  await refreshThreatList();
  await refreshHealth();
  state.selected = null; state.current = null; state.draft = null;
  state.editing = false; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  renderList(); renderThreatFacets(); renderDetail(); renderPreview();
  toast("Threat deleted");
}

function wireThreatEdit() {
  const d = state.draft;
  const title = document.getElementById("f_title");
  if (title) title.oninput = () => d.title = title.value;
  const harm = document.getElementById("f_harm");
  if (harm) harm.onchange = () => d.harm = harm.value;
  const reach = document.getElementById("f_reachability");
  if (reach) reach.oninput = () => d.reachability = reach.value;
  const tags = document.getElementById("f_tags");
  if (tags) tags.oninput = () => d.tags = tags.value.split(",").map(s => s.trim()).filter(Boolean);
  document.querySelectorAll("[data-set]").forEach(cb => cb.onchange = () => {
    const set = new Set(d[cb.dataset.set]);
    if (cb.checked) set.add(cb.value); else set.delete(cb.value);
    d[cb.dataset.set] = [...set];
  });
  wireWeaknesses();
  wireMitigations();
  wireReferences();
}

// Mitigation-link cards: link/unlink/strength/rationale are immediate server writes.
function wireMitigations() {
  document.querySelectorAll(".ml-card").forEach(card => {
    const mid = card.dataset.mid;
    const strength = card.querySelector(".ml-strength");
    const rationale = card.querySelector(".ml-rationale");
    const exception = card.querySelector(".ml-exception");
    const persist = () => putMitLink(
      mid, strength ? strength.value : "gating", rationale ? rationale.value : "",
      exception ? exception.value : "",
    );
    if (strength) strength.onchange = persist;
    if (rationale) rationale.onblur = persist;
    if (exception) exception.onblur = persist;
    const unlink = card.querySelector(".ml-unlink");
    if (unlink) unlink.onclick = e => { e.stopPropagation(); unlinkMit(mid); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => {
      if (e.target.closest(".ml-unlink")) return;   // unlink handles itself
      toggleSet(state.mlOpen, mid);
      renderDetail();
    };
  });
  const linkBtn = document.getElementById("mlLinkBtn");
  if (linkBtn) linkBtn.onclick = () => {
    const pick = document.getElementById("mlPicker");
    if (pick && pick.value) linkMit(pick.value);
  };
}

async function refreshCurrent() {
  state.current = await j("/threats/" + encodeURIComponent(state.selected));
}
const mitUrl = mid =>
  "/threats/" + encodeURIComponent(state.selected) + "/mitigations/" + encodeURIComponent(mid);

async function linkMit(mid) {
  try {
    await api("PUT", mitUrl(mid), { strength: "gating", rationale: "" });
    (state.mlOpen || (state.mlOpen = new Set())).add(mid);   // open the freshly linked card
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation linked");
  } catch (e) { toast(e.message, true); }
}
async function unlinkMit(mid) {
  try {
    await api("DELETE", mitUrl(mid));
    if (state.mlOpen) state.mlOpen.delete(mid);
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation unlinked");
  } catch (e) { toast(e.message, true); }
}
async function putMitLink(mid, strength, rationale, exception) {
  try {
    await api("PUT", mitUrl(mid), { strength, rationale, exception: exception || null });
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation link updated");
  } catch (e) { toast(e.message, true); }
}

// Weakness cards edit state.draft.weaknesses in place; add/remove re-renders.
function wireWeaknesses() {
  const d = state.draft;
  document.querySelectorAll(".wk-card").forEach(card => {
    const i = +card.dataset.widx;

    if (comp) comp.onchange = () => d.weaknesses[i].component = comp.value;
    if (text) text.oninput = () => d.weaknesses[i].text = text.value;
    if (nat) nat.onchange = () => d.weaknesses[i].nature = nat.value;
    const rm = card.querySelector(".wk-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.weaknesses.splice(i, 1); shiftWkOpen(i); renderDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => {
      if (e.target.closest(".wk-remove")) return;   // remove handles itself

    d.weaknesses.push({ component: componentEnum()[0] || "", text: "", nature: "targeted" });

// Reference cards edit state.draft.references in place; add/remove re-renders.
function wireReferences() {
  const d = state.draft;
  document.querySelectorAll(".ref-card").forEach(card => {

// --------------------------------------------------- validation channels --- //
// Assemble the full threat the way the server wants it: the draft plus the id and
// the separately-managed pieces (mitigations/references live on state.current).
// Falls back to state.current when not editing, so preview/insights work in read view.
function assembleThreat() {
  const d = state.draft || {};
  const c = state.current || {};
  const pick = (k, dflt) => (d[k] !== undefined ? d[k] : (c[k] !== undefined ? c[k] : dflt));
  return {
    id: c.id,
    title: pick("title", ""),
    harm: pick("harm", undefined),
    surface: pick("surface", []),
    source: pick("source", []),
    weaknesses: pick("weaknesses", []),
    reachability: pick("reachability", ""),
    mitigations: c.mitigations || [],
    references: pick("references", []),
    tags: pick("tags", []),
  };
}

let validateTimer = null;
function scheduleValidate() { clearTimeout(validateTimer); validateTimer = setTimeout(validateDraft, 300); }

// POST the assembled threat; store errors (red, blocking) + advice (amber, soft).
async function validateDraft() {
  if (!state.current) return;
  try {
    const res = await api("POST", "/threats/validate", assembleThreat());
    state.validation = { errors: res.errors || [], advice: res.advice || [] };
  } catch (e) {
    state.validation = { errors: [{ field: "", msg: e.message }], advice: [] };
  }
  applyValidation();
  renderPreview();   // insights strip reads state.validation.advice
}

// An errored field can live inside a collapsed repeatable card, where its own
// .field wrapper is not in the DOM. Mark the collapsed card's head so the error is
// not silently hidden. Covers the threat (weaknesses/references) and mitigation
// (validation/faq) card kinds; clears stale marks first.
function markCollapsedCards(errors) {
  document.querySelectorAll(".ecard.collapsed.has-err").forEach(c => c.classList.remove("has-err"));
  const sel = {
    weaknesses: p => `.wk-card.collapsed[data-widx="${CSS.escape(p)}"]`,
    references: p => `.ref-card.collapsed[data-ridx="${CSS.escape(p)}"]`,
    validation: p => `.validation-card.collapsed[data-idx="${CSS.escape(p)}"]`,
    faq: p => `.faq-card.collapsed[data-idx="${CSS.escape(p)}"]`,
    implementations: p => `.implementation-card.collapsed[data-idx="${CSS.escape(p)}"]`,
  };
  (errors || []).forEach(e => {
    const parts = (e.field || "").split(".");
    if (parts.length < 2) return;
    const make = sel[parts[0]];
    if (!make) return;
    const card = document.querySelector(make(parts[1]));
    if (card) card.classList.add("has-err");
  });
}

// Map a dotted error path to the input's .field wrapper. Root/unmatched -> null.
function fieldEl(path) {
  if (!path) return null;
  const parts = path.split(".");
  if (parts[0] === "weaknesses" && parts.length === 3) {
    return document.querySelector(
      `.wk-card[data-widx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`
    );
  }
  if (parts[0] === "references" && parts.length === 3) {
    // Prefer the specific card's field (visible only when expanded); otherwise
    // fall back to the whole references section so the error still surfaces.
    return document.querySelector(
      `.ref-card[data-ridx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`
    ) || document.querySelector('.field[data-entity="threat"][data-field="references"]');
  }
  if (parts.length === 1) {
    return document.querySelector(`.field[data-entity="threat"][data-field="${CSS.escape(parts[0])}"]`);
  }
  return null;
}

function renderErrorSummary(errors) {
  const el = document.getElementById("errSummary");
  if (!el) return;
  if (!errors.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "block";
  el.innerHTML = `<strong>Fix these before saving:</strong><ul>${errors.map(e =>
    `<li>${e.field ? `<code>${esc(e.field)}</code> — ` : ""}${esc(e.msg)}</li>`).join("")}</ul>`;
}

// Paint the two channels onto the form: errors red (summary + inline), advice amber (inline only).
function applyValidation() {
  const { errors, advice } = state.validation;
  document.querySelectorAll(".fld-msg").forEach(e => e.remove());
  document.querySelectorAll(".field").forEach(f => f.classList.remove("has-err", "has-adv"));

  renderErrorSummary(errors);   // errors — RED — also shown in full at the top

  const place = (item, cls) => {
    const el = fieldEl(item.field);
    if (!el) return;
    el.classList.add(cls === "err" ? "has-err" : "has-adv");
    const msg = document.createElement("div");
    msg.className = "fld-msg " + cls;
    msg.textContent = item.msg;
    el.appendChild(msg);
  };
  errors.forEach(e => place(e, "err"));    // identical text to the summary, inline
  advice.forEach(a => place(a, "adv"));    // amber only, never in the summary, never blocking
  markCollapsedCards(errors);              // surface errors hidden inside collapsed cards

  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.disabled = errors.length > 0 || state.view === "yaml";
}

// --------------------------------------------------------------- save ------ //
async function saveThreat() {
  if (state.view === "yaml") return;                 // YAML view is read-only
  if (state.validation.errors.length) return;        // blocked while errors remain
  const d = state.draft;
  const isNew = !!d.isNew;
  const body = {
    title: d.title,
    harm: d.harm,
    surface: d.surface,
    source: d.source,
    reachability: d.reachability,
    tags: d.tags,
    weaknesses: d.weaknesses,
    references: d.references,
  };
  // A new threat is POSTed as a full record (id required, no links yet); an existing
  // one is PATCHed by id. Duplicate id on create → 409, surfaced in the red channel.
  const isCreate = isNew;
  const url = isCreate ? "/threats" : "/threats/" + encodeURIComponent(state.selected);
  if (isCreate) { body.id = state.selected; body.mitigations = []; }
  const r = await fetch(url, {
    method: isCreate ? "POST" : "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    // Map the server's Pydantic error response back into the RED channel.
    const data = await r.json().catch(() => ({}));
    let errs;
    if (Array.isArray(data.detail)) {
      errs = data.detail.map(e => ({
        field: (e.loc || []).filter(x => x !== "body").join("."),
        msg: e.msg || "invalid",
      }));
    } else {
      errs = [{ field: "", msg: data.detail || ("PATCH " + url + " → " + r.status) }];
    }
    state.validation = { errors: errs, advice: state.validation.advice };
    applyValidation();
    toast("Save blocked — fix the errors", true);
    return;
  }
  const getUrl = "/threats/" + encodeURIComponent(state.selected);
  state.current = await j(getUrl);
  state.editing = false; state.draft = null; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  // Pull the fresh rich list so the rail + facets reflect the create/edit (kept sorted server-side).
  await refreshThreatList();
  state.validation = { errors: [], advice: [] };
  renderList(); renderThreatFacets(); renderDetail(); renderPreview();
  validateDraft();
  showSavedDialog("catalog/threats/" + state.selected + ".yaml");
}

// The write lands in a YAML file; the next step is a pull request. Name the exact
// file (any catalog path) and, when a repo is configured, offer an "Edit on GitHub"
// escape hatch. Shared by the threat editor and the style-guide editor.
function showSavedDialog(path) {
  const repo = (state.config && state.config.repo_url || "").replace(/\/+$/, "");
  const p = esc(path);
  const editLink = repo
    ? `<a href="${esc(repo)}/edit/main/${p}" target="_blank" rel="noopener">Edit on GitHub</a>`
    : "";
  const el = document.getElementById("savedDialog");
  el.innerHTML = `Saved to <code>${p}</code> — commit and open a pull request.
    <div class="sd-actions">${editLink}<button class="sd-close" id="sdClose">Dismiss</button></div>`;
  el.classList.add("show");
  document.getElementById("sdClose").onclick = () => el.classList.remove("show");
}

// ------------------------------------------------------------- right rail -- //
// Threats have no right rail any more: the read view is the canonical surface and
// serves as its own preview, and authoring guidance lives inline under each field
// (see inlineGuidance). This is kept as a thin shim so the many call sites that
// repaint the "right" pane just re-evaluate whether the rail should show at all
// (only the Style-guide screen keeps one).
function renderPreview() {
  applyPreviewVisibility();
}

// ===================================================================== //
// Screen switcher — two screens share the rail | editor | preview panes. //
// ===================================================================== //
function switchScreen(name) {
  state.screen = name;
  document.querySelectorAll("#screens button").forEach(b => b.classList.toggle("on", b.dataset.screen === name));
  // The tab in the top bar names the screen; this eyebrow names what the LIST holds,
  // which is a different noun on Style guide (fields) and Reports (systems).
  const titles = { overview: "Library", threats: "Threats", mitigations: "Mitigations", style: "Fields", reports: "Systems" };
  document.getElementById("railTitle").textContent = titles[name] || "";
  // Overview and Reports have no rail search; Threats/Mitigations/Style all filter.
  const noSearch = name === "overview" || name === "reports";
  document.getElementById("searchWrap").style.display = noSearch ? "none" : "";
  // The faceted filter panel serves Threats + Mitigations + Style; (re)build it per
  // screen so its options stay fresh (schema enums + tags/values present in the data).
  const facets = document.getElementById("facetPanel");
  if (facets) {
    const hasFacets = name === "threats" || name === "mitigations" || name === "style";
    facets.style.display = hasFacets ? "" : "none";
    if (name === "threats") renderThreatFacets();
    else if (name === "mitigations") renderMitFacets();
    else if (name === "style") renderStyleFacets();
  }
  const search = document.getElementById("search");
  if (search) {
    search.placeholder = name === "mitigations" ? "Filter mitigations…"
      : name === "style" ? "Filter fields…" : "Filter threats…";
    search.value = name === "mitigations" ? state.mitFilter
      : name === "style" ? state.styleFilter : state.filter;
  }
  const newBtn = document.getElementById("newThreatBtn");
  if (newBtn) {
    // ＋ New only makes sense on the two entity screens.
    newBtn.style.display = (name === "style" || name === "overview" || name === "reports") ? "none" : "";
    newBtn.title = name === "mitigations" ? "Create a new mitigation" : "Create a new threat";
  }
  renderRail(); renderMain(); renderRight();
  if (name === "overview") loadOverview();   // refresh the dashboard on each entry
  if (name === "reports") loadReports();
}
function renderRail() {
  if (state.screen === "overview") return renderOverviewRail();
  if (state.screen === "reports") return renderReportsRail();
  if (state.screen === "style") return renderStyleRail();
  if (state.screen === "mitigations") return renderMitRail();
  return renderList();
}
function renderMain() {
  if (state.screen === "overview") return renderOverviewMain();
  if (state.screen === "reports") return renderReportsMain();
  if (state.screen === "style") return renderStyleDetail();
  if (state.screen === "mitigations") return renderMitDetail();
  return renderDetail();
}
function renderRight() {
  if (state.screen === "overview") return renderOverviewRight();
  if (state.screen === "reports") { applyPreviewVisibility(); return renderReportExport(); }
  if (state.screen === "style") return renderStylePreview();
  if (state.screen === "mitigations") return renderMitPreview();
  return renderPreview();
}

// The right rail duplicates the read view in READ mode, so show it only when it adds
// value: the live Preview/Guidance while editing a threat or a mitigation, or the
// Style-guide screen's live author preview. Otherwise collapse its grid column (see
// body.no-preview). Called from every right-rail render, so it tracks each mode change.
function previewVisible() {
  // The right rail earns its column when it shows a genuinely DIFFERENT artifact from
  // the main pane: on Style guide, what a threat author sees; on Reports, what the
  // product team receives. Threats and mitigations read and edit on ONE surface — the
  // read view IS the preview, so there is nothing for a third pane to duplicate.
  return state.screen === "style" || state.screen === "reports";
}
function applyPreviewVisibility() {
  document.body.classList.toggle("no-preview", !previewVisible());
}

// ===================================================================== //
// Overview screen — a read-only dashboard: counts, style-guide coverage,     //
// gaps to review, catalog warnings, and recent git activity. Reads five      //
// sources via Promise.allSettled, so one failing source (most likely git     //
// being unavailable) never blanks the rest of the page. Nothing here blocks. //
// ===================================================================== //
async function loadOverview() {
  const [h, cov, warn, act] = await Promise.allSettled([
    j("/health/library"), j("/style-guide/coverage"), j("/health/warnings"), j("/history/recent?limit=15"),
  ]);
  state.health = h.status === "fulfilled" ? h.value : (state.health || { stats: {}, issues: {}, issue_count: 0 });
  state.coverage = cov.status === "fulfilled" ? cov.value : state.coverage;
  state.warnings = warn.status === "fulfilled" ? warn.value.warnings : [];
  state.recentActivity = act.status === "fulfilled" ? act.value : { available: false, commits: [] };
  if (h.status === "rejected") toast((h.reason && h.reason.message) || "Failed to load health", true);
  if (state.screen === "overview") { renderOverviewMain(); renderOverviewRight(); }
}

function renderOverviewRail() {
  const el = document.getElementById("list");
  el.innerHTML = '<div class="ov-rail-legend">A snapshot of the library — counts, style-guide coverage, and soft gaps worth a look. Nothing here blocks a save.</div>';
  document.getElementById("count").textContent = "";
}

function renderOverviewMain() {
  const m = document.getElementById("main");
  if (!state.health) { m.innerHTML = '<div class="empty">Loading overview…</div>'; return; }
  m.innerHTML = overviewHtml();
  wireOverview();
}

function renderOverviewRight() {
  // The Overview has no right rail (previewVisible() is false); this just collapses
  // the third grid column. The coverage-band legend now lives inline on the screen.
  applyPreviewVisibility();
}

// The gap groups the health endpoint reports, in review order. "No gating mitigation"
// is a per-threat lint, not part of /health/library, so it is intentionally absent.
const OV_GAP_GROUPS = [
  { key: "threats_missing_weaknesses", label: "Missing weaknesses", desc: "no architectural conditions authored yet" },
  { key: "threats_missing_harm", label: "Missing harm", desc: "no harm classified yet" },
  { key: "threats_without_mitigation", label: "No linked mitigation", desc: "no control linked yet" },
  { key: "dangling_mitigation_links", label: "Dangling links", desc: "a link points at a missing mitigation" },
];

// Categories `catalog_warnings_structured()` can emit — mirrors keel/catalog.py. Each
// carries the same one-line explanation the gap groups do: a bare label and a count
// ("Unused vocabulary 1") says nothing about what was found or why it matters.
const OV_WARNING_GROUPS = [
  { key: "over_graded_strength", label: "Over-graded links",
    desc: "the link is graded gating, but the mitigation it points at is not a gating control" },
  { key: "missing_references", label: "Missing references",
    desc: "no source recorded — nothing maps the threat to CWE, CAPEC, OWASP-LLM or ATLAS" },
  { key: "unused_nature", label: "Unused vocabulary",
    desc: "a term the vocabulary offers that no entry in the catalog actually uses" },
];

// Long id lists are unreadable as one wall of chips. Show a run, park the rest behind
// one click. The cut is announced, never silent.
const OV_CHIP_LIMIT = 12;
const OV_ACTIVITY_CHIP_LIMIT = 6;   // a commit list is a timeline, not an index
function chipRow(chips, limit) {
  const n = limit || OV_CHIP_LIMIT;
  if (chips.length <= n) return `<div class="ov-chips">${chips.join("")}</div>`;
  return `<div class="ov-chips">${chips.slice(0, n).join("")}
    <span class="ov-rest hide">${chips.slice(n).join("")}</span>
    <button type="button" class="ov-more" data-ov-more="1">show ${chips.length - n} more</button>
  </div>`;
}

function overviewHtml() {
  const h = state.health || {};
  const stats = h.stats || {};
  const issues = h.issues || {};
  const cov = state.coverage || {};

  const stat = (num, lbl) => `<div class="ov-stat"><div class="num">${num == null ? "—" : num}</div><div class="lbl">${esc(lbl)}</div></div>`;
  const counts = `<div class="ov-stats">
    ${stat(stats.threats, "Threats")}
    ${stat(stats.mitigations, "Mitigations")}
    ${stat(stats.threat_mitigation_links, "Links")}
  </div>`;

  const overall = (cov.overall != null) ? cov.overall : h.style_guide_coverage;
  const covRows = (cov.entities || []).map(e => {
    const pct = e.overall == null ? 0 : e.overall;
    return `<div class="ov-cov-row"><span class="ent">${esc(e.entity_type)}</span>
      <span class="badge cov ${covClass(pct)}">${pct}%</span></div>`;
  }).join("");
  const coverage = `<div class="ov-cov-overall">
      <span class="pct">${overall == null ? "—" : overall + "%"}</span>
      <span class="lbl">overall style-guide coverage</span>
    </div>${covRows}`;

  const chip = fullId => {
    const tid = fullId.split("::")[0];
    return `<span class="ov-chip" data-threat="${esc(tid)}" title="Open ${esc(tid)}">${esc(fullId)}</span>`;
  };
  const gapCards = OV_GAP_GROUPS.map(g => {
    const ids = issues[g.key] || [];
    if (!ids.length) return "";
    return `<div class="card ov-gap-group">
      <div class="ov-gap-head"><span class="gname">${esc(g.label)}</span><span class="badge soft">${ids.length}</span></div>
      <div class="ov-gap-desc">${esc(g.desc)}</div>
      ${chipRow(ids.map(chip))}
    </div>`;
  }).join("");
  const gaps = (h.issue_count === 0)
    ? `<div class="ov-clean"><span class="ok-i"></span>
        <p><b>Nothing flagged.</b> Every threat has weaknesses, a classified harm, and at least one linked mitigation — and no link dangles.</p></div>`
    : gapCards;

  // A compact multi-segment bar (verified/draft/unset or shared/local/none) with a
  // legend below it; legend entries that carry filterKey/filterValue are clickable —
  // they jump to Mitigations with that facet value pre-selected (see wireOverview).
  const bar = (segments, legendItems) => {
    const total = segments.reduce((s, x) => s + x.n, 0) || 1;
    const segHtml = segments.map(s => `<div class="ov-bar-seg ${s.cls}" style="width:${(100 * s.n / total).toFixed(1)}%"></div>`).join("");
    const legend = legendItems.map(l => `<span ${l.filterKey ? `data-ov-filter="${esc(l.filterKey)}" data-ov-value="${esc(l.filterValue)}" style="cursor:pointer"` : ""}><span class="dot" style="background:var(${l.color})"></span>${esc(l.label)}: ${l.n}</span>`).join("");
    return `<div class="ov-bar">${segHtml}</div><div class="ov-bar-legend">${legend}</div>`;
  };

  const sc = h.mitigation_status_counts || { draft: 0, verified: 0, unset: 0 };
  const draftVerified = `${bar(
    [{ n: sc.verified, cls: "verified" }, { n: sc.draft, cls: "draft" }, { n: sc.unset, cls: "unset" }],
    [
      { label: "verified", n: sc.verified, color: "--green", filterKey: "status", filterValue: "verified" },
      { label: "draft", n: sc.draft, color: "--amber", filterKey: "status", filterValue: "draft" },
      { label: "unset", n: sc.unset, color: "--navy-200" },
    ]
  )}`;

  const ic = h.implementation_coverage_counts || { shared: 0, local_only: 0, none: 0 };
  const implCoverage = `${bar(
    [{ n: ic.shared, cls: "shared" }, { n: ic.local_only, cls: "local" }, { n: ic.none, cls: "none" }],
    [
      { label: "shared", n: ic.shared, color: "--green", filterKey: "implementations", filterValue: "shared" },
      { label: "local only", n: ic.local_only, color: "--amber" },
      { label: "none", n: ic.none, color: "--navy-200", filterKey: "implementations", filterValue: "none" },
    ]
  )}`;

  // Warnings/activity chips reuse .ov-chip but carry data-warn-* (not data-threat), so
  // wireOverview can tell them apart from the Gaps chips above (threats only).
  const warnChip = w =>
    `<span class="ov-chip" data-warn-entity="${esc(w.entity_type)}" data-warn-id="${esc(w.entity_id)}" title="Open ${esc(w.entity_id)}">${esc(w.entity_id)}</span>`;
  const warningsByCat = {};
  for (const w of (state.warnings || [])) (warningsByCat[w.category] || (warningsByCat[w.category] = [])).push(w);
  const warningCards = OV_WARNING_GROUPS.map(g => {
    const items = warningsByCat[g.key] || [];
    if (!items.length) return "";
    // A warning about the catalog as a whole names no entity, so it has no chip to
    // click — its own message is the only thing that carries the finding.
    const withId = items.filter(w => w.entity_id);
    const body = withId.length
      ? chipRow(withId.map(warnChip))
      : items.map(w => `<p class="ov-warn-msg">${esc(w.message)}</p>`).join("");
    return `<div class="card ov-gap-group">
      <div class="ov-gap-head"><span class="gname">${esc(g.label)}</span><span class="badge soft">${items.length}</span></div>
      <div class="ov-gap-desc">${esc(g.desc)}</div>
      ${body}
    </div>`;
  }).join("");
  const warningCount = (state.warnings || []).length;
  const warningsSection = warningCount
    ? warningCards
    : `<div class="ov-clean"><span class="ok-i"></span><p><b>Nothing flagged.</b> No advisory warnings across the catalog.</p></div>`;

  const act = state.recentActivity || { available: false, commits: [] };
  // A sweeping commit touches every card in the catalog, and dumping all 71 ids inline
  // buried the message that says what the commit actually did. The message is the row;
  // the ids are a short, expandable tail beneath it.
  const activityRows = act.available && act.commits.length
    ? act.commits.map(c => {
        const ents = (c.entities || []).map(e =>
          `<span class="ov-chip" data-warn-entity="${esc(e.entity_type)}" data-warn-id="${esc(e.entity_id)}">${esc(e.entity_id)}</span>`);
        return `<div class="ov-activity-row">
          <div class="ov-activity-line">
            <span class="ov-activity-msg">${esc(c.message)}</span>
            <span class="ov-activity-meta">${esc(c.author)} · ${esc((c.date || "").slice(0, 10))} · ${ents.length} ${ents.length === 1 ? "entry" : "entries"}</span>
          </div>
          ${ents.length ? chipRow(ents, OV_ACTIVITY_CHIP_LIMIT) : ""}
        </div>`;
      }).join("")
    : `<p class="placeholder">${act.available ? "No recent changes." : "Git history unavailable."}</p>`;

  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">O</div>
      <div class="dtitle">
        <h2>Library overview</h2>
        <div class="dsub">A snapshot to review — nothing here blocks a save.</div>
      </div>
    </div>
    <div class="ov-grid2">
      <div>
        ${readsec("Counts", counts)}
        ${readsec("Draft / verified", draftVerified)}
      </div>
      <div>
        ${readsec("Style-guide coverage", coverage)}
        ${readsec("Implementation coverage", implCoverage)}
      </div>
    </div>
    ${readsec("Gaps to review", gaps, h.issue_count ? `— ${h.issue_count} across the library` : "")}
    ${readsec("Catalog warnings", warningsSection, warningCount ? `— ${warningCount} across the library` : "")}
    ${readsec("Recent activity", activityRows)}
  </div>`;
}

function wireOverview() {
  document.querySelectorAll(".ov-chip[data-threat]").forEach(c => c.onclick = () => overviewOpenThreat(c.dataset.threat));
  document.querySelectorAll(".ov-chip[data-warn-entity]").forEach(c => c.onclick = () => overviewOpenEntity(c.dataset.warnEntity, c.dataset.warnId));
  document.querySelectorAll("[data-ov-filter]").forEach(el => el.onclick = () => overviewOpenMitigationsFiltered(el.dataset.ovFilter, el.dataset.ovValue));
  // Reveal a capped chip list in place; the button has done its job and goes away.
  document.querySelectorAll("[data-ov-more]").forEach(b => b.onclick = () => {
    const rest = b.parentElement.querySelector(".ov-rest");
    if (rest) rest.classList.remove("hide");
    b.remove();
  });
}

// Open a threat from an overview gap chip: cross to the Threats screen, then select it.
function overviewOpenThreat(id) {
  switchScreen("threats");
  select(id);
}

// Open either a threat or a mitigation from a Catalog-warnings/Recent-activity chip.
function overviewOpenEntity(entityType, id) {
  if (entityType === "mitigations" || entityType === "mitigation") { switchScreen("mitigations"); selectMit(id); return; }
  overviewOpenThreat(id);
}

// Jump to Mitigations with one facet value pre-selected (a Draft/verified or
// Implementation-coverage legend entry). switchScreen("mitigations") already
// re-renders the facet panel + rail from current state, so setting the facet first
// is all this needs.
function overviewOpenMitigationsFiltered(facetKey, value) {
  const sel = state.mitFacets[facetKey];
  if (!sel) return;
  sel.clear();
  sel.add(value);
  switchScreen("mitigations");
}

// ===================================================================== //
// Reports screen — a read-only archive of assessment runs. Reports are    //
// written to disk by the assessment skill, never edited here, so this     //
// screen has no draft/save flow: load, render, copy.                      //
// ===================================================================== //
// Three bands, matching keel/schemas/report.py. Findings are one ranked list rather
// than an "important" / "lower severity" split: with three levels the split put a
// single band on one side of a heading and two on the other, and it made the same card
// render under two different framings — the spine already carries the ranking.
const SEVERITY_RANK = ["high", "medium", "low"];

async function loadReports() {
  try {
    state.reportsList = (await j("/reports")).reports;
  } catch (e) {
    toast(e.message, true);
    state.reportsList = [];
  }
  if (state.screen === "reports") { renderReportsRail(); renderReportsMain(); }
}

function renderReportsRail() {
  const el = document.getElementById("list");
  const items = state.reportsList || [];
  el.innerHTML = items.length ? items.map(s => {
    const sel = state.reportSelected && state.reportSelected.system_id === s.system_id;
    const plural = s.report_count === 1 ? "report" : "reports";
    return `<div class="row ${sel ? "active" : ""}" data-system="${esc(s.system_id)}">
      <span class="rid">${esc(s.system_id)}</span>
      <span class="rtitle">${esc(s.system_name)} · ${s.report_count} ${plural}${s.has_delta ? " · delta" : ""}</span>
    </div>`;
  }).join("") : '<div class="empty" style="margin-top:40px">No reports yet.</div>';
