<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel · GenAI threat model</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --tint: #f6f8fc;
    --border: #dfe3ec; --border2: #eef1f7;
    --navy-900: #17203a; --navy-800: #232d4a; --navy-700: #38415f; --navy-600: #4a5570;
    --navy-500: #6b7690; --navy-400: #97a0b5; --navy-200: #d7dce8; --navy-100: #eef1f7;
    --crimson-700: #b81f42; --crimson-600: #d6294e; --crimson-200: #f6c9d3; --crimson-50: #fdeef1;
    --amber: #e0a021; --green: #1f9d57;
    /* one spacing scale (multiples of 4/8) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
    --field-gap: 24px; --section-gap: 44px; --input-h: 38px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--navy-900);
    font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 320px 1fr 360px; height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ------ left rail ------ */
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  header {
    padding: 15px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  header .count { color: var(--navy-400); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 9px 11px; background: var(--tint); color: var(--navy-900);
    border: 1px solid var(--border); border-radius: 9px; outline: none; font-size: 13px;
  }
  .search input:focus { border-color: var(--crimson-600); background: #fff; }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  .row { padding: 11px 15px; border-bottom: 1px solid var(--border2); display: flex; flex-direction: column; gap: 3px; }
  .row:hover { background: var(--tint); }
  .row.active { background: var(--crimson-50); box-shadow: inset 3px 0 0 var(--crimson-600); }
  .row .rid { font-size: 11px; color: var(--navy-400); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .row .rtitle { font-size: 13px; color: var(--navy-900); }

  /* ------ badges ------ */
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .badge { font-size: 10px; padding: 1px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .badge.soft { background: var(--navy-100); color: var(--navy-600); font-weight: 500; border-radius: 10px; }
  .badge.type { background: var(--navy-200); color: var(--navy-700); }
  .badge.harm { background: var(--crimson-600); color: #fff; }
  .badge.tag { background: #eaf4ee; color: var(--green); }

  /* ------ center editor ------ */
  main { overflow-y: auto; padding: 30px 40px; }
  .empty { color: var(--navy-400); margin-top: 22vh; text-align: center; }
  .detail { max-width: 720px; }

  /* ------ editor section tiers (fieldset/legend) ------ */
  /* SECTION = fieldset + legend, no border; separated by whitespace, section gap > field gap */
  .detail fieldset { border: 0; margin: var(--section-gap) 0 0; padding: 0; min-width: 0; }
  .detail fieldset > legend.slabel {
    display: block; width: 100%; float: none; padding: 0 0 8px; margin: 0;
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--navy-800); font-weight: 700;
    border-bottom: 1px solid var(--border2); margin-bottom: 12px;
  }
  .detail fieldset > legend.slabel .sub { font-weight: 400; text-transform: none; color: var(--navy-400); }
  /* subsection label inside a repeatable card — one type-step down, no border */
  .ecard .field > .slabel { font-size: 11px; border: 0; padding: 0; margin: 0 0 6px; }
  .ecard .field + .field { margin-top: var(--field-gap); }
  input.f, select.f { min-height: var(--input-h); }
  .dhead { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 20px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .dicon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; font-size: 20px; background: var(--crimson-600); }
  .dhead .dtitle { flex: 1; min-width: 0; }
  .dhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .dhead .did { font-family: ui-monospace, monospace; color: var(--navy-400); font-size: 12px; margin-top: 4px; }
  .dhead .hbadges { margin-top: 8px; }
  .hactions { display: flex; gap: 8px; flex-shrink: 0; }
  section { margin-top: 24px; }
  h3.slabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--navy-700); margin: 0 0 9px; font-weight: 700; }
  .slabel .sub { font-weight: 400; text-transform: none; color: var(--navy-400); }
  .prose { white-space: pre-wrap; color: var(--navy-700); font-size: 14px; line-height: 1.6; }
  .warn { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  .placeholder { color: var(--navy-400); font-style: italic; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px; background: #fff; }
  .card .chead { display: flex; align-items: center; gap: 8px; }
  .card .cid { font-family: ui-monospace, monospace; font-size: 11px; color: var(--navy-400); }
  .card .ctitle { font-weight: 600; color: var(--navy-900); font-size: 14px; }
  .card .rationale { margin-top: 7px; color: var(--navy-500); font-size: 13px; font-style: italic; white-space: pre-wrap; }
  .card .cdesc { margin-top: 6px; color: var(--navy-600); font-size: 13px; white-space: pre-wrap; }
  ul.plain { margin: 6px 0 0; padding-left: 0; list-style: none; }
  ul.plain li { border-left: 2px solid var(--navy-200); padding: 3px 0 3px 10px; margin-bottom: 7px; color: var(--navy-700); }
  ul.plain li .meta { font-size: 11px; color: var(--navy-400); text-transform: uppercase; letter-spacing: .05em; }

  /* ------ read view (per-section surfaces, breadcrumb, omit-empty) ------ */
  /* A read/document view, so each populated section sits on its own subtle surface,
     unlike the edit form (whose only heavy container is the repeatable-card border). */
  .readsec { background: var(--tint); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .readsec > h3.slabel { margin: 0 0 9px; }
  .readsec .prose { color: var(--navy-800); }
  .readsec .card { background: #fff; }
  .notauthored { color: var(--navy-400); font-size: 12px; font-style: italic; margin: 16px 0 0; }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy-400); margin-bottom: 12px; }
  .crumb-type { border: none; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--navy-500); }
  .crumb-type:hover { color: var(--crimson-600); text-decoration: underline; }
  .crumb-sep { color: var(--navy-400); }
  .crumb-id { font-family: ui-monospace, "SFMono-Regular", monospace; color: var(--navy-500); }
  /* A card that jumps to a linked entity on click. */
  .card.jrow { cursor: pointer; transition: background .12s, border-color .12s; }
  .card.jrow:hover { background: var(--crimson-50); border-color: var(--crimson-200); }

  /* ------ buttons ------ */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid transparent; background: none; }
  .btn.primary { background: var(--crimson-600); color: #fff; }
  .btn.primary:hover { background: var(--crimson-700); }
  .btn.primary:disabled { opacity: .5; }
  .btn.ghost { background: var(--navy-100); color: var(--navy-700); }
  .btn.ghost:hover { background: var(--navy-200); }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  /* ------ inputs ------ */
  input.f, textarea.f, select.f {
    width: 100%; border: 1px solid var(--navy-200); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 14px; color: var(--navy-900); background: #fff; outline: none;
  }
  input.f:focus, textarea.f:focus, select.f:focus { border-color: var(--crimson-600); box-shadow: 0 0 0 3px var(--crimson-50); }
  textarea.f { resize: vertical; line-height: 1.55; }
  .titlein { font-size: 19px; font-weight: 700; }
  .checkset { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkset label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border: 1px solid var(--navy-200); border-radius: 8px; font-size: 13px; cursor: pointer; background: #fff;
  }
  .checkset label:hover { border-color: var(--crimson-200); }
  .checkset input { accent-color: var(--crimson-600); }
  .hint { color: var(--navy-400); font-size: 12px; margin-top: 4px; }

  /* ------ repeatable editor cards (weaknesses, mitigation links) ------ */
  /* The card border is the ONLY heavy container: surface fill + border + radius + padding. */
  .ecard { position: relative; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--tint); }
  .ecard-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; }
  .ecard.collapsed .ecard-head { padding: 9px 12px; }
  .ecard-body { padding: 2px 14px 14px; }
  .ecard-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--navy-700); font-weight: 600; font-family: ui-monospace, "SFMono-Regular", monospace; }
  .card-toggle { border: none; background: none; color: var(--navy-500); font-size: 11px; line-height: 1; padding: 2px 3px; }
  .card-toggle:hover { color: var(--navy-800); }
  .ecard .field + .field { margin-top: var(--field-gap); }
  .cardx { border: none; background: none; color: var(--navy-400); font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .cardx:hover { background: var(--crimson-50); color: var(--crimson-600); }
  .link-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .link-row select { flex: 1; }

  /* ------ inline style-guide bar ------ */
  .field { position: relative; }
  /* one muted ~12px single-line hint under each label; row height reserved so fields align */
  .sg-hint { color: var(--navy-500); font-size: 12px; line-height: 1.4; margin: 0 0 6px; min-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-panel { display: none; margin-top: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--navy-200); border-radius: 8px; font-size: 12px; }
  .sg-panel.show { display: block; }
  .sg-sec { margin-bottom: 8px; }
  .sg-sec:last-child { margin-bottom: 0; }
  .sg-k { display: block; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10px; color: var(--navy-600); margin-bottom: 3px; }
  .sg-panel ul { margin: 0; padding-left: 16px; color: var(--navy-600); }
  .sg-panel ul li { margin-bottom: 2px; }
  .sg-ex { color: var(--navy-700); font-style: italic; margin: 0 0 5px; }

  /* ------ right preview ------ */
  #preview { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; }
  #preview .ptitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--navy-400); font-weight: 700; margin: 0 0 12px; }

  /* ------ right-rail mode toggle (Preview | Guidance) ------ */
  .rail-modes { display: inline-flex; border: 1px solid var(--navy-200); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .rail-modes button { border: none; background: #fff; color: var(--navy-600); font-size: 12px; font-weight: 600; padding: 6px 14px; }
  .rail-modes button.on { background: var(--navy-800); color: #fff; }
  .rail-modes button:disabled { opacity: .4; cursor: default; }
  .rail-guide .rg-field { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy-400); font-weight: 700; margin: 0 0 8px; }
  .rail-guide .rg-field b { color: var(--navy-800); }
  .rail-guide .sg-hint { white-space: normal; min-height: 0; margin-bottom: 10px; color: var(--navy-600); }
  .rail-guide .sg-panel { display: block; margin-top: 0; }

  /* ------ toast ------ */
  .toast { position: fixed; bottom: 20px; right: 22px; background: var(--navy-900); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(20,30,60,.2); opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(8px); pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--crimson-700); }

  /* ------ validation channels ------ */
  .err-summary { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 10px 14px; margin: 16px 0 4px; font-size: 13px; }
  .err-summary strong { display: block; margin-bottom: 5px; }
  .err-summary ul { margin: 0; padding-left: 18px; }
  .err-summary code { font-family: ui-monospace, monospace; font-size: 12px; }
  .fld-msg { font-size: 12px; margin-top: 5px; line-height: 1.4; }
  .fld-msg.err { color: var(--crimson-700); }
  .fld-msg.adv { color: var(--amber); }
  .field .slabel, .dtitle .did { position: relative; }
  .field.has-err > .slabel::after, .field.has-adv > .slabel::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .field.has-err > .slabel::after { background: var(--crimson-600); }
  .field.has-adv > .slabel::after { background: var(--amber); }
  /* The title/name field has no .slabel — hang its dot off the .did line instead. */
  .dtitle.field.has-err .did::after, .dtitle.field.has-adv .did::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .dtitle.field.has-err .did::after { background: var(--crimson-600); }
  .dtitle.field.has-adv .did::after { background: var(--amber); }
  /* A collapsed repeatable card hiding an errored field still shows an error marker. */
  .ecard.collapsed.has-err { border-color: var(--crimson-200); }
  .ecard.collapsed.has-err .ecard-sum::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--crimson-600); margin-left: 8px; vertical-align: middle;
  }

  /* ------ view toggle ------ */
  .vtoggle { display: inline-flex; border: 1px solid var(--navy-200); border-radius: 8px; overflow: hidden; }
  .vtoggle button { border: none; background: #fff; color: var(--navy-600); font-size: 12px; font-weight: 600; padding: 6px 11px; }
  .vtoggle button.on { background: var(--navy-800); color: #fff; }
  textarea.yaml-view { width: 100%; min-height: 60vh; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 13px; line-height: 1.5; color: var(--navy-900); background: var(--tint); border: 1px solid var(--navy-200); border-radius: 8px; padding: 12px 14px; resize: vertical; margin-top: 16px; }

  /* ------ preview + insights ------ */
  #preview .pv-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; color: var(--navy-900); }
  #preview .pv-harm .badge { vertical-align: middle; }
  #preview .pv-sec { margin-top: 14px; }
  #preview .pv-k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy-400); font-weight: 700; margin: 0 0 4px; }
  #preview .pv p { margin: 0; color: var(--navy-700); }
  #preview .pv ul { margin: 4px 0 0; padding-left: 16px; color: var(--navy-700); }
  #preview .pv .carve { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 8px 11px; font-size: 13px; }
  .insights { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px; }
  .insights .ptitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--navy-400); font-weight: 700; margin: 0 0 8px; }
  .insights ul { margin: 0; padding-left: 16px; }
  .insights li { color: var(--amber); font-size: 12px; margin-bottom: 4px; }
  .insights .ok { color: var(--green); font-size: 12px; }

  /* ------ saved dialog ------ */
  .saved-dialog { position: fixed; bottom: 20px; right: 22px; max-width: 340px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--green); color: var(--navy-800); padding: 13px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(20,30,60,.18); z-index: 60; display: none; }
  .saved-dialog.show { display: block; }
  .saved-dialog code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--navy-900); }
  .saved-dialog .sd-actions { margin-top: 10px; display: flex; gap: 12px; align-items: center; }
  .saved-dialog a { color: var(--crimson-600); font-weight: 600; text-decoration: none; }
  .saved-dialog a:hover { text-decoration: underline; }
  .saved-dialog .sd-close { margin-left: auto; border: none; background: none; color: var(--navy-400); font-size: 12px; }

  /* ------ screen switcher ------ */
  .screens { display: flex; }
  .screens button { flex: 1; border: none; background: var(--tint); color: var(--navy-500); font-size: 12px; font-weight: 600; padding: 10px 8px; border-bottom: 2px solid var(--border); }
  .screens button.on { background: var(--panel); color: var(--navy-900); border-bottom-color: var(--crimson-600); }

  /* ------ style-guide field tree ------ */
  .sg-group { padding: 9px 15px 5px; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--navy-500); font-weight: 700; background: var(--tint); border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
  .sg-frow { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  .sg-frow .fname { font-size: 13px; color: var(--navy-800); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .badge.cov { font-variant-numeric: tabular-nums; }
  .badge.cov.c-hi { background: #eaf4ee; color: var(--green); }
  .badge.cov.c-mid { background: #fdf3e0; color: var(--amber); }
  .badge.cov.c-lo { background: var(--crimson-50); color: var(--crimson-700); }
  .badge.orphan { background: var(--navy-200); color: var(--navy-600); }

  /* ------ style-guide bar editor ------ */
  .slot-list { list-style: none; margin: 6px 0 0; padding: 0; }
  .slot-list li { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .slot-list li input { flex: 1; }
  .slotcount { color: var(--navy-400); font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  #preview .sg-fieldwrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px; background: var(--tint); }
  #preview .sg-fieldwrap .f { background: #fff; }

  /* ------ overview screen ------ */
  .ov-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .ov-stat { flex: 1; min-width: 120px; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: #fff; }
  .ov-stat .num { font-size: 28px; font-weight: 700; color: var(--navy-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ov-stat .lbl { font-size: 12px; color: var(--navy-500); margin-top: 3px; }
  .ov-cov-overall { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .ov-cov-overall .pct { font-size: 24px; font-weight: 700; color: var(--navy-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ov-cov-overall .lbl { font-size: 12px; color: var(--navy-500); }
  .ov-cov-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border2); }
  .ov-cov-row:last-child { border-bottom: none; }
  .ov-cov-row .ent { font-size: 13px; color: var(--navy-700); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .ov-gap-group { margin-bottom: 10px; }
  .ov-gap-head { display: flex; align-items: center; gap: 8px; }
  .ov-gap-head .gname { font-weight: 600; color: var(--navy-800); font-size: 14px; }
  .ov-gap-desc { color: var(--navy-500); font-size: 12px; margin: 4px 0 9px; }
  .ov-chips { display: flex; flex-wrap: wrap; }
  .ov-chip { display: inline-flex; align-items: center; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 12px;
    padding: 3px 9px; border-radius: 6px; background: var(--navy-100); color: var(--navy-700); border: 1px solid var(--border);
    cursor: pointer; margin: 0 6px 6px 0; }
  .ov-chip:hover { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); }
  .ov-clean { display: flex; align-items: flex-start; gap: 10px; background: #eaf4ee; border: 1px solid #bfe3cd;
    color: var(--green); border-radius: 10px; padding: 14px 16px; }
  .ov-clean .ok-i { font-size: 18px; line-height: 1.3; }
  .ov-clean p { margin: 0; color: var(--navy-700); font-size: 13px; line-height: 1.5; }
  .ov-clean p b { color: var(--green); }
  .ov-rail-legend { padding: 16px 15px; color: var(--navy-500); font-size: 13px; line-height: 1.6; }
  .ov-legend .ov-leg-k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy-400); font-weight: 700; margin: 0 0 6px; }
  .ov-legend p { color: var(--navy-600); font-size: 12px; margin: 0 0 4px; line-height: 1.7; }
</style>
</head>
<body>
<aside>
  <nav class="screens" id="screens">
    <button data-screen="overview" class="on">Overview</button>
    <button data-screen="threats">Threats</button>
    <button data-screen="mitigations">Mitigations</button>
    <button data-screen="style">Style guide</button>
  </nav>
  <header>
    <h1 id="railTitle">Keel · Threats</h1>
    <span class="count" id="count"></span>
    <button class="btn sm ghost" id="newThreatBtn" title="Create a new threat" style="margin-left:8px">＋ New</button>
  </header>
  <div class="search" id="searchWrap"><input id="search" type="search" placeholder="Filter threats…" autocomplete="off"></div>
  <div class="list" id="list"></div>
</aside>

<main id="main"><div class="empty">Select a threat from the list.</div></main>

<section id="preview"><p class="ptitle">Preview</p><div class="empty" style="margin-top:10vh">—</div></section>

<div class="toast" id="toast"></div>
<div class="saved-dialog" id="savedDialog"></div>

<script>
// ------------------------------------------------------------------ state --- //
const state = {
  schema: { threat: null, weakness: null, mitigation_link: null, mitigation: null },
  style: null,
  threats: [],          // brief list: [[id, title], ...]
  mitById: {},          // id -> { id, name, mitigation_class }
  mitList: [],          // brief list: [[id, name, class], ...]
  mitFilter: "",        // mitigations rail filter
  mitSelected: null,    // selected mitigation id
  currentMit: null,     // full mitigation card from GET /mitigations/{id}
  mitEditing: false,    // mitigations screen: edit mode
  mitDraft: null,       // mitigations screen: in-progress edits
  mitValidation: { errors: [], advice: [] },  // mapped from a failed PATCH/POST (no live endpoint)
  mitApOpen: null,      // anti_patterns open-card index set
  mitValOpen: null,     // validation open-card index set
  mitFaqOpen: null,     // faq open-card index set
  mitImplOpen: null,    // implementations open-card index set
  threatMits: null,     // [{id,title,mitigations}] — reverse index for "addresses threats"
  selected: null,       // selected threat id
  current: null,        // full threat record from GET /threats/{id}
  filter: "",
  editing: false,
  draft: null,          // in-progress edits
  validation: { errors: [], advice: [] },  // last /threats/validate result
  view: "structure",    // editor view: "structure" | "yaml"
  config: { repo_url: "" },  // GET /config
  screen: "overview",   // top-level screen: "overview" | "threats" | "mitigations" | "style"
  coverage: null,       // GET /style-guide/coverage
  health: null,         // GET /health/library — { stats, style_guide_coverage, issues, issue_count }
  railMode: "preview",  // threats right rail: "preview" | "guidance"
  guidance: null,       // { entity, field, targetId } of the focused form field
  styleSel: null,       // style screen: { entity, field } selected in the tree
  styleDraft: null,     // style screen: in-progress slot edits for the selected field
};
window.state = state;   // exposed for smoke checks / debugging

// ------------------------------------------------------------- helpers ----- //
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : {};
  if (!r.ok) throw new Error(data.detail || (method + " " + url + " → " + r.status));
  return data;
}
const j = url => api("GET", url);

let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = "toast", 2200);
}

// ------------------------------------------------------- schema readers ---- //
// The form vocabularies come from the JSON Schema, never hardcoded.
function resolveRef(rootSchema, ref) {
  // ref like "#/$defs/Weakness"
  const parts = ref.replace(/^#\//, "").split("/");
  let node = rootSchema;
  for (const p of parts) node = node && node[p];
  return node;
}
// Resolve a property node, following an items.$ref one level if present.
function itemSchema(rootSchema, prop) {
  if (prop && prop.items && prop.items.$ref) return resolveRef(rootSchema, prop.items.$ref);
  return prop && prop.items ? prop.items : prop;
}
// Enum values for a scalar prop (properties.harm) or an array-of-enum prop (properties.surface).
function enumValues(rootSchema, prop) {
  if (!prop) return [];
  if (Array.isArray(prop.enum)) return prop.enum;
  const it = itemSchema(rootSchema, prop);
  return (it && Array.isArray(it.enum)) ? it.enum : [];
}
const threatProp = name => (state.schema.threat.properties || {})[name];
const harmEnum = () => enumValues(state.schema.threat, threatProp("harm"));
const surfaceEnum = () => enumValues(state.schema.threat, threatProp("surface"));
const sourceEnum = () => enumValues(state.schema.threat, threatProp("source"));
// Weakness component enum — resolved via the standalone weakness schema.
const componentEnum = () => {
  const wp = state.schema.weakness && state.schema.weakness.properties;
  return wp && wp.component && Array.isArray(wp.component.enum) ? wp.component.enum : [];
};
// Weakness nature enum (targeted / secondary) — from the weakness schema.
const natureEnum = () => {
  const wp = state.schema.weakness && state.schema.weakness.properties;
  return wp && wp.nature && Array.isArray(wp.nature.enum) ? wp.nature.enum : [];
};
// Mitigation-link strength enum (gating / soft) — from the mitigation_link schema.
const strengthEnum = () => {
  const mp = state.schema.mitigation_link && state.schema.mitigation_link.properties;
  return mp && mp.strength && Array.isArray(mp.strength.enum) ? mp.strength.enum : [];
};

// --------------------------------------------------------------- boot ------ //
async function boot() {
  const [sThreat, sWeak, sMitLink, sMit, style, cov, tr, mi, cfg] = await Promise.all([
    j("/schema/threat"),
    j("/schema/weakness"),
    j("/schema/mitigation_link"),
    j("/schema/mitigation"),
    j("/style-guide"),
    j("/style-guide/coverage"),  // { overall, entities: [{entity_type, overall, fields:[{field_name, completeness, is_orphan}]}] }
    j("/threats"),          // brief: { threats: [[id, title], ...], count }
    j("/mitigations"),      // brief: { mitigations: [[id, name, class], ...], count }
    j("/config"),           // { repo_url } — empty string when unset
  ]);
  state.schema.threat = sThreat;
  state.schema.weakness = sWeak;
  state.schema.mitigation_link = sMitLink;
  state.schema.mitigation = sMit;
  state.style = style;
  state.coverage = cov;
  state.threats = tr.threats || [];
  state.mitList = mi.mitigations || [];
  state.mitById = Object.fromEntries(
    (mi.mitigations || []).map(([id, name, mclass]) => [id, { id, name, mitigation_class: mclass }])
  );
  state.config = cfg || { repo_url: "" };
}

// --------------------------------------------------------------- rail ------ //
function renderList() {
  const el = document.getElementById("list");
  const f = state.filter.toLowerCase();
  const items = state.threats.filter(([id, title]) => (id + " " + (title || "")).toLowerCase().includes(f));
  el.innerHTML = items.length ? items.map(([id, title]) => `
    <div class="row ${state.selected === id ? "active" : ""}" data-id="${esc(id)}">
      <span class="rid">${esc(id)}</span>
      <span class="rtitle">${esc(title)}</span>
    </div>`).join("") : '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = items.length + " / " + state.threats.length;
  el.querySelectorAll(".row").forEach(r => r.onclick = () => select(r.dataset.id));
}

async function select(id) {
  state.selected = id; state.editing = false; state.draft = null;
  state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  renderList();
  try {
    state.current = await j("/threats/" + encodeURIComponent(id));
  } catch (e) {
    state.current = null; toast(e.message, true);
  }
  renderDetail();
  renderPreview();
  document.getElementById("main").scrollTop = 0;
  validateDraft();   // populate advice for the Insights strip (non-blocking)
}

// ------------------------------------------------------------- detail ------ //
function renderDetail() {
  const m = document.getElementById("main");
  if (!state.selected || !state.current) {
    m.innerHTML = '<div class="empty">Select a threat from the list.</div>';
    return;
  }
  m.innerHTML = state.editing ? editThreat(state.current) : readThreat(state.current);
  wireDetail();
}

// ---- shared read-view helpers (both read views) --------------------------- //
// Each populated section sits on its own subtle surface (.readsec). Empty optional
// sections render NOTHING; their labels are gathered and summarized in one muted line
// so a stub entry reads as signal, not a wall of dashes.
function readsec(label, inner, sub) {
  return `<section class="readsec"><h3 class="slabel">${esc(label)}${sub ? ` <span class="sub">${sub}</span>` : ""}</h3>${inner}</section>`;
}
function notAuthoredLine(labels) {
  return labels.length
    ? `<p class="notauthored">Not authored yet: ${labels.map(l => esc(String(l).toLowerCase())).join(", ")}</p>`
    : "";
}
// Breadcrumb: "<Type> › <id>"; the type word clears the selection (back to the list).
function crumb(type, id) {
  return `<div class="crumb"><button type="button" class="crumb-type" data-crumb="${esc(type)}">${esc(type)}</button>
    <span class="crumb-sep">›</span><span class="crumb-id">${esc(id)}</span></div>`;
}
// Cross-screen jumps used by the read-view links (mirror overviewOpenThreat).
function jumpToThreat(id) { switchScreen("threats"); select(id); }
function jumpToMit(id) { switchScreen("mitigations"); selectMit(id); }
function clearThreatSelection() {
  state.selected = null; state.current = null;
  state.editing = false; state.draft = null;
  renderList(); renderDetail(); renderPreview();
}
function clearMitSelection() {
  state.mitSelected = null; state.currentMit = null;
  state.mitEditing = false; state.mitDraft = null;
  renderMitRail(); renderMitDetail(); renderMitPreview();
}

// Read view — the NEW threat fields.
function readThreat(t) {
  const badge = (cls, v) => `<span class="badge ${cls}">${esc(v)}</span>`;
  const surface = (t.surface || []).map(v => badge("type", v)).join(" ") || '<span class="placeholder">none</span>';
  const source = (t.source || []).map(v => badge("type", v)).join(" ") || '<span class="placeholder">none</span>';

  const weaknesses = (t.weaknesses || []).length
    ? `<ul class="plain">${t.weaknesses.map(w => `
        <li><div class="meta">${esc(w.component)}${w.nature ? " · " + esc(w.nature) : ""}</div>${esc(w.text)}</li>`).join("")}</ul>`
    : '<div class="warn">No weaknesses authored.</div>';

  // Linked mitigations — each card jumps to that mitigation.
  const mits = (t.mitigations || []).length
    ? (t.mitigations || []).map(l => {
        const mm = state.mitById[l.id];
        return `<div class="card jrow" data-jmit="${esc(l.id)}" title="Open ${esc(l.id)}">
          <div class="chead">
            <span class="cid">${esc(l.id)}</span>
            <span class="ctitle">${esc(mm ? mm.name : "(missing)")}</span>
            <span class="badge soft" style="margin-left:auto">${esc(l.strength || "")}</span>
          </div>
          ${l.rationale ? `<div class="rationale">${esc(l.rationale)}</div>` : ""}
        </div>`;
      }).join("")
    : '<p class="placeholder">None linked.</p>';

  const omitted = [];
  // An optional prose section: shown only when it has content; else recorded as omitted.
  const optProse = (label, v, sub) => {
    if (v && String(v).trim()) return readsec(label, `<div class="prose">${esc(v)}</div>`, sub);
    omitted.push(label); return "";
  };
  const refsHtml = (t.references || []).length
    ? readsec("References", `<ul class="plain">${t.references.map(r =>
        `<li><span class="meta">${esc(r.id)}</span> <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></li>`).join("")}</ul>`)
    : (omitted.push("references"), "");
  const tagsHtml = (t.tags || []).length
    ? readsec("Tags", `<div class="badges">${(t.tags || []).map(x => badge("tag", x)).join(" ")}</div>`)
    : (omitted.push("tags"), "");

  const sections = [
    readsec("Surface", `<div class="badges">${surface}</div>`, "— where the interaction happens"),
    readsec("Source", `<div class="badges">${source}</div>`, "— who or what drives it"),
    readsec("Weaknesses", weaknesses, "— architectural conditions"),
    optProse("Reachability", t.reachability, "— when NOT a live path"),
    readsec(`Mitigations (${(t.mitigations || []).length})`, mits),
    refsHtml,
    tagsHtml,
  ].join("");

  return `<div class="detail">
    ${crumb("Threats", t.id)}
    <div class="dhead">
      <div class="dicon">▲</div>
      <div class="dtitle">
        <h2>${esc(t.title)}</h2>
        <div class="did">${esc(t.id)}</div>
        <div class="hbadges badges">
          ${t.harm ? badge("harm", t.harm) : '<span class="badge soft" style="color:var(--crimson-600)">no harm</span>'}
        </div>
      </div>
      <div class="hactions">
        <button class="btn ghost" id="editBtn">✎ Edit</button>
        <button class="btn ghost" id="deleteBtn" title="Delete this threat">🗑 Delete</button>
      </div>
    </div>
    ${sections}
    ${notAuthoredLine(omitted)}
  </div>`;
}

// ---------------------------------------------------- style-guide bar ------ //
// Live guidance read from state.style.entities.<entity>.fields.<field>.
// Missing entries degrade gracefully (empty string, no hint, no panel).
function styleField(entity, field) {
  const ents = state.style && state.style.entities;
  const ent = ents && ents[entity];
  return (ent && ent.fields && ent.fields[field]) || null;
}
// One-line hint (the field's purpose), shown above the input at all times.
// The *From variants take a style-field-like object directly, so the style-guide
// editor's right pane can render the SAME markup fed from an in-progress draft.
function sgHintFrom(sf) {
  return (sf && sf.purpose) ? `<div class="sg-hint">${esc(sf.purpose)}</div>` : "";
}
function sgHint(entity, field) {
  return sgHintFrom(styleField(entity, field));
}
// Always-present one-line hint row (reserves height so inputs align even when a
// field has no style-guide purpose). Verbose guidance now lives in the right rail.
function hintRow(entity, field) {
  const sf = styleField(entity, field);
  const txt = (sf && sf.purpose) ? esc(sf.purpose) : "";
  return `<div class="sg-hint">${txt}</div>`;
}
// Expandable guidance panel: Include / Avoid / first example (+ "use example").
// opts.show forces the panel open (used by the always-on style-guide preview).
function sgPanelFrom(sf, targetId, opts) {
  if (!sf) return "";
  const list = (k, items) => `<div class="sg-sec"><span class="sg-k">${k}</span><ul>${
    items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const parts = [];
  if (sf.content_requirements && sf.content_requirements.length) parts.push(list("Include", sf.content_requirements));
  if (sf.avoid && sf.avoid.length) parts.push(list("Avoid", sf.avoid));
  if (sf.examples && sf.examples.length) {
    const ex = sf.examples[0];
    const btn = targetId
      ? `<button type="button" class="btn ghost sm sg-useex" data-target="${esc(targetId)}" data-example="${esc(encodeURIComponent(ex))}">use example</button>`
      : "";
    parts.push(`<div class="sg-sec"><span class="sg-k">Example</span><div class="sg-ex">${esc(ex)}</div>${btn}</div>`);
  }
  const cls = (opts && opts.show) ? "sg-panel show" : "sg-panel";
  return parts.length ? `<div class="${cls}">${parts.join("")}</div>` : "";
}
function sgPanel(entity, field, targetId) {
  return sgPanelFrom(styleField(entity, field), targetId);
}

// Edit form — built by walking the threat schema's field order.
// Only the schema-simple fields are editable here; weakness/mitigation editors are deferred.
const EDITABLE = new Set(["title", "harm", "surface", "source", "reachability", "tags"]);

function editThreat(t) {
  const d = state.draft;
  const yaml = state.view === "yaml";
  const order = Object.keys(state.schema.threat.properties || {});
  const blocks = [];
  for (const name of order) {
    if (name === "id" || name === "title") continue;   // id/title handled in the header
    if (name === "weaknesses") { blocks.push(weaknessesEditor()); continue; }
    if (name === "mitigations") { blocks.push(mitigationsEditor()); continue; }
    if (name === "references") { blocks.push(referencesEditor()); continue; }
    if (!EDITABLE.has(name)) continue;
    blocks.push(fieldEditor(name, d));
  }

  const body = yaml
    ? `<textarea class="yaml-view" id="yamlView" readonly spellcheck="false">${esc(emitThreatYaml(assembleThreat()))}</textarea>`
    : `<div id="errSummary" class="err-summary" style="display:none"></div>${blocks.join("")}`;

  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">▲</div>
      <div class="dtitle field" data-entity="threat" data-field="title" style="width:100%">
        ${hintRow("threat", "title")}
        <input class="f titlein" id="f_title" value="${esc(d.title)}">
        <div class="did" style="margin-top:6px">${esc(t.id)}</div>
      </div>
      <div class="hactions" style="flex-direction:column;align-items:flex-end;gap:8px">
        <div class="vtoggle">
          <button id="viewStructBtn" class="${yaml ? "" : "on"}">Structure</button>
          <button id="viewYamlBtn" class="${yaml ? "on" : ""}">YAML</button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn primary" id="saveBtn"${yaml ? " disabled" : ""}>✔ Save</button>
          <button class="btn ghost" id="cancelBtn">Cancel</button>
        </div>
      </div>
    </div>
    ${body}
  </div>`;
}

function fieldEditor(name, d) {
  // Each threat field is a SECTION: a semantic fieldset/legend (no card border).
  // The one-line hint reserves its row; verbose guidance lives in the right rail.
  const wrap = (label, inner, sub) =>
    `<fieldset class="field" data-entity="threat" data-field="${esc(name)}">
      <legend class="slabel">${esc(label)}${sub ? ` <span class="sub">${sub}</span>` : ""}</legend>
      ${hintRow("threat", name)}
      ${inner}
    </fieldset>`;
  if (name === "harm") {
    const opts = harmEnum().map(v => `<option value="${esc(v)}" ${v === d.harm ? "selected" : ""}>${esc(v)}</option>`).join("");
    return wrap("Harm", `<select class="f" id="f_harm">${opts}</select>`);
  }
  if (name === "surface" || name === "source") {
    const vals = name === "surface" ? surfaceEnum() : sourceEnum();
    const chosen = new Set(d[name] || []);
    const boxes = vals.map(v => `
      <label><input type="checkbox" data-set="${name}" value="${esc(v)}" ${chosen.has(v) ? "checked" : ""}>${esc(v)}</label>`).join("");
    return wrap(name, `<div class="checkset">${boxes}</div>`);
  }
  if (name === "reachability") {
    return wrap("Reachability",
      `<textarea class="f" id="f_reachability" rows="4" placeholder="NOT applicable if…">${esc(d.reachability)}</textarea>`,
      "— NOT applicable if…");
  }
  if (name === "tags") {
    return wrap("Tags",
      `<input class="f" id="f_tags" value="${esc((d.tags || []).join(", "))}" placeholder="comma, separated">`);
  }
  return "";
}

// Small helpers for card open-state (the ONLY heavy container is the card border).
function toggleSet(set, key) { if (!set) return; if (set.has(key)) set.delete(key); else set.add(key); }
// After splicing index `removed`, shift the remaining open indices down by one.
function shiftWkOpen(removed) {
  const next = new Set();
  (state.wkOpen || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  state.wkOpen = next;
}
function shiftRefOpen(removed) {
  const next = new Set();
  (state.refOpen || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  state.refOpen = next;
}

// Weaknesses — repeatable BORDERED cards bound to state.draft.weaknesses.
// First card expanded; the rest collapse to a one-line summary (component · text).
function weaknessesEditor() {
  const ws = state.draft.weaknesses || [];
  const comps = componentEnum();
  const nats = natureEnum();
  const open = state.wkOpen || new Set();
  const cards = ws.map((w, i) => {
    const isOpen = open.has(i);
    const summary = `${esc(w.component || "—")}${(w.text || "").trim() ? " · " + esc((w.text || "").trim().slice(0, 40)) : ""}`;
    const head = `<div class="ecard-head" data-widx="${i}">
        <button type="button" class="card-toggle wk-toggle" data-widx="${i}" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${isOpen ? "Weakness " + (i + 1) : summary}</span>
        <button type="button" class="cardx wk-remove" data-widx="${i}" title="Remove weakness">✕</button>
      </div>`;
    if (!isOpen) return `<div class="ecard wk-card collapsed" data-widx="${i}">${head}</div>`;
    const compOpts = comps.map(c => `<option value="${esc(c)}" ${c === w.component ? "selected" : ""}>${esc(c)}</option>`).join("");
    const natOpts = nats.map(n => `<option value="${esc(n)}" ${n === w.nature ? "selected" : ""}>${esc(n)}</option>`).join("");
    return `<div class="ecard wk-card open" data-widx="${i}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-entity="weakness" data-field="component">
        <h3 class="slabel">Component</h3>
        ${hintRow("weakness", "component")}
        <select class="f wk-component" data-widx="${i}">${compOpts}</select>
      </div>
      <div class="field" data-entity="weakness" data-field="text">
        <h3 class="slabel">Text</h3>
        ${hintRow("weakness", "text")}
        <textarea class="f wk-text" data-widx="${i}" id="wk_text_${i}" rows="3" placeholder="cause + where + defect">${esc(w.text || "")}</textarea>
      </div>
      <div class="field" data-entity="weakness" data-field="nature">
        <h3 class="slabel">Nature</h3>
        ${hintRow("weakness", "nature")}
        <select class="f wk-nature" data-widx="${i}">${natOpts}</select>
      </div>
      </div>
    </div>`;
  }).join("");
  return `<fieldset class="section wk-section">
    <legend class="slabel">Weaknesses <span class="sub">— architectural conditions</span></legend>
    ${cards}
    <button class="btn ghost" id="addWeakness">+ Add weakness</button></fieldset>`;
}

// Mitigation links — cards over state.current.mitigations (immediate server writes,
// separate from the draft/Save flow). Link/unlink/strength/rationale hit the API directly.
function mitigationsEditor() {
  // Links are immediate server writes, so they need the threat to exist first.
  if (state.draft && state.draft.isNew) {
    return `<fieldset class="section ml-section">
      <legend class="slabel">Mitigations</legend>
      <p class="placeholder">Save the threat first, then link mitigations.</p></fieldset>`;
  }
  const links = (state.current && state.current.mitigations) || [];
  const linkedIds = new Set(links.map(l => l.id));
  const strengths = strengthEnum();
  const open = state.mlOpen || new Set();
  const cards = links.length ? links.map(l => {
    const mm = state.mitById[l.id];
    const isOpen = open.has(l.id);
    const summary = `${esc(l.id)} · ${esc(mm ? mm.name : "(missing)")}`;
    const head = `<div class="ecard-head" data-mid="${esc(l.id)}">
        <button type="button" class="card-toggle ml-toggle" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${summary}</span>
        ${isOpen && l.strength ? `<span class="badge soft">${esc(l.strength)}</span>` : ""}
        <button type="button" class="cardx ml-unlink" title="Unlink mitigation">✕</button>
      </div>`;
    if (!isOpen) return `<div class="ecard ml-card collapsed" data-mid="${esc(l.id)}">${head}</div>`;
    const opts = strengths.map(s => `<option value="${esc(s)}" ${s === l.strength ? "selected" : ""}>${esc(s)}</option>`).join("");
    return `<div class="ecard ml-card open" data-mid="${esc(l.id)}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-entity="mitigation_link" data-field="strength">
        <h3 class="slabel">Strength</h3>
        ${hintRow("mitigation_link", "strength")}
        <select class="f ml-strength">${opts}</select>
      </div>
      <div class="field" data-entity="mitigation_link" data-field="rationale">
        <h3 class="slabel">Rationale</h3>
        ${hintRow("mitigation_link", "rationale")}
        <textarea class="f ml-rationale" id="ml_rat_${esc(l.id)}" rows="2" placeholder="why this control addresses this threat">${esc(l.rationale || "")}</textarea>
      </div>
      </div>
    </div>`;
  }).join("") : '<p class="placeholder">None linked.</p>';

  const unlinked = Object.values(state.mitById).filter(m => !linkedIds.has(m.id));
  const pickOpts = unlinked.map(m => `<option value="${esc(m.id)}">${esc(m.id)} — ${esc(m.name)}</option>`).join("");
  const picker = unlinked.length
    ? `<div class="link-row"><select class="f" id="mlPicker">${pickOpts}</select>
        <button class="btn ghost" id="mlLinkBtn">Link</button></div>`
    : '<p class="placeholder">All mitigations linked.</p>';

  return `<fieldset class="section ml-section">
    <legend class="slabel">Mitigations (${links.length})</legend>${cards}${picker}</fieldset>`;
}

// References — repeatable BORDERED cards bound to state.draft.references (same grammar
// as weaknesses). Each card holds an id + a url. First card expanded; the rest collapse
// to a one-line summary (id · url). The section carries the threat.references data-field
// so focusing any input shows that field's rail guidance; the per-item id/url inputs have
// no style entry of their own, so they degrade to no hint.
function referencesEditor() {
  const refs = state.draft.references || [];
  const open = state.refOpen || new Set();
  const cards = refs.map((r, i) => {
    const isOpen = open.has(i);
    const summary = `${esc(r.id || "—")}${(r.url || "").trim() ? " · " + esc((r.url || "").trim().slice(0, 48)) : ""}`;
    const head = `<div class="ecard-head" data-ridx="${i}">
        <button type="button" class="card-toggle ref-toggle" data-ridx="${i}" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${isOpen ? "Reference " + (i + 1) : summary}</span>
        <button type="button" class="cardx ref-remove" data-ridx="${i}" title="Remove reference">✕</button>
      </div>`;
    if (!isOpen) return `<div class="ecard ref-card collapsed" data-ridx="${i}">${head}</div>`;
    return `<div class="ecard ref-card open" data-ridx="${i}">
      ${head}
      <div class="ecard-body">
      <div class="field" data-field="id">
        <h3 class="slabel">Id</h3>
        <input class="f ref-id" data-ridx="${i}" value="${esc(r.id || "")}" placeholder="short label, e.g. owasp-llm01">
      </div>
      <div class="field" data-field="url">
        <h3 class="slabel">URL</h3>
        <input class="f ref-url" data-ridx="${i}" id="ref_url_${i}" value="${esc(r.url || "")}" placeholder="https://…">
      </div>
      </div>
    </div>`;
  }).join("");
  return `<fieldset class="field section ref-section" data-entity="threat" data-field="references">
    <legend class="slabel">References <span class="sub">— sources and prior art</span></legend>
    ${cards}
    <button class="btn ghost" id="addReference">+ Add reference</button></fieldset>`;
}

// --------------------------------------------------------------- wiring ---- //
function wireDetail() {
  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.onclick = enterEdit;
  const deleteBtn = document.getElementById("deleteBtn");
  if (deleteBtn) deleteBtn.onclick = deleteThreat;
  // Read view only: breadcrumb clears the selection; mitigation cards jump across.
  const crumbBtn = document.querySelector("#main .crumb-type");
  if (crumbBtn) crumbBtn.onclick = clearThreatSelection;
  document.querySelectorAll("#main [data-jmit]").forEach(el =>
    el.onclick = () => jumpToMit(el.dataset.jmit));
  const cancelBtn = document.getElementById("cancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => {
    // A brand-new, never-saved threat has no server record — drop the selection on cancel.
    const wasNew = state.draft && state.draft.isNew;
    state.editing = false; state.draft = null; state.view = "structure";
    state.railMode = "preview"; state.guidance = null;
    if (wasNew) { state.selected = null; state.current = null; renderList(); }
    renderDetail(); renderPreview();
  };
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick = saveThreat;
  const structBtn = document.getElementById("viewStructBtn");
  if (structBtn) structBtn.onclick = () => { state.view = "structure"; renderDetail(); };
  const yamlBtn = document.getElementById("viewYamlBtn");
  if (yamlBtn) yamlBtn.onclick = () => { state.view = "yaml"; renderDetail(); };
  if (state.editing && state.view === "structure") { wireThreatEdit(); applyValidation(); }
}

function enterEdit() {
  const t = state.current;
  state.draft = {
    title: t.title || "",
    harm: t.harm || (harmEnum()[0] || ""),
    surface: [...(t.surface || [])],
    source: [...(t.source || [])],
    reachability: t.reachability || "",
    tags: [...(t.tags || [])],
    weaknesses: (t.weaknesses || []).map(w => ({
      component: w.component, text: w.text || "", nature: w.nature || "targeted",
    })),
    references: (t.references || []).map(r => ({ id: r.id || "", url: r.url || "" })),
  };
  // Progressive disclosure: the FIRST repeatable card is expanded, the rest collapse.
  state.wkOpen = new Set((t.weaknesses || []).length ? [0] : []);
  state.mlOpen = new Set((t.mitigations || [])[0] ? [t.mitigations[0].id] : []);
  state.refOpen = new Set((t.references || []).length ? [0] : []);
  state.editing = true;
  state.railMode = "preview"; state.guidance = null;
  renderDetail();
  renderPreview();   // repaint the rail so the Guidance toggle enables
  validateDraft();   // seed the red/amber channels for the initial draft
}

// Create a brand-new threat: open a blank draft in edit mode. The record is only a
// client-side stub (isNew) until Save, which POSTs it. A new threat starts with no
// weaknesses, so validate/Save stays blocked until at least one is added — correct.
function newThreat() {
  const id = (window.prompt("New threat id (e.g. T-NEW-THREAT):") || "").trim();
  if (!id) return;
  if (state.threats.some(([tid]) => tid === id)) { toast("A threat with that id already exists", true); return; }
  const title = (window.prompt("Title (optional — you can edit it below):") || "").trim();
  const harm0 = harmEnum()[0] || "";
  state.selected = id;
  state.current = {
    id, title, harm: harm0, surface: [], source: [],
    weaknesses: [], reachability: "", mitigations: [], references: [], tags: [],
  };
  state.draft = {
    isNew: true,
    title, harm: harm0, surface: [], source: [],
    reachability: "", tags: [], weaknesses: [], references: [],
  };
  state.wkOpen = new Set(); state.mlOpen = new Set(); state.refOpen = new Set();
  state.editing = true; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  renderList(); renderDetail(); renderPreview();
  validateDraft();
}

// Delete an existing threat after a confirm. Removes its file server-side, then clears
// the selection and refreshes the rail. A never-saved (isNew) threat has no server record.
async function deleteThreat() {
  const id = state.selected;
  if (!id || (state.draft && state.draft.isNew)) return;
  if (!window.confirm(`Delete ${id}? This removes the threat and its mitigation links.`)) return;
  try {
    await api("DELETE", "/threats/" + encodeURIComponent(id));
  } catch (e) { toast(e.message, true); return; }
  const tr = await j("/threats");
  state.threats = tr.threats || [];
  state.selected = null; state.current = null; state.draft = null;
  state.editing = false; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  state.validation = { errors: [], advice: [] };
  renderList(); renderDetail(); renderPreview();
  toast("Threat deleted");
}

function wireThreatEdit() {
  const d = state.draft;
  const title = document.getElementById("f_title");
  if (title) title.oninput = () => d.title = title.value;
  const harm = document.getElementById("f_harm");
  if (harm) harm.onchange = () => d.harm = harm.value;
  const reach = document.getElementById("f_reachability");
  if (reach) reach.oninput = () => d.reachability = reach.value;
  const tags = document.getElementById("f_tags");
  if (tags) tags.oninput = () => d.tags = tags.value.split(",").map(s => s.trim()).filter(Boolean);
  document.querySelectorAll("[data-set]").forEach(cb => cb.onchange = () => {
    const set = new Set(d[cb.dataset.set]);
    if (cb.checked) set.add(cb.value); else set.delete(cb.value);
    d[cb.dataset.set] = [...set];
  });
  wireWeaknesses();
  wireMitigations();
  wireReferences();
}

// Mitigation-link cards: link/unlink/strength/rationale are immediate server writes.
function wireMitigations() {
  document.querySelectorAll(".ml-card").forEach(card => {
    const mid = card.dataset.mid;
    const strength = card.querySelector(".ml-strength");
    const rationale = card.querySelector(".ml-rationale");
    const persist = () => putMitLink(mid, strength ? strength.value : "gating", rationale ? rationale.value : "");
    if (strength) strength.onchange = persist;
    if (rationale) rationale.onblur = persist;
    const unlink = card.querySelector(".ml-unlink");
    if (unlink) unlink.onclick = e => { e.stopPropagation(); unlinkMit(mid); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => {
      if (e.target.closest(".ml-unlink")) return;   // unlink handles itself
      toggleSet(state.mlOpen, mid);
      renderDetail();
    };
  });
  const linkBtn = document.getElementById("mlLinkBtn");
  if (linkBtn) linkBtn.onclick = () => {
    const pick = document.getElementById("mlPicker");
    if (pick && pick.value) linkMit(pick.value);
  };
}

async function refreshCurrent() {
  state.current = await j("/threats/" + encodeURIComponent(state.selected));
}
const mitUrl = mid =>
  "/threats/" + encodeURIComponent(state.selected) + "/mitigations/" + encodeURIComponent(mid);

async function linkMit(mid) {
  try {
    await api("PUT", mitUrl(mid), { strength: "gating", rationale: "" });
    (state.mlOpen || (state.mlOpen = new Set())).add(mid);   // open the freshly linked card
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation linked");
  } catch (e) { toast(e.message, true); }
}
async function unlinkMit(mid) {
  try {
    await api("DELETE", mitUrl(mid));
    if (state.mlOpen) state.mlOpen.delete(mid);
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation unlinked");
  } catch (e) { toast(e.message, true); }
}
async function putMitLink(mid, strength, rationale) {
  try {
    await api("PUT", mitUrl(mid), { strength, rationale });
    await refreshCurrent(); renderDetail(); renderPreview();
    toast("Mitigation link updated");
  } catch (e) { toast(e.message, true); }
}

// Weakness cards edit state.draft.weaknesses in place; add/remove re-renders.
function wireWeaknesses() {
  const d = state.draft;
  document.querySelectorAll(".wk-card").forEach(card => {
    const i = +card.dataset.widx;
    const comp = card.querySelector(".wk-component");
    const text = card.querySelector(".wk-text");

    if (text) text.oninput = () => d.weaknesses[i].text = text.value;
    if (nat) nat.onchange = () => d.weaknesses[i].nature = nat.value;
    const rm = card.querySelector(".wk-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.weaknesses.splice(i, 1); shiftWkOpen(i); renderDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => {
      if (e.target.closest(".wk-remove")) return;   // remove handles itself
      toggleSet(state.wkOpen, i);
      renderDetail();
    };

  const add = document.getElementById("addWeakness");
  if (add) add.onclick = () => {
    d.weaknesses.push({ component: componentEnum()[0] || "", text: "", nature: "targeted" });
    (state.wkOpen || (state.wkOpen = new Set())).add(d.weaknesses.length - 1);   // open the new card

// Reference cards edit state.draft.references in place; add/remove re-renders.
function wireReferences() {
  const d = state.draft;
  document.querySelectorAll(".ref-card").forEach(card => {
    const i = +card.dataset.ridx;
    const id = card.querySelector(".ref-id");
    const url = card.querySelector(".ref-url");

    if (url) url.oninput = () => d.references[i].url = url.value;
    const rm = card.querySelector(".ref-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.references.splice(i, 1); shiftRefOpen(i); renderDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => {
      if (e.target.closest(".ref-remove")) return;   // remove handles itself
      toggleSet(state.refOpen, i);
      renderDetail();
    };
  });
  const add = document.getElementById("addReference");
  if (add) add.onclick = () => {

    renderDetail();
  };
}

// --------------------------------------------------- validation channels --- //
// Assemble the full threat the way the server wants it: the draft plus the id and
// the separately-managed pieces (mitigations/references live on state.current).
// Falls back to state.current when not editing, so preview/insights work in read view.
function assembleThreat() {
  const d = state.draft || {};
  const c = state.current || {};
  const pick = (k, dflt) => (d[k] !== undefined ? d[k] : (c[k] !== undefined ? c[k] : dflt));
  return {
    id: c.id,
    title: pick("title", ""),
    harm: pick("harm", undefined),
    surface: pick("surface", []),
    source: pick("source", []),
    weaknesses: pick("weaknesses", []),
    reachability: pick("reachability", ""),
    mitigations: c.mitigations || [],
    references: pick("references", []),
    tags: pick("tags", []),
  };
}

let validateTimer = null;
function scheduleValidate() { clearTimeout(validateTimer); validateTimer = setTimeout(validateDraft, 300); }

// POST the assembled threat; store errors (red, blocking) + advice (amber, soft).
async function validateDraft() {
  if (!state.current) return;
  try {
    const res = await api("POST", "/threats/validate", assembleThreat());
    state.validation = { errors: res.errors || [], advice: res.advice || [] };
  } catch (e) {
    state.validation = { errors: [{ field: "", msg: e.message }], advice: [] };
  }
  applyValidation();
  renderPreview();   // insights strip reads state.validation.advice
}

// An errored field can live inside a collapsed repeatable card, where its own
// .field wrapper is not in the DOM. Mark the collapsed card's head so the error is
// not silently hidden. Covers the threat (weaknesses/references) and mitigation
// (validation/faq) card kinds; clears stale marks first.
function markCollapsedCards(errors) {
  document.querySelectorAll(".ecard.collapsed.has-err").forEach(c => c.classList.remove("has-err"));
  const sel = {
    weaknesses: p => `.wk-card.collapsed[data-widx="${CSS.escape(p)}"]`,
    references: p => `.ref-card.collapsed[data-ridx="${CSS.escape(p)}"]`,
    validation: p => `.validation-card.collapsed[data-idx="${CSS.escape(p)}"]`,
    faq: p => `.faq-card.collapsed[data-idx="${CSS.escape(p)}"]`,
    implementations: p => `.implementation-card.collapsed[data-idx="${CSS.escape(p)}"]`,
  };
  (errors || []).forEach(e => {
    const parts = (e.field || "").split(".");
    if (parts.length < 2) return;
    const make = sel[parts[0]];
    if (!make) return;
    const card = document.querySelector(make(parts[1]));
    if (card) card.classList.add("has-err");
  });
}

// Map a dotted error path to the input's .field wrapper. Root/unmatched -> null.
function fieldEl(path) {
  if (!path) return null;
  const parts = path.split(".");
  if (parts[0] === "weaknesses" && parts.length === 3) {
    return document.querySelector(
      `.wk-card[data-widx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`
    );
  }
  if (parts[0] === "references" && parts.length === 3) {
    // Prefer the specific card's field (visible only when expanded); otherwise
    // fall back to the whole references section so the error still surfaces.
    return document.querySelector(
      `.ref-card[data-ridx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`
    ) || document.querySelector('.field[data-entity="threat"][data-field="references"]');
  }
  if (parts.length === 1) {
    return document.querySelector(`.field[data-entity="threat"][data-field="${CSS.escape(parts[0])}"]`);
  }
  return null;
}

function renderErrorSummary(errors) {
  const el = document.getElementById("errSummary");
  if (!el) return;
  if (!errors.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "block";
  el.innerHTML = `<strong>Fix these before saving:</strong><ul>${errors.map(e =>
    `<li>${e.field ? `<code>${esc(e.field)}</code> — ` : ""}${esc(e.msg)}</li>`).join("")}</ul>`;
}

// Paint the two channels onto the form: errors red (summary + inline), advice amber (inline only).
function applyValidation() {
  const { errors, advice } = state.validation;
  document.querySelectorAll(".fld-msg").forEach(e => e.remove());
  document.querySelectorAll(".field").forEach(f => f.classList.remove("has-err", "has-adv"));

  renderErrorSummary(errors);   // errors — RED — also shown in full at the top

  const place = (item, cls) => {
    const el = fieldEl(item.field);
    if (!el) return;
    el.classList.add(cls === "err" ? "has-err" : "has-adv");
    const msg = document.createElement("div");
    msg.className = "fld-msg " + cls;
    msg.textContent = item.msg;
    el.appendChild(msg);
  };
  errors.forEach(e => place(e, "err"));    // identical text to the summary, inline
  advice.forEach(a => place(a, "adv"));    // amber only, never in the summary, never blocking
  markCollapsedCards(errors);              // surface errors hidden inside collapsed cards

  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.disabled = errors.length > 0 || state.view === "yaml";
}

// --------------------------------------------------------- YAML emitter ---- //
// Tiny read-only emitter for the simple scalar/list/small-object shapes in a threat.
// Field order matches the on-disk order. No YAML library.
function yamlScalar(s) {
  s = String(s);
  if (s === "") return '""';
  const plain = /^[A-Za-z0-9][A-Za-z0-9 _\-./:()'?…]*$/.test(s)
    && !/: /.test(s) && !/:$/.test(s) && !/ #/.test(s)
    && !/^(true|false|null|yes|no|on|off|~)$/i.test(s);
  if (plain) return s;
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}
function emitThreatYaml(t) {
  const L = [];
  const scalar = (k, v) => {
    const s = v == null ? "" : String(v);
    if (/\n/.test(s)) { L.push(`${k}: |-`); s.split("\n").forEach(ln => L.push(`  ${ln}`)); }
    else L.push(`${k}: ${yamlScalar(s)}`);
  };
  const listScalars = (k, arr) => {
    if (!arr || !arr.length) { L.push(`${k}: []`); return; }
    L.push(`${k}:`);
    arr.forEach(v => L.push(`- ${yamlScalar(String(v))}`));
  };
  const listObjs = (k, arr, fields) => {
    if (!arr || !arr.length) { L.push(`${k}: []`); return; }
    L.push(`${k}:`);
    arr.forEach(o => fields.forEach(([f], idx) => {
      const prefix = idx === 0 ? "- " : "  ";
      const v = o[f];
      const s = v == null ? "" : String(v);
      if (/\n/.test(s)) { L.push(`${prefix}${f}: |-`); s.split("\n").forEach(ln => L.push(`    ${ln}`)); }
      else L.push(`${prefix}${f}: ${yamlScalar(s)}`);
    }));
  };
  scalar("id", t.id);
  scalar("title", t.title);
  scalar("harm", t.harm);
  listScalars("surface", t.surface);
  listScalars("source", t.source);
  listObjs("weaknesses", t.weaknesses, [["component"], ["text"], ["nature"]]);
  scalar("reachability", t.reachability);
  listObjs("mitigations", t.mitigations, [["id"], ["strength"], ["rationale"]]);
  listObjs("references", t.references, [["id"], ["url"]]);
  listScalars("tags", t.tags);
  return L.join("\n");
}

// --------------------------------------------------------------- save ------ //
async function saveThreat() {
  if (state.view === "yaml") return;                 // YAML view is read-only
  if (state.validation.errors.length) return;        // blocked while errors remain
  const d = state.draft;
  const isNew = !!d.isNew;
  const body = {
    title: d.title,
    harm: d.harm,
    surface: d.surface,
    source: d.source,
    reachability: d.reachability,
    tags: d.tags,
    weaknesses: d.weaknesses,
    references: d.references,
  };
  // A new threat is POSTed as a full record (id required, no links yet); an existing
  // one is PATCHed by id. Duplicate id on create → 409, surfaced in the red channel.
  const isCreate = isNew;
  const url = isCreate ? "/threats" : "/threats/" + encodeURIComponent(state.selected);
  if (isCreate) { body.id = state.selected; body.mitigations = []; }
  const r = await fetch(url, {
    method: isCreate ? "POST" : "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    // Map the server's Pydantic error response back into the RED channel.
    const data = await r.json().catch(() => ({}));
    let errs;
    if (Array.isArray(data.detail)) {
      errs = data.detail.map(e => ({
        field: (e.loc || []).filter(x => x !== "body").join("."),
        msg: e.msg || "invalid",
      }));
    } else {
      errs = [{ field: "", msg: data.detail || ("PATCH " + url + " → " + r.status) }];
    }
    state.validation = { errors: errs, advice: state.validation.advice };
    applyValidation();
    toast("Save blocked — fix the errors", true);
    return;
  }
  const getUrl = "/threats/" + encodeURIComponent(state.selected);
  state.current = await j(getUrl);
  state.editing = false; state.draft = null; state.view = "structure";
  state.railMode = "preview"; state.guidance = null;
  if (isCreate) {
    // Pull the fresh brief list so the new threat shows in the rail (kept sorted server-side).
    const tr = await j("/threats");
    state.threats = tr.threats || [];
  } else {
    // reflect a possible title change in the rail
    const row = state.threats.find(r => r[0] === state.selected);
    if (row) row[1] = state.current.title;
  }
  state.validation = { errors: [], advice: [] };
  renderList(); renderDetail(); renderPreview();
  validateDraft();
  showSavedDialog("catalog/threats/" + state.selected + ".yaml");
}

// The write lands in a YAML file; the next step is a pull request. Name the exact
// file (any catalog path) and, when a repo is configured, offer an "Edit on GitHub"
// escape hatch. Shared by the threat editor and the style-guide editor.
function showSavedDialog(path) {
  const repo = (state.config && state.config.repo_url || "").replace(/\/+$/, "");
  const p = esc(path);
  const editLink = repo
    ? `<a href="${esc(repo)}/edit/main/${p}" target="_blank" rel="noopener">Edit on GitHub ↗</a>`
    : "";
  const el = document.getElementById("savedDialog");
  el.innerHTML = `Saved to <code>${p}</code> — commit and open a pull request.
    <div class="sd-actions">${editLink}<button class="sd-close" id="sdClose">Dismiss</button></div>`;
  el.classList.add("show");
  document.getElementById("sdClose").onclick = () => el.classList.remove("show");
}

// ------------------------------------------------------------- right rail -- //
// The right rail has two modes: Preview (default) and Guidance. Guidance auto-
// selects when a form field gains focus (see the #main focusin handler) and shows
// that field's authoring guidance; it renders into the rail so the FORM never
// reflows. Preview shows the assembled threat as a person reads it.
function renderPreview() {
  const el = document.getElementById("preview");
  const guiding = state.editing && state.railMode === "guidance";
  const toggle = `<div class="rail-modes">
      <button type="button" data-mode="preview" class="${guiding ? "" : "on"}">Preview</button>
      <button type="button" data-mode="guidance" class="${guiding ? "on" : ""}"${state.editing ? "" : " disabled"}>Guidance</button>
    </div>`;
  el.innerHTML = toggle + `<div id="railBody">${guiding ? guidanceHtml() : previewHtml()}</div>`;
  wireRail();
}

// Guidance for the currently focused field, fed live from state.style via
// styleField/sgPanelFrom (Include / Avoid / Example + "use example"). Degrades
// gracefully when a field has no style entry.
function guidanceHtml() {
  const g = state.guidance;
  if (!g) return '<p class="placeholder">Focus a field to see its authoring guidance.</p>';
  const sf = styleField(g.entity, g.field);
  const head = `<p class="rg-field">Guidance · <b>${esc(g.field)}</b> <span style="text-transform:none;letter-spacing:0;font-weight:400">(${esc(g.entity)})</span></p>`;
  if (!sf) return `<div class="rail-guide">${head}<p class="placeholder">No style-guide entry for this field yet.</p></div>`;
  const hint = sgHintFrom(sf);
  const panel = sgPanelFrom(sf, g.targetId, { show: true });
  const body = (hint + panel) || '<p class="placeholder">No guidance authored yet.</p>';
  return `<div class="rail-guide">${head}${body}</div>`;
}

// Wire the rail: mode toggle, plus the "use example" button (now living in the
// rail) which writes into the focused field WITHOUT blurring it (mousedown guard).
function wireRail() {
  const el = document.getElementById("preview");
  el.querySelectorAll(".rail-modes button").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    state.railMode = b.dataset.mode;
    renderRight();
  });
  el.querySelectorAll(".sg-useex").forEach(b => {
    b.onmousedown = e => e.preventDefault();   // keep focus on the field
    b.onclick = () => {
      const t = document.getElementById(b.dataset.target);
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) {
        t.value = decodeURIComponent(b.dataset.example);
        t.dispatchEvent(new Event("input"));
        t.focus();
      }
    };
  });
}

// The assembled threat as a person reads it, plus a soft Insights strip.
function previewHtml() {
  if (!state.current) return '<div class="empty" style="margin-top:10vh">—</div>';
  const t = assembleThreat();
  const list = arr => (arr || []).map(esc).join(", ");
  const surface = (t.surface || []).length ? list(t.surface) : "—";
  const source = (t.source || []).length ? list(t.source) : "—";

  const weaknesses = (t.weaknesses || []).length
    ? `<ul>${t.weaknesses.map(w =>
        `<li>At <b>${esc(w.component)}</b>, ${esc(w.text || "…")}${w.nature ? ` <i>(${esc(w.nature)})</i>` : ""}</li>`).join("")}</ul>`
    : '<p class="placeholder">No weaknesses authored.</p>';

  const mits = t.mitigations || [];
  const gating = mits.filter(m => m.strength === "gating");
  const soft = mits.filter(m => m.strength !== "gating");
  const mitLine = grp => grp.length
    ? `<ul>${grp.map(m => `<li>${esc((state.mitById[m.id] && state.mitById[m.id].name) || m.id)}</li>`).join("")}</ul>`
    : '<p class="placeholder">none</p>';

  // Insights — soft, never blocking: server advice + a client-side references note.
  const notes = ((state.validation && state.validation.advice) || []).map(a => a.msg);
  if (!(t.references || []).length) notes.push("no references yet");

  return `
    <div class="pv">
      <h2 class="pv-title">${esc(t.title) || '<span class="placeholder">Untitled</span>'}</h2>
      <p class="pv-harm">Harm: ${t.harm ? `<span class="badge harm">${esc(t.harm)}</span>` : '<span class="placeholder">none</span>'}</p>
      <div class="pv-sec"><p class="pv-k">Surface / Source</p><p>Happens at <b>${surface}</b>, driven by <b>${source}</b>.</p></div>
      <div class="pv-sec"><p class="pv-k">Weaknesses</p>${weaknesses}</div>
      <div class="pv-sec"><p class="pv-k">Mitigations</p>
        <p>Gating (${gating.length})</p>${mitLine(gating)}
        <p>Soft (${soft.length})</p>${mitLine(soft)}
      </div>
      <div class="pv-sec"><p class="pv-k">Reachability carve-out</p>${
        t.reachability ? `<div class="carve">${esc(t.reachability)}</div>` : '<p class="placeholder">not authored</p>'}</div>
    </div>
    <div class="insights">
      <p class="ptitle">Insights</p>
      ${notes.length ? `<ul>${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : '<p class="ok">Nothing flagged.</p>'}
    </div>`;
}

// ===================================================================== //
// Screen switcher — two screens share the rail | editor | preview panes. //
// ===================================================================== //
function switchScreen(name) {
  state.screen = name;
  document.querySelectorAll("#screens button").forEach(b => b.classList.toggle("on", b.dataset.screen === name));
  const titles = { overview: "Keel · Overview", threats: "Keel · Threats", mitigations: "Keel · Mitigations", style: "Keel · Style guide" };
  document.getElementById("railTitle").textContent = titles[name] || "Keel";
  // Overview and the style guide have no id filter; hide the search box for them.
  const noSearch = name === "style" || name === "overview";
  document.getElementById("searchWrap").style.display = noSearch ? "none" : "";
  const search = document.getElementById("search");
  if (search) {
    search.placeholder = name === "mitigations" ? "Filter mitigations…" : "Filter threats…";
    search.value = name === "mitigations" ? state.mitFilter : state.filter;
  }
  const newBtn = document.getElementById("newThreatBtn");
  if (newBtn) {
    // ＋ New only makes sense on the two entity screens.
    newBtn.style.display = (name === "style" || name === "overview") ? "none" : "";
    newBtn.title = name === "mitigations" ? "Create a new mitigation" : "Create a new threat";
  }
  renderRail(); renderMain(); renderRight();
  if (name === "overview") loadOverview();   // refresh the dashboard on each entry
}
function renderRail() {
  if (state.screen === "overview") return renderOverviewRail();
  if (state.screen === "style") return renderStyleRail();
  if (state.screen === "mitigations") return renderMitRail();
  return renderList();
}
function renderMain() {
  if (state.screen === "overview") return renderOverviewMain();
  if (state.screen === "style") return renderStyleDetail();
  if (state.screen === "mitigations") return renderMitDetail();
  return renderDetail();
}
function renderRight() {
  if (state.screen === "overview") return renderOverviewRight();
  if (state.screen === "style") return renderStylePreview();
  if (state.screen === "mitigations") return renderMitPreview();
  return renderPreview();
}

// ===================================================================== //
// Overview screen — a read-only dashboard: counts, style-guide coverage, //
// and soft "gaps to review" whose ids open the affected threat. Reads    //
// GET /health/library + GET /style-guide/coverage; nothing here blocks.   //
// ===================================================================== //
async function loadOverview() {
  try {
    const [h, cov] = await Promise.all([j("/health/library"), j("/style-guide/coverage")]);
    state.health = h;
    state.coverage = cov;
  } catch (e) {
    toast(e.message, true);
    state.health = state.health || { stats: {}, issues: {}, issue_count: 0 };
  }
