name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Validate catalog
        run: uv run keel validate

      - name: Build database from the catalog
        run: |
          uv run alembic upgrade head
          uv run keel seed

      - name: Test
        run: uv run pytest
